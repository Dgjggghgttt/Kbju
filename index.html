function renderReportTab(content, fab){
  fab.innerHTML = '';
  const days = [];
  // последние 7 дней включая сегодня
  for(let i=6;i>=0;i--) days.push(shiftDate(todayStr(), -i));
  const rows = [];
  for(const d of days){
    const e = getDiary(d);
    const tot = computeTotals(e);
    const bg = baseGoals(d);
    rows.push({date:d, train:isTrainingDay(d), goalKcal:bg.kcal, goalP:bg.protein, goalF:bg.fat, goalC:bg.carbs, ...tot});
  }
  const today = todayStr();
  const withData = rows.filter(function(r){ return r.kcal > 0; }).map(function(r){
    var burn = dayBikeBurn(r.date);
    return Object.assign({}, r, { netKcal: r.kcal - burn, bike: burn });
  });
  const avg = (key)=> withData.length ? round(withData.reduce((s,r)=>s+r[key],0)/withData.length) : 0;
  const avgGoal = (key)=> withData.length ? round(withData.reduce((s,r)=>s+r[key],0)/withData.length) : 0;
  var avgKcal = avg('netKcal'), avgP = avg('protein'), avgF = avg('fat'), avgC = avg('carbs');
  var avgBike = avg('bike');
  var gKcal = avgGoal('goalKcal'), gP = avgGoal('goalP'), gF = avgGoal('goalF'), gC = avgGoal('goalC');
  function overStyle(val, goal){
    return (val > goal) ? 'color:var(--red);font-weight:700;' : '';
  }

  const sortedW = [...weightLog].sort((a,b)=>a.date.localeCompare(b.date));
  const wFirst = sortedW[0], wLast = sortedW[sortedW.length-1];
  const wDelta = (wFirst && wLast && wFirst!==wLast) ? round(wLast.kg - wFirst.kg) : null;
  var weightByDate = {};
  sortedW.forEach(function(w){ weightByDate[w.date] = w.kg; });

function buildDietSummaryForAI(){
  var div = dietDiversity(7);
  var lines = [];
  lines.push('Цели: '+goals.kcal+' ккал, Б'+goals.protein+' Ж'+goals.fat+' У'+goals.carbs+', клетчатка '+ (goals.fiberTarget||28)+' г, овощи+фрукты '+(goals.vegFruitTarget||500)+' г.');
  lines.push('За 7 дней: уникальных продуктов '+div.unique+', индекс разнообразия '+div.score+'/100.');
  lines.push('Средние: клетчатка '+round(div.avgFiber)+' г, овощи '+round(div.avgVeg)+' г, фрукты '+round(div.avgFruit)+' г.');
  lines.push('Группы (число записей): овощи '+(div.groups.veg||0)+', фрукты '+(div.groups.fruit||0)+', крупы '+(div.groups.grain||0)+', белок '+(div.groups.protein||0)+', молочное '+(div.groups.dairy||0)+'.');
  lines.push('Продукты: '+(div.productNames.slice(0,40).join(', ')||'нет данных')+(div.productNames.length>40?'…':''));
  var t = computeTotals(getDiary(todayStr()));
  lines.push('Сегодня: '+round(t.kcal)+' ккал, Б'+round(t.protein)+' Ж'+round(t.fat)+' У'+round(t.carbs)+', клетчатка '+round(t.fiber)+' г, овощи '+round(t.veg)+' фрукты '+round(t.fruit)+'.');
  var w = currentWeightKg();
  if(w) lines.push('Вес сейчас: '+w+' кг.');
  return lines.join('\n');
}

function fallbackCopyText(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
    showToast('Сводка скопирована');
  }catch(e){
    showToast('Не удалось скопировать — выдели текст вручную');
  }
  document.body.removeChild(ta);
}

function collectAllData(){
  var diary = {};
  // collect known diary keys from cache + scan localStorage if possible
  Object.keys(diaryCache).forEach(function(d){ diary[d] = diaryCache[d]; });
  try{
    if(_storageOk){
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('diary:')===0){
          var date = k.slice(6);
          if(!diary[date]){
            try{ diary[date] = JSON.parse(localStorage.getItem(k)); }catch(e){}
          }
        }
      }
    }
  }catch(e){}
  var workouts = {};
  Object.keys(workoutCache).forEach(function(d){ workouts[d] = workoutCache[d]; });
  try{
    if(_storageOk){
      for(var j=0;j<localStorage.length;j++){
        var kk = localStorage.key(j);
        if(kk && kk.indexOf('workout:')===0){
          var wd = kk.slice(8);
          if(!workouts[wd]){
            try{ workouts[wd] = JSON.parse(localStorage.getItem(kk)); }catch(e){}
          }
        }
      }
    }
  }catch(e){}
  var bike = {};
  Object.keys(bikeCache).forEach(function(d){ if(bikeCache[d]) bike[d] = bikeCache[d]; });
  try{
    if(_storageOk){
      for(var bi=0;bi<localStorage.length;bi++){
        var bk = localStorage.key(bi);
        if(bk && bk.indexOf('bike:')===0){
          var bd = bk.slice(5);
          if(!bike[bd]){
            try{ bike[bd] = JSON.parse(localStorage.getItem(bk)); }catch(e){}
          }
        }
      }
    }
  }catch(e){}
  return {
    version: 1,
    products: products,
    goals: goals,
    weightLog: weightLog,
    measureLog: measureLog,
    creatineLog: creatineLog,
    favorites: favorites,
    trainingDays: trainingDays,
    exercises: exercises,
    mealPlan: mealPlan,
    shopChecked: shopChecked,
    inventory: inventory,
    diary: diary,
    workouts: workouts,
    bike: bike
  };
}

function exportData(){
  try{
    var data = collectAllData();
    var json = JSON.stringify(data, null, 2);
    // try download
    var blob = new Blob([json], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'kbju-backup.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    // also copy to clipboard as fallback
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(function(){
        showToast('Скопировано + файл');
      }).catch(function(){ showToast('Файл сохранён'); });
    } else {
      showToast('Файл сохранён');
    }
  }catch(e){
    showToast('Ошибка экспорта');
  }
}

function importData(ev){
  var file = ev.target.files && ev.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object') throw new Error('bad');
      if(data.products && data.products.length) products = data.products;
      if(data.goals) goals = data.goals;
      if(data.weightLog) weightLog = data.weightLog;
      if(data.measureLog) measureLog = data.measureLog;
      if(data.creatineLog) creatineLog = data.creatineLog;
      if(data.favorites) favorites = data.favorites;
      if(data.trainingDays) trainingDays = data.trainingDays;
      if(data.exercises) exercises = data.exercises;
      sSet('products', products);
      sSet('goals', goals);
      sSet('weightLog', weightLog);
      sSet('measureLog', measureLog);
      sSet('creatineLog', creatineLog);
      sSet('favorites', favorites);
      sSet('trainingDays', trainingDays);
      sSet('exercises', exercises);
      if(data.mealPlan && typeof data.mealPlan === 'object'){ mealPlan = data.mealPlan; sSet('mealPlan', mealPlan); }
      if(data.shopChecked && typeof data.shopChecked === 'object'){ shopChecked = data.shopChecked; sSet('shopChecked', shopChecked); }
      if(data.inventory && typeof data.inventory === 'object'){ inventory = data.inventory; sSet('inventory', inventory); }
      diaryCache = {};
      if(data.diary){
        Object.keys(data.diary).forEach(function(date){
          var entries = data.diary[date] || [];
          diaryCache[date] = entries;
          sSet('diary:'+date, entries);
        });
      }
      if(data.workouts){
        workoutCache = {};
        Object.keys(data.workouts).forEach(function(date){
          var list = data.workouts[date] || [];
          workoutCache[date] = list;
          sSet('workout:'+date, list);
        });
      }
      if(data.bike){
        bikeCache = {};
        Object.keys(data.bike).forEach(function(date){
          var b = data.bike[date];
          if(b && b.km > 0){
            bikeCache[date] = { km: b.km, kcal: b.kcal != null ? b.kcal : bikeKcalFromKm(b.km) };
            sSet('bike:'+date, bikeCache[date]);
          }
        });
      }
      showToast('Данные импортированы');
      render();
    }catch(e){
      showToast('Не удалось прочитать файл');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

      gramsEl.value = btn.dataset.g;
      refreshUnitUI();
      updateLive();
    };
  });
  document.querySelectorAll('#quickPortions [data-n]').forEach(function(btn){
    btn.onclick = function(){
      amountUnit = 'portions';
      gramsEl.value = btn.dataset.n;
      refreshUnitUI();
      updateLive();
    };
  });
  var ugBtn = document.getElementById('unitGrams');
  var upBtn = document.getElementById('unitPortions');
  if(ugBtn) ugBtn.onclick = function(){
    if(amountUnit === 'portions' && productHasPortion(selected)){
      var n = parseFloat(gramsEl.value)||0;
      gramsEl.value = n ? round(n * selected.portionGrams) : '';
    }
    amountUnit = 'grams';
    refreshUnitUI();
    updateLive();
  };
  if(upBtn) upBtn.onclick = function(){
    if(!productHasPortion(selected)) return;
    if(amountUnit === 'grams'){
      var g = parseFloat(gramsEl.value)||0;
      gramsEl.value = g ? (Math.round(g / selected.portionGrams * 100) / 100) : '';
    }
    amountUnit = 'portions';
    refreshUnitUI();
    updateLive();
  };

  function setMode(m){
    mode = m;
    productModeEl.style.display = m==='product' ? '' : 'none';
    customModeEl.style.display = m==='custom' ? '' : 'none';
    modeProdBtn.className = 'btn ' + (m==='product'?'primary':'ghost');
    modeCustomBtn.className = 'btn ' + (m==='custom'?'primary':'ghost');
    modeProdBtn.style.flex='1'; modeProdBtn.style.padding='10px'; modeProdBtn.style.fontSize='13px';
    modeCustomBtn.style.flex='1'; modeCustomBtn.style.padding='10px'; modeCustomBtn.style.fontSize='13px';
  }
  modeProdBtn.onclick = function(){ setMode('product'); };
  modeCustomBtn.onclick = function(){ setMode('custom'); };

  function renderResults(q){
    var qLower = (q||'').toLowerCase();
    var list = products.filter(function(p){ return p.name.toLowerCase().indexOf(qLower) !== -1; });
    // pinned + frequent first
    list.sort(function(a,b){
      var ra = favoriteRank(a.id);
      var rb = favoriteRank(b.id);
      if(ra !== rb) return ra - rb;
      return a.name.localeCompare(b.name);
    });
    resultsEl.innerHTML = list.map(function(p){
      var star = isFavorite(p.id) ? '★' : '☆';
      var pinned = favorites.indexOf(p.id) >= 0;
      var sm = p.kcal+' ккал/100г';
      if(productHasPortion(p)) sm += ' · 1 '+p.portionName+'='+p.portionGrams+'г';
      return `<div class="search-item ${selected&&selected.id===p.id?'selected':''}" data-pick="${p.id}">
        <span><span data-fav="${p.id}" style="margin-right:6px;cursor:pointer;${pinned?'color:var(--amber)':''}">${star}</span>${p.name}</span>
        <span class="sm">${sm}</span>
      </div>`;
    }).join('') || `<div class="search-item" style="color:var(--muted)">Ничего не найдено</div>`;
    resultsEl.querySelectorAll('[data-pick]').forEach(function(el){
      el.onclick = function(ev){
        if(ev.target && ev.target.getAttribute && ev.target.getAttribute('data-fav')){
          ev.stopPropagation();
          toggleFavorite(ev.target.getAttribute('data-fav'));
          renderResults(searchEl.value);
          return;
        }
        selected = products.find(function(p){ return p.id===el.dataset.pick; });
        if(productHasPortion(selected)){
          amountUnit = 'portions';
          if(!gramsEl.value) gramsEl.value = '1';
        } else {
          amountUnit = 'grams';
        }
        refreshUnitUI();
        renderResults(searchEl.value);
        updateLive();
      };
    });
  }
  function updateLive(){
    var g = amountToGrams();
    if(selected && g>0){
      var f = g/100;
      var rem = remainingMacros(currentDate);
      var html = '≈ '+round(selected.kcal*f)+' ккал · Б'+round(selected.protein*f)+' Ж'+round(selected.fat*f)+' У'+round(selected.carbs*f);
      if(amountUnit === 'portions' && productHasPortion(selected)){
        html += '<div style="margin-top:2px;">= '+round(g)+' г</div>';
      } else if(productHasPortion(selected)){
        var pl = formatPortionLine(selected, g);
        if(pl) html += '<div style="margin-top:2px;">≈ '+pl+'</div>';
      }
      html += '<div style="margin-top:4px;opacity:.85;">Остаток дня: '+round(rem.kcal)+' ккал · Б'+round(rem.protein)+' Ж'+round(rem.fat)+' У'+round(rem.carbs)+'</div>';
      var alts = suggestAlternatives(selected, g, rem);
      if(alts.length){
        html += '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--red);">';
        alts.forEach(function(a){ html += '<div style="margin:4px 0;line-height:1.35;">'+a.text+'</div>'; });
        html += '</div>';
      }
      liveEl.innerHTML = html;
    } else {
      liveEl.textContent = '';
    }
  }
  renderResults('');
  if(searchEl) searchEl.oninput = function(){ renderResults(searchEl.value); };
  if(gramsEl) gramsEl.oninput = updateLive;
  // when editing: if product has portion and grams fits, offer portions mode
  if(selected && productHasPortion(selected) && existing && existing.grams){
    var n = existing.grams / selected.portionGrams;
    if(Math.abs(n - Math.round(n*2)/2) < 0.08){
      amountUnit = 'portions';
      gramsEl.value = Math.round(n*2)/2;
    }
  }
  refreshUnitUI();
  updateLive();
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = function(e){ if(e.target.id==='ov') closeModal(); };
  document.getElementById('saveBtn').onclick = function(){
    var entries = getDiary(currentDate);
    var timeVal = (document.getElementById('entryTime').value || nowTimeStr());
    if(mode === 'product'){
      if(!selected){ showToast('Выбери продукт'); return; }
      var g = amountToGrams();
      if(!g || g<=0){ showToast(amountUnit==='portions'?'Укажи порции':'Укажи граммы'); return; }
      g = Math.round(g * 10) / 10;
      if(isEdit){
        existing.productId = selected.id;
        existing.grams = g;
        existing.meal = meal;
        existing.time = timeVal;
        existing.snap = snapshotFromProduct(selected, g);
        delete existing.custom;
        delete existing.name;
        delete existing.kcal;
        delete existing.protein;
        delete existing.fat;
        delete existing.carbs;
      } else {
        entries.push({id:uid(), productId:selected.id, grams:g, meal:meal, time:timeVal, snap: snapshotFromProduct(selected, g)});
        invDeduct(selected.id, g);
      }
    } else {
      var name = (document.getElementById('customName').value || '').trim() || 'Свой приём';
      var kcal = parseFloat(document.getElementById('customKcal').value);
      var protein = parseFloat(document.getElementById('customProtein').value) || 0;
      var fat = parseFloat(document.getElementById('customFat').value) || 0;
      var carbs = parseFloat(document.getElementById('customCarbs').value) || 0;
      if(isNaN(kcal) || kcal < 0){ showToast('Укажи калории'); return; }
      if(isEdit){
        existing.custom = true;
        existing.name = name;
        existing.kcal = kcal;
        existing.protein = protein;
        existing.fat = fat;
        existing.carbs = carbs;
        existing.meal = meal;
        existing.time = timeVal;
        delete existing.productId;
        delete existing.grams;
        delete existing.snap;
      } else {
        entries.push({id:uid(), custom:true, name:name, kcal:kcal, protein:protein, fat:fat, carbs:carbs, meal:meal, time:timeVal});
      }
    }
    saveDiary(currentDate, entries);
    closeModal();
    render();
  };
}

function esc(s){
  return String(s==null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function getPlan(date){
  var p = mealPlan[date];
  return Array.isArray(p) ? p : [];
}
function savePlan(date, list){
  if(list && list.length) mealPlan[date] = list;
  else delete mealPlan[date];
  sSet('mealPlan', mealPlan);
}
function planWeekDates(mon){
  var a = [];
  for(var i=0;i<7;i++) a.push(shiftDate(mon, i));
  return a;
}
function fmtWeekRange(mon){
  var months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  var s = new Date(mon+'T00:00:00');
  var e = new Date(shiftDate(mon, 6)+'T00:00:00');
  if(s.getMonth() === e.getMonth()){
    return s.getDate()+'–'+e.getDate()+' '+months[s.getMonth()];
  }
  return s.getDate()+' '+months[s.getMonth()]+' – '+e.getDate()+' '+months[e.getMonth()];
}
function fmtPlanDay(date){
  var names = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  var months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  var d = new Date(date+'T00:00:00');
  return names[d.getDay()]+', '+d.getDate()+' '+months[d.getMonth()];
}
function macrosOfProduct(p, grams){
  var f = (grams||0)/100;
  return {
    kcal: (p.kcal||0)*f, protein: (p.protein||0)*f,
    fat: (p.fat||0)*f, carbs: (p.carbs||0)*f, fiber: (p.fiber||0)*f
  };
}
function ensureStaple(s){
  var n = s.name.trim().toLowerCase();
  var ex = products.find(function(p){ return (p.name||'').trim().toLowerCase() === n; });
  if(ex) return ex;
  var np = Object.assign({ id: uid() }, s);
  ensureProductMeta(np);
  products.push(np);
  sSet('products', products);
  return np;
}
function planCandidates(){
  var counts = productUsageCounts();
  var dbNames = {};
  products.forEach(function(p){ dbNames[(p.name||'').trim().toLowerCase()] = true; });
  function rank(p){ return favorites.indexOf(p.id) >= 0 ? -1e6 : -(counts[p.id]||0); }
  var list = products.filter(function(p){ return !p.excludeFromPlan; }).slice().sort(function(a,b){
    var ra = rank(a), rb = rank(b);
    if(ra !== rb) return ra - rb;
    return (a.name||'').localeCompare(b.name||'', 'ru');
  }).map(function(p){ return { key:'p:'+p.id, p:p, staple:false }; });
  STAPLES.forEach(function(s, i){
    if(!dbNames[s.name.trim().toLowerCase()]) list.push({ key:'s:'+i, p:s, staple:true });
  });
  return list;
}
function copyText(text, msg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); showToast(msg); }
    catch(e){ showToast('Не удалось скопировать'); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ showToast(msg); }).catch(fallback);
  } else {
    fallback();
  }
}

/* ---- добавить / изменить позицию плана ---- */
function openPlanAdd(date, existing){
  var root = document.getElementById('modalRoot');
  var cands = planCandidates();
  var selectedKey = null;
  var meal = (existing && existing.meal) || 'lunch';
  if(existing && existing.productId) selectedKey = 'p:'+existing.productId;
  var g = baseGoals(date);

  root.innerHTML =
    '<div class="overlay" id="ov"><div class="sheet">'+
      '<h2>'+(existing ? 'Изменить' : 'В план')+' · '+fmtPlanDay(date)+'</h2>'+
      '<div class="field"><label>Приём пищи</label>'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap;" id="pMeal">'+
          MEAL_ORDER.map(function(m){
            return '<button type="button" class="btn '+(meal===m?'primary':'ghost')+'" data-meal="'+m+'" style="flex:1;min-width:70px;padding:8px;font-size:12px;">'+MEAL_LABELS[m]+'</button>';
          }).join('')+
        '</div></div>'+
      '<div class="field"><label>Продукт</label><input type="text" id="pSearch" placeholder="Начни вводить название…"></div>'+
      '<div class="search-list" id="pResults"></div>'+
      '<div class="field" style="margin-top:12px;"><label id="pAmountLabel">Граммы</label>'+
        '<input type="number" id="pGrams" inputmode="decimal" placeholder="150" value="'+(existing ? (existing.grams||'') : '')+'">'+
        '<div style="display:flex;gap:6px;margin-top:8px;" id="pQuick">'+
          [50,100,150,200,250].map(function(n){
            return '<button type="button" class="btn ghost" data-g="'+n+'" style="flex:1;padding:8px;font-size:12px;">'+n+'</button>';
          }).join('')+
        '</div>'+
        '<div style="display:none;gap:6px;margin-top:8px;" id="pPortions"></div>'+
      '</div>'+
      '<div class="live-calc" id="pLive"></div>'+
      '<div class="sheet-actions">'+
        '<button class="btn ghost" id="cancelBtn">Отмена</button>'+
        '<button class="btn primary" id="saveBtn">'+(existing ? 'Сохранить' : 'Добавить')+'</button>'+
      '</div>'+
    '</div></div>';

  var searchEl = document.getElementById('pSearch');
  var resultsEl = document.getElementById('pResults');
  var gramsEl = document.getElementById('pGrams');
  var liveEl = document.getElementById('pLive');
  var portionsEl = document.getElementById('pPortions');

  function selectedItem(){
    return cands.find(function(c){ return c.key === selectedKey; }) || null;
  }
  function drawResults(){
    var q = (searchEl.value || '').trim().toLowerCase();
    var tokens = q ? q.split(/\s+/) : [];
    var shown = cands.filter(function(c){
      if(!tokens.length) return true;
      var words = (c.p.name||'').toLowerCase().split(/[^a-zа-яё0-9]+/);
      return tokens.every(function(t){
        return words.some(function(w){ return w.indexOf(t) === 0; });
      });
    });
    var db = shown.filter(function(c){ return !c.staple; });
    var st = shown.filter(function(c){ return c.staple; });
    if(!q) db = db.slice(0, 40);
    function row(c){
      return '<div class="search-item'+(c.key===selectedKey?' selected':'')+'" data-key="'+c.key+'">'+
        '<span>'+esc(c.p.name)+'</span>'+
        '<span class="sm" style="white-space:nowrap;margin-left:8px;">'+Math.round(c.p.kcal||0)+' · Б'+round(c.p.protein||0)+'</span></div>';
    }
    var h = db.map(row).join('');
    if(st.length){
      h += '<div style="padding:6px 12px;font-size:11px;color:var(--muted);background:var(--bg);">Стандартные (сырой / сухой вес)</div>'+st.map(row).join('');
    }
    resultsEl.innerHTML = h || '<div style="padding:12px;font-size:13px;color:var(--muted);">Ничего не найдено</div>';
    resultsEl.querySelectorAll('[data-key]').forEach(function(el){
      el.onclick = function(){
        selectedKey = el.dataset.key;
        drawResults();
        drawPortions();
        updateLive();
      };
    });
  }
  function drawPortions(){
    var it = selectedItem();
    var has = it && productHasPortion(it.p);
    portionsEl.style.display = has ? 'flex' : 'none';
    if(!has){ portionsEl.innerHTML = ''; return; }
    portionsEl.innerHTML = [1,2,3,4,5].map(function(n){
      return '<button type="button" class="btn ghost" data-n="'+n+'" style="flex:1;padding:8px;font-size:12px;">'+n+' '+esc(it.p.portionName === 'штука' ? 'шт' : it.p.portionName)+'</button>';
    }).join('');
    portionsEl.querySelectorAll('[data-n]').forEach(function(b){
      b.onclick = function(){
        gramsEl.value = round(parseInt(b.dataset.n, 10) * it.p.portionGrams);
        updateLive();
      };
    });
  }
  function updateLive(){
    var it = selectedItem();
    var grams = parseFloat(gramsEl.value) || 0;
    if(!it || !grams){ liveEl.textContent = it ? 'Укажи граммы' : 'Выбери продукт'; return; }
    var m = macrosOfProduct(it.p, grams);
    var base = computeTotals(getPlan(date).filter(function(e){ return !existing || e.id !== existing.id; }));
    liveEl.innerHTML =
      round(m.kcal)+' ккал · Б'+round(m.protein)+' Ж'+round(m.fat)+' У'+round(m.carbs)+' · кл '+round(m.fiber)+'<br>'+
      'День: '+Math.round(base.kcal+m.kcal)+'/'+g.kcal+' ккал · Б '+Math.round(base.protein+m.protein)+'/'+g.protein;
  }

  document.querySelectorAll('#pMeal [data-meal]').forEach(function(btn){
    btn.onclick = function(){
      meal = btn.dataset.meal;
      document.querySelectorAll('#pMeal [data-meal]').forEach(function(b){
        b.className = 'btn '+(b.dataset.meal === meal ? 'primary' : 'ghost');
        b.style.flex = '1'; b.style.minWidth = '70px'; b.style.padding = '8px'; b.style.fontSize = '12px';
      });
    };
  });
  document.querySelectorAll('#pQuick [data-g]').forEach(function(b){
    b.onclick = function(){ gramsEl.value = b.dataset.g; updateLive(); };
  });
  searchEl.oninput = drawResults;
  gramsEl.oninput = updateLive;
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = function(e){ if(e.target.id === 'ov') closeModal(); };
  document.getElementById('saveBtn').onclick = function(){
    var it = selectedItem();
    var grams = parseFloat(gramsEl.value) || 0;
    if(!it){ showToast('Выбери продукт'); return; }
    if(grams <= 0){ showToast('Укажи граммы'); return; }
    var prod = it.staple ? ensureStaple(it.p) : it.p;
    var list = getPlan(date).slice();
    var row = { id: existing ? existing.id : uid(), productId: prod.id, grams: round(grams), meal: meal };
    if(existing){
      var idx = list.findIndex(function(e){ return e.id === existing.id; });
      if(idx >= 0) list[idx] = row; else list.push(row);
    } else {
      list.push(row);
    }
    savePlan(date, list);
    closeModal();
    render();
  };

  drawResults();
  drawPortions();
  updateLive();
}

        '<button class="btn ghost" id="mToDiary" style="width:100%;padding:10px;font-size:13px;" '+(hasItems?'':'disabled')+'>Внести план дня в дневник ('+fmtPlanDay(date)+')</button>'+
      '</div>'+
      '<div class="sheet-actions">'+

        '<button class="btn ghost" id="cancelBtn">Закрыть</button>'+

      b.className = 'btn '+(picked[d] ? 'primary' : 'ghost');
      b.style.flex = '1'; b.style.minWidth = '54px'; b.style.padding = '8px 4px'; b.style.fontSize = '12px';
    };

  document.getElementById('mCopy').onclick = function(){
    var targets = Object.keys(picked);
    if(!targets.length){ showToast('Выбери дни'); return; }
    var src = getPlan(date);
    targets.forEach(function(d){
      savePlan(d, src.map(function(e){ return Object.assign({}, e, { id: uid() }); }));
    });
    closeModal();
    render();
    showToast('Скопировано дней: '+targets.length);
  };
  document.getElementById('mFromBtn').onclick = function(){
    var from = document.getElementById('mFrom').value;
    if(!from){ showToast('Укажи дату'); return; }
    var src = getDiary(from);
    if(!src.length){ showToast('В этот день пусто'); return; }
    var list = getPlan(date).slice();
    src.forEach(function(e){
      var row = { id: uid(), meal: e.meal || defaultMealByTime() };
      if(e.custom){
        row.custom = true; row.name = e.name; row.kcal = e.kcal; row.protein = e.protein; row.fat = e.fat; row.carbs = e.carbs;

    closeModal();
    render();
    showToast('Добавлено: '+src.length);

    saveDiary(date, dest);
    closeModal();

  };

    savePlan(date, []);
    closeModal();
    render();
  };
}

/* ---- список покупок ---- */
function openShoppingList(){
  var root = document.getElementById('modalRoot');
  var mon = planWeekStart;
  var today = todayStr();
  var mode = (weekMonday(today) === mon) ? 'rest' : 'all'; // 'rest' — с сегодня, 'all' — вся неделя
  var COOKED_RE = /вар[её]н|отвар|на воде/i;

  function collect(){
    var dates = planWeekDates(mon);
    if(mode === 'rest') dates = dates.filter(function(d){ return d >= today; });
    var agg = {}, skipped = 0;
    dates.forEach(function(d){
      getPlan(d).forEach(function(e){
        var p = e.productId ? products.find(function(pr){ return pr.id === e.productId; }) : null;
        if(!p){ skipped++; return; }
        if(!agg[p.id]) agg[p.id] = { p: p, grams: 0 };
        agg[p.id].grams += e.grams || 0;
      });
    });
    var groups = {};
    Object.keys(agg).forEach(function(id){
      var it = agg[id];
      ensureProductMeta(it.p);
      var g = SHOP_GROUPS.indexOf(it.p.foodGroup) >= 0 ? it.p.foodGroup : 'other';
      (groups[g] = groups[g] || []).push(it);
    });
    SHOP_GROUPS.forEach(function(g){
      if(groups[g]) groups[g].sort(function(a,b){ return b.grams - a.grams; });
    });
    return { groups: groups, skipped: skipped, count: Object.keys(agg).length };
  }
  function qtyText(it){
    var g = Math.ceil(it.grams / 10) * 10;
    var s = (g >= 1000 ? (round(g/1000)+' кг') : (g+' г'));
    if(it.p.portionName === 'штука' && it.p.portionGrams > 0){
      s += ' ≈ '+Math.ceil(it.grams / it.p.portionGrams)+' шт';
    }
    if(COOKED_RE.test(it.p.name||'')) s += ' (готовый вес)';
    return s;
  }
  function checkedMap(){ return shopChecked[mon] || {}; }
  function saveChecked(map){
    if(Object.keys(map).length) shopChecked[mon] = map; else delete shopChecked[mon];
    var keys = Object.keys(shopChecked).sort().reverse().slice(0, 8);
    var pruned = {};
    keys.forEach(function(k){ pruned[k] = shopChecked[k]; });
    shopChecked = pruned;
    sSet('shopChecked', shopChecked);
  }

  function draw(){
    var data = collect();
    var checked = checkedMap();
    var done = 0;
    var body = '';
    SHOP_GROUPS.forEach(function(g){
      var items = data.groups[g];
      if(!items) return;
      body += '<div class="section-title" style="margin:12px 0 4px;font-size:12.5px;">'+SHOP_GROUP_LABELS[g]+'</div>';
      items.forEach(function(it){
        var on = !!checked[it.p.id];
        if(on) done++;
        body += '<div data-shop="'+it.p.id+'" style="display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dotted var(--line);cursor:pointer;">'+
          '<div style="flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid '+(on?'var(--green)':'var(--line)')+';background:'+(on?'var(--green)':'var(--surface)')+';color:#fff;font-size:14px;line-height:19px;text-align:center;">'+(on?'✓':'')+'</div>'+
          '<div style="flex:1;font-size:14.5px;'+(on?'text-decoration:line-through;color:var(--muted);':'')+'">'+esc(it.p.name)+'</div>'+
          '<div style="font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;">'+esc(qtyText(it))+'</div>'+
        '</div>';
      });
    });
    if(!data.count){
      body = '<div class="empty" style="padding:24px 10px;">'+(mode==='rest' ? 'С сегодняшнего дня в плане пусто.' : 'В плане этой недели пусто.')+'<br>Добавь продукты в дни на вкладке «План».</div>';
    }
    root.innerHTML =
      '<div class="overlay" id="ov"><div class="sheet">'+
        '<h2>Список покупок · '+fmtWeekRange(mon)+'</h2>'+
        '<div style="display:flex;gap:8px;margin-bottom:6px;">'+
          '<button class="btn '+(mode==='rest'?'primary':'ghost')+'" data-mode="rest" style="padding:8px;font-size:12.5px;">С сегодня</button>'+
          '<button class="btn '+(mode==='all'?'primary':'ghost')+'" data-mode="all" style="padding:8px;font-size:12.5px;">Вся неделя</button>'+
        '</div>'+
        body+
        (data.count ? '<div style="font-size:12px;color:var(--muted);margin-top:12px;">Куплено '+done+' из '+data.count+'. Вес — как в плане: для варёных продуктов готовый.'+(data.skipped?' Записей без продукта не учтено: '+data.skipped+'.':'')+'</div>' : '')+
        '<div class="sheet-actions">'+
          '<button class="btn ghost" id="shReset" '+(data.count?'':'disabled')+' style="padding:10px;font-size:13px;">Сбросить</button>'+
          '<button class="btn ghost" id="shCopy" '+(data.count?'':'disabled')+' style="padding:10px;font-size:13px;">Скопировать</button>'+
          '<button class="btn primary" id="shClose" style="padding:10px;font-size:13px;">Закрыть</button>'+
        '</div>'+
      '</div></div>';

    document.getElementById('ov').onclick = function(e){ if(e.target.id === 'ov') closeModal(); };
    document.getElementById('shClose').onclick = closeModal;
    root.querySelectorAll('[data-mode]').forEach(function(b){
      b.onclick = function(){ mode = b.dataset.mode; draw(); };
    });
    root.querySelectorAll('[data-shop]').forEach(function(row){
      row.onclick = function(){
        var map = Object.assign({}, checkedMap());
        var id = row.dataset.shop;
        if(map[id]) delete map[id]; else map[id] = true;
        saveChecked(map);
        draw();
      };
    });
    document.getElementById('shReset').onclick = function(){ saveChecked({}); draw(); };
    document.getElementById('shCopy').onclick = function(){
      var lines = ['Покупки · '+fmtWeekRange(mon)];
      SHOP_GROUPS.forEach(function(g){
        if(!data.groups[g]) return;
        lines.push('', SHOP_GROUP_LABELS[g]+':');
        data.groups[g].forEach(function(it){ lines.push('— '+it.p.name+' — '+qtyText(it)); });
      });
      copyText(lines.join('\n'), 'Список скопирован');
    };
  }
  draw();
}

/* ---------------- автоподбор рациона ---------------- */
var AUTO_SLOTS = {
  2: ['lunch','dinner'],
  3: ['breakfast','lunch','dinner'],
  4: ['breakfast','lunch','dinner','snack']
};
var AUTO_SHARE = { breakfast:0.25, lunch:0.4, dinner:0.35, snack:0.15 };
var AUTO_JUNK = /пельмен|блинчик|биточек|шницель|бургер|фри|шашлык|тортилья|сендвич|sandwich|плов|шарлотк|кафе|лодочка|цезарь|мороженое|торт|чипс/i;
var AUTO_TEMPLATES = {
  breakfast: [{role:'prot', p:1}, {role:'carb', p:0.6}, {role:'fruit', p:0.8}],
  lunch:     [{role:'prot', p:1}, {role:'carb', p:0.9}, {role:'veg', p:1}, {role:'fat', p:0.3}],
  dinner:    [{role:'prot', p:1}, {role:'carb', p:0.7}, {role:'veg', p:1}, {role:'fat', p:0.3}],
  snack:     [{role:'prot', p:1}, {role:'fruit', p:0.5}]
};

function autoNameKey(p){ return (p.name || '').trim().toLowerCase(); }

function autoKind(p){
  var n = (p.name || '').toLowerCase();
  if((p.protein || 0) >= 50) return 'powder';
  if(/яйц|яиц|белок яичн/.test(n)) return 'egg';
  if(/(^|\s)сыр(\s|$)/.test(n)) return 'cheese';
  if(/ветчин|колбас|сосиск|карпаччо|карпачо/.test(n)) return 'deli';
  if(p.foodGroup === 'dairy' || /творог|йогурт|скир|skyr|кефир|пудинг|коктейль|напиток|neo|exponenta|teos|теос/.test(n)) return 'dairy';
  return 'meat';
}
function autoRoleOf(p){
  ensureProductMeta(p);
  var k = p.kcal || 0, P = p.protein || 0, F = p.fat || 0, C = p.carbs || 0;
  var grp = p.foodGroup, name = p.name || '';
  if(k <= 0 || AUTO_JUNK.test(name)) return null;
  if(/авокадо|масл|орех|арахис|миндал|семена|льна/i.test(name) && F >= 14 && P <= 30 && C <= 30) return 'fat';
  if(grp === 'veg' && k <= 60) return 'veg';
  if(grp === 'fruit' && k <= 110) return 'fruit';
  if(/яйц|яиц/i.test(name) && P >= 11) return 'prot';
  if(P >= 8 && (P * 4) / k >= 0.35) return 'prot';
  if(grp === 'grain' && F <= 7 && k <= 380 && C >= 12) return 'carb';
  return null;
}
function autoBuildPool(counts){
  var pool = { prot:[], carb:[], veg:[], fruit:[], fat:[] };
  function add(p, staple){
    if(p.excludeFromPlan) return;
    var role = autoRoleOf(p);
    if(!role) return;
    var c = counts[p.id] || 0;
    var w = staple ? 1.2 : (0.6 + Math.min(c, 8) * 0.5 + (favorites.indexOf(p.id) >= 0 ? 3 : 0));
    // бонус, если продукт уже в холодильнике
    if(invGet(p.id) > 0) w += 2.5;
    pool[role].push({ key: autoNameKey(p), p: p, staple: !!staple, w: w, kind: role === 'prot' ? autoKind(p) : null });
  }
  var names = {};
  products.forEach(function(p){ names[autoNameKey(p)] = true; add(p, false); });
  STAPLES.forEach(function(s){ if(!names[autoNameKey(s)]) add(s, true); });
  return pool;
}
function autoProtWeight(kind, slot){
  var main = (slot === 'lunch' || slot === 'dinner');
  var w = main ? { meat:1, egg:0.25, dairy:0.15, powder:0, cheese:0.04, deli:0.2 } : { meat:0.08, egg:0.9, dairy:1, powder:0.4, cheese:0.35, deli:0.1 };
  return w[kind] == null ? 0 : w[kind];
}
function autoPick(weights){
  var sum = 0, i;
  for(i=0;i<weights.length;i++) sum += weights[i];
  if(sum <= 0) return -1;
  var r = Math.random() * sum;
  for(i=0;i<weights.length;i++){
    r -= weights[i];
    if(r <= 0) return i;
  }
  return weights.length - 1;
}
function autoMakeItem(c, role, slot){
  var p = c.p;
  if(p.excludeFromPlan) return null;
  var dens = Math.max(p.kcal || 0, 1) / 100;
  // приоритет: явная упаковка → порция-штука → вес из названия
  var portionStep = packageStep(p);
  if(!portionStep && productHasPortion(p) && /штук|ломт|кусок|упак/.test(p.portionName||'')) portionStep = p.portionGrams;
  var step = portionStep || 5;
  var minG, maxG, goalG;
  if(role === 'prot'){
    minG = 80 / dens; maxG = Math.min(400, 550 / dens);
    if((p.protein || 0) >= 50){ minG = 15; maxG = 60; }
    if(c.kind === 'cheese'){ minG = 30; maxG = 100; }
    if(c.kind === 'deli'){ minG = 50; maxG = 150; }
    goalG = 30 / Math.max((p.protein || 0) / 100, 0.05);
  } else if(role === 'carb'){
    minG = 100 / dens; maxG = 450 / dens; goalG = 250 / dens;
  } else if(role === 'veg'){
    minG = 100; maxG = 350; goalG = 250;
  } else if(role === 'fruit'){
    minG = 80; maxG = 300; goalG = 150;
  } else {
    minG = 40 / dens; maxG = Math.min(200 / dens, 150); goalG = 70 / dens;
  }
  if(portionStep >= 30){
    // только целые упаковки / ломти: не предлагать 30 г хлеба если упаковка 300+
    minG = portionStep;
    // хлеб/батон и крупные упаковки — 1–2 шт; тунец 130 — до 2–3
    var maxPacks = portionStep >= 250 ? 2 : (portionStep >= 100 ? 3 : (role === 'prot' ? 5 : 3));
    maxG = portionStep * maxPacks;
  }
  minG = Math.max(step, Math.ceil(minG / step) * step);
  maxG = Math.max(minG, Math.floor(maxG / step) * step);
  var g = Math.min(maxG, Math.max(minG, Math.round(goalG / step) * step));
  // если в холодильнике есть запас — предпочитаем не больше запаса (кратность)
  var have = invGet(p.id);
  if(have > 0 && portionStep >= 30){
    var maxFromInv = Math.floor(have / portionStep) * portionStep;
    if(maxFromInv >= portionStep) maxG = Math.min(maxG, maxFromInv);
    else { /* нет целой упаковки дома — всё равно можно предложить купить 1 */ }
  }
  g = Math.min(maxG, Math.max(minG, g));
  return {
    c: c, p: p, role: role, slot: slot, g: g, min: minG, max: maxG, step: step, portion: !!portionStep,
    k: (p.kcal || 0) / 100, pr: (p.protein || 0) / 100, fa: (p.fat || 0) / 100, ca: (p.carbs || 0) / 100,
    fi: (p.fiber || 0) / 100, veg: p.foodGroup === 'veg' ? 1 : 0, fru: p.foodGroup === 'fruit' ? 1 : 0
  };
}
function autoCost(items, base, G, fiberGoal, vfGoal){
  var T = { k: base.kcal, p: base.protein, f: base.fat, c: base.carbs, fi: base.fiber, vf: base.vf };
  var sk = {}, sp = {}, added = 0, i, it, g;
  for(i=0;i<items.length;i++){
    it = items[i]; g = it.g;
    T.k += it.k * g; T.p += it.pr * g; T.f += it.fa * g; T.c += it.ca * g; T.fi += it.fi * g;
    if(it.veg || it.fru) T.vf += g;
    sk[it.slot] = (sk[it.slot] || 0) + it.k * g;
    sp[it.slot] = (sp[it.slot] || 0) + it.pr * g;
    added += it.k * g;
  }
  var cost = 0, e;
  e = (T.k - G.kcal) / G.kcal;
  if(e > 0) cost += 9 * e; else if(e < -0.03) cost += 2 * (-e - 0.03);
  e = (T.p - G.protein) / G.protein;
  if(e < -0.02) cost += 7 * (-e - 0.02); else if(e > 0.10) cost += 1.2 * (e - 0.10);
  e = (T.f - G.fat) / G.fat;
  if(e > 0) cost += 5 * e; else if(e < -0.35) cost += 0.6 * (-e - 0.35);
  e = (T.c - G.carbs) / G.carbs;
  if(e > 0) cost += 5 * e; else if(e < -0.30) cost += 0.8 * (-e - 0.30);
  if(T.fi < fiberGoal) cost += 6 * (fiberGoal - T.fi) / fiberGoal;
  if(T.vf < vfGoal) cost += 3 * (vfGoal - T.vf) / vfGoal;
  // равномерность по приёмам и белок в основных приёмах
  var slots = Object.keys(sk), shareSum = 0, s;
  slots.forEach(function(x){ shareSum += AUTO_SHARE[x] || 0.25; });
  if(added > 0 && slots.length > 1){
    slots.forEach(function(x){
      cost += 1.2 * Math.abs(sk[x] / added - (AUTO_SHARE[x] || 0.25) / shareSum);
    });
  }
  slots.forEach(function(x){
    if(x !== 'snack' && sp[x] < 20) cost += 0.012 * (20 - sp[x]);
  });
  return { cost: cost, T: T };
}
function autoOptimize(items, base, G, fiberGoal, vfGoal){
  var cur = autoCost(items, base, G, fiberGoal, vfGoal).cost;
  for(var pass=0; pass<30; pass++){
    var improved = false;
    for(var i=0;i<items.length;i++){
      var it = items[i];
      var mults = it.portion ? [1] : [4, 2, 1];
      for(var m=0;m<mults.length;m++){
        for(var d=-1; d<=1; d+=2){
          var ng = it.g + d * mults[m] * it.step;
          if(ng < it.min || ng > it.max) continue;
          var old = it.g;
          it.g = ng;
          var c = autoCost(items, base, G, fiberGoal, vfGoal).cost;
          if(c < cur - 1e-9){ cur = c; improved = true; } else { it.g = old; }
        }
      }
    }
    if(!improved) break;
  }
  return cur;
}
function autoTrial(slots, pool, ctx){
  var items = [], used = {};
  slots.forEach(function(slot){
    AUTO_TEMPLATES[slot].forEach(function(t){
      if(Math.random() > t.p) return;
      var list = pool[t.role];
      if(!list || !list.length) return;
      var allowDup = (t.role === 'veg' || t.role === 'fat');
      var weights = list.map(function(c){
        if(!allowDup && used[c.key]) return 0;
        var w = c.w;
        if(t.role === 'prot') w *= autoProtWeight(c.kind, slot);
        var u = Math.min(ctx.usage[c.key] || 0, 3);
        w *= ctx.style === 'variety' ? 1 / (1 + u) : (1 + 0.8 * u);
        return w;
      });
      var idx = autoPick(weights);
      if(idx < 0) return;
      var item = autoMakeItem(list[idx], t.role, slot);
      if(!item) return;
      used[list[idx].key] = true;
      items.push(item);
    });
  });
  return items;
}
function autoVarPenalty(items, ctx){
  var pen = 0;
  items.forEach(function(it){
    if(!it || it.role === 'veg' || it.role === 'fat') return;
    var u = Math.min(ctx.usage[it.c.key] || 0, 3);
    pen += ctx.style === 'variety' ? 0.10 * u : -0.04 * u;
  });
  return pen;
}
function autoFillDay(date, existing, pool, ctx, opts){
  var G = baseGoals(date);
  var fiberGoal = goals.fiberTarget || 28, vfGoal = goals.vegFruitTarget || 500;
  var ex = computeTotals(existing);
  var base = { kcal: ex.kcal, protein: ex.protein, fat: ex.fat, carbs: ex.carbs, fiber: ex.fiber, vf: ex.veg + ex.fruit };
  var present = {};
  existing.forEach(function(e){ present[e.meal || 'lunch'] = true; });
  var slots = AUTO_SLOTS[opts.meals].filter(function(s){ return !present[s]; });
  var note = '';
  if(!slots.length){
    if(!present.snack && (G.kcal - base.kcal > 120 || G.protein - base.protein > 10)) slots = ['snack'];
  }
  if(G.kcal - base.kcal < 120) slots = [];
  var result = { date: date, existingCount: existing.length, added: [], T: base, note: '' };
  if(!slots.length){
    result.note = existing.length ? 'Приёмы заполнены или ккал уже в норме' : 'Нечего добавлять';
    return result;
  }
  var best = null;
  for(var t=0; t<ctx.trials; t++){
    var items = autoTrial(slots, pool, ctx);
    if(!items.length) continue;
    var cost = autoOptimize(items, base, G, fiberGoal, vfGoal);
    var total = cost + autoVarPenalty(items, ctx);
    if(!best || total < best.total){ best = { items: items, total: total }; }
    if(best.total < 0.02) break;
  }
  if(!best){ result.note = 'Не из чего подбирать'; return result; }
  var fin = autoCost(best.items, base, G, fiberGoal, vfGoal);
  result.T = { kcal: fin.T.k, protein: fin.T.p, fat: fin.T.f, carbs: fin.T.c, fiber: fin.T.fi, vf: fin.T.vf };
  result.added = best.items.map(function(it){
    return { p: it.p, staple: it.c.staple, grams: it.g, meal: it.slot };
  });
  return result;
}
function autoGenerate(scope, date, opts){
  var pool = autoBuildPool(productUsageCounts());
  var weekDates = planWeekDates(planWeekStart);
  var today = todayStr();
  var dates = scope === 'day' ? [date] : weekDates.filter(function(d){ return opts.range === 'all' || d >= today; });
  var usage = {};
  function bump(p){ var k = autoNameKey(p); usage[k] = (usage[k] || 0) + 1; }
  weekDates.forEach(function(d){
    if(dates.indexOf(d) >= 0 && opts.replace) return;
    getPlan(d).forEach(function(e){
      var p = e.productId ? products.find(function(pr){ return pr.id === e.productId; }) : null;
      if(p) bump(p);
    });
  });
  var ctx = { usage: usage, style: opts.style, trials: scope === 'day' ? 260 : 140 };
  var out = [];
  dates.forEach(function(d){
    var existing = opts.replace ? [] : getPlan(d);
    var r = autoFillDay(d, existing, pool, ctx, opts);
    r.replaced = !!opts.replace && getPlan(d).length > 0;
    r.added.forEach(function(a){ bump(a.p); });
    out.push(r);
  });
  return out;
}

function openAutoPlan(scope, date){
  var root = document.getElementById('modalRoot');
  var today = todayStr();
  var opts = {
    meals: 3, replace: false, style: 'repeat',
    range: (scope === 'week' && weekMonday(today) === planWeekStart) ? 'rest' : 'all'
  };
  var result = [], open = {};
  var hasToday = weekMonday(today) === planWeekStart;

  function gen(){
    try{ result = autoGenerate(scope, date, opts); }
    catch(e){ result = []; showToast('Ошибка подбора'); }
  }
  function chips(key, arr){
    return '<div style="display:flex;gap:6px;flex-wrap:wrap;">'+arr.map(function(a){
      return '<button type="button" class="btn '+(String(opts[key]) === String(a[0]) ? 'primary' : 'ghost')+'" data-opt="'+key+'" data-val="'+a[0]+'" style="flex:1;min-width:64px;padding:8px 4px;font-size:12px;">'+a[1]+'</button>';
    }).join('')+'</div>';
  }
  function dayLine(r){
    var G = baseGoals(r.date), T = r.T;
    var fiberGoal = goals.fiberTarget || 28, vfGoal = goals.vegFruitTarget || 500;
    var bad = T.kcal > G.kcal * 1.04 || T.protein < G.protein * 0.93;
    return (bad ? '⚠ ' : '')+Math.round(T.kcal)+' ккал · Б '+Math.round(T.protein)+' · Ж '+Math.round(T.fat)+' · У '+Math.round(T.carbs)+
      ' · Кл '+round(T.fiber)+' · О+Ф '+Math.round(T.vf);
  }
  function draw(){
    var G = baseGoals(date || planWeekStart);
    var body = '';
    var anyAdded = false;
    result.forEach(function(r){
      if(r.added.length) anyAdded = true;
      var isOpen = scope === 'day' || open[r.date];
      body += '<div class="card" style="padding:10px 12px;margin-bottom:8px;">'+
        '<div '+(scope === 'week' ? 'data-ropen="'+r.date+'" style="cursor:pointer;"' : '')+'>'+
          '<div style="display:flex;justify-content:space-between;align-items:baseline;">'+
            '<div style="font-size:14px;font-weight:600;">'+fmtPlanDay(r.date)+'</div>'+
            '<div style="font-size:11px;color:var(--muted);">'+(r.added.length ? '+'+r.added.length+' поз.' : '')+(r.replaced ? ' · заменит план' : '')+(r.existingCount && !r.replaced ? ' · уже '+r.existingCount : '')+'</div>'+
          '</div>'+
          '<div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;">'+(r.added.length || r.existingCount ? dayLine(r) : '')+'</div>'+
          (r.note && !r.added.length ? '<div style="font-size:12px;color:var(--muted);margin-top:4px;">'+r.note+'</div>' : '')+
        '</div>';
      if(isOpen && r.added.length){
        MEAL_ORDER.forEach(function(m){
          var items = r.added.filter(function(a){ return a.meal === m; });
          if(!items.length) return;
          body += '<div class="section-title" style="margin:8px 0 2px;font-size:12px;">'+MEAL_LABELS[m]+'</div>';
          items.forEach(function(a){
            var k = (a.p.kcal || 0) * a.grams / 100;
            var portion = productHasPortion(a.p) ? formatPortionLine(a.p, a.grams) : null;
            if(portion) portion = portion.replace(/ штука$/, ' шт');
            body += '<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;">'+
              '<span>'+esc(a.p.name)+'</span>'+
              '<span style="font-family:var(--mono);color:var(--muted);white-space:nowrap;">'+round(a.grams)+' г'+(portion ? ' ('+esc(portion)+')' : '')+' · '+Math.round(k)+'</span></div>';
          });
        });
      }
      body += '</div>';
    });
    if(!result.length) body = '<div class="empty" style="padding:20px;">Нет дней для подбора</div>';

    root.innerHTML =
      '<div class="overlay" id="ov"><div class="sheet">'+
        '<h2>'+(scope === 'day' ? 'Добрать день · '+fmtPlanDay(date) : 'Собрать неделю · '+fmtWeekRange(planWeekStart))+'</h2>'+
        '<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">Цель: '+G.kcal+' ккал · Б '+G.protein+' · Ж '+G.fat+' · У '+G.carbs+' · клетчатка '+(goals.fiberTarget||28)+' · овощи+фр. '+(goals.vegFruitTarget||500)+' г</div>'+
        (scope === 'week' && hasToday
          ? '<div class="field"><label>Дни</label>'+chips('range', [['rest','С сегодня'],['all','Вся неделя']])+'</div>' : '')+
        '<div class="field"><label>Приёмов пищи</label>'+chips('meals', [[2,'2'],[3,'3'],[4,'4']])+'</div>'+
        (scope === 'week'
          ? '<div class="field"><label>Стиль</label>'+chips('style', [['repeat','Минимум готовки'],['variety','Разнообразнее']])+'</div>' : '')+
        '<div class="field"><label>Уже запланированное</label>'+chips('replace', [['false','Оставить, добрать'],['true','Заменить']])+'</div>'+
        body+
        '<div class="sheet-actions">'+
          '<button class="btn ghost" id="aCancel" style="padding:10px;font-size:13px;">Отмена</button>'+
          '<button class="btn ghost" id="aReroll" style="padding:10px;font-size:13px;">Другой вариант</button>'+
          '<button class="btn primary" id="aApply" style="padding:10px;font-size:13px;" '+(anyAdded?'':'disabled')+'>Применить</button>'+
        '</div>'+
      '</div></div>';

    document.getElementById('ov').onclick = function(e){ if(e.target.id === 'ov') closeModal(); };
    document.getElementById('aCancel').onclick = closeModal;
    document.getElementById('aReroll').onclick = function(){ gen(); draw(); };
    root.querySelectorAll('[data-opt]').forEach(function(b){
      b.onclick = function(){
        var k = b.dataset.opt, v = b.dataset.val;
        if(k === 'meals') opts.meals = parseInt(v, 10);
        else if(k === 'replace') opts.replace = (v === 'true');
        else opts[k] = v;
        gen(); draw();
      };
    });
    root.querySelectorAll('[data-ropen]').forEach(function(el){
      el.onclick = function(){ open[el.dataset.ropen] = !open[el.dataset.ropen]; draw(); };
    });
    document.getElementById('aApply').onclick = function(){
      var n = 0;
      result.forEach(function(r){
        if(!r.added.length) return;
        var rows = r.added.map(function(a){
          var prod = a.staple ? ensureStaple(a.p) : a.p;
          return { id: uid(), productId: prod.id, grams: round(a.grams), meal: a.meal };
        });
        var base = opts.replace ? [] : getPlan(r.date).slice();
        savePlan(r.date, base.concat(rows));
        n++;
      });
      if(scope === 'day') planOpenDay = date;
      closeModal();
      render();
      showToast('Заполнено дней: '+n);
    };
  }
  gen();
  draw();
}

/* ---------------- nav ---------------- */
try{
  document.querySelectorAll('nav.tabs button').forEach(function(b){
    b.onclick = function(){ activeTab = b.dataset.tab; render(); };
  });
}catch(e){}

try{ init(); }catch(e){
  var c = document.getElementById('content');
  if(c) c.innerHTML = '<div class="empty">Ошибка загрузки.<br>Открой файл через Safari<br>(Поделиться → Safari)</div>';
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
