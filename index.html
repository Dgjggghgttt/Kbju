<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, ">

<meta name="application-name" content="КБЖУ — дневник">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    --bg:#eeebe3;
    --surface:#ffffff;
    --ink:#24261f;
    --muted:#8a8a7d;
    --line:#d8d4c8;
    --green:#3c6e47;
    --green-dim:#e5ede6;
    --red:#a83c3c;
    --red-dim:#f3e4e2;
    --amber:#a3792f;
    --radius-card:14px;
    --radius-pill:999px;
    --serif: Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
  }
  #app{width:100%; max-width:480px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative;}

  /* ---- top receipt summary ---- */
  .receipt{
    background:var(--surface);
    padding:18px 20px 14px;
    border-bottom:1px dashed var(--line);
  }
  .app-build-tag{position:sticky;top:0;z-index:35;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:#243d2b;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font-family:var(--mono);font-size:11px;letter-spacing:.7px;}
  .auto-check-card{padding:11px 13px;}
  .auto-check-heading{font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
  .auto-check-count{font:700 11px var(--mono);background:var(--red-dim);color:var(--red);border-radius:999px;padding:3px 7px;}
  .auto-check-ok{color:var(--green);font-weight:800;}
  .auto-check-note{font-size:12px;line-height:1.45;color:var(--muted);}
  .auto-check-item{font-size:12px;line-height:1.45;padding:8px 0;border-top:1px solid var(--line);}
  .auto-check-item b{display:block;margin-bottom:2px;font-size:12.5px;}
  .auto-check-item>div{color:var(--muted);}
  .auto-check-warn b{color:var(--red);}
  .auto-check-info b{color:var(--green);}
  .auto-check-ok-row b{color:var(--green);}

  .app-build-name{font-weight:700;}
  .app-build-version{font-weight:800;background:#fff;color:#243d2b;border-radius:999px;padding:4px 9px;font-size:11px;letter-spacing:.4px;}
  .receipt-date{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .receipt-date button{
    background:none; border:none; font-size:20px; color:var(--muted); padding:4px 10px; cursor:pointer;
  }
  .receipt-date h1{
    font-family:var(--serif); font-size:17px; font-weight:400; margin:0; letter-spacing:.2px;
  }
  .receipt-date .today-link{font-size:12px; color:var(--green); font-family:var(--sans); cursor:pointer;}
  .quick-date-nav{display:flex;gap:6px;justify-content:center;margin:-2px 0 10px;}
  .quick-date-nav button{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:5px 13px;font:600 11px var(--sans);cursor:pointer;}
  .quick-date-nav button.active{background:var(--green-dim);border-color:var(--green);color:var(--green);}
  .undo-action{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;margin:0 0 9px;border:1px solid var(--amber);border-radius:10px;background:#fbf5e9;font-size:12px;}
  .undo-action button{border:0;border-radius:7px;background:var(--green);color:#fff;padding:6px 10px;font-weight:700;font-size:11px;}
  .totals-row{display:flex; justify-content:space-between; font-family:var(--mono); font-size:13px; margin-top:8px;}
  .totals-row .lab{color:var(--muted); font-family:var(--sans); font-size:11px; display:block; margin-bottom:2px;}
  .macro-tap{cursor:pointer; -webkit-tap-highlight-color:transparent; border-radius:8px; padding:4px 2px;}
  .macro-tap:active{background:var(--green-dim);}
  .kcal-line{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:var(--mono); margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);
  }
  .kcal-line .big{font-size:26px; font-weight:600;}
  .kcal-line .of{color:var(--muted); font-size:13px;}
  .bar{height:5px; border-radius:3px; background:var(--line); margin-top:8px; overflow:hidden;}
  .bar > i{display:block; height:100%; background:var(--green);}
  .bar.over > i{background:var(--red);}
  .macro-bars{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px;}
  .macro-bar-item .mb-lab{font-size:10px; color:var(--muted); margin-bottom:3px; display:flex; justify-content:space-between;}
  .macro-bar-item .mb-track{height:4px; border-radius:2px; background:var(--line); overflow:hidden;}
  .macro-bar-item .mb-track > i{display:block; height:100%; background:var(--green); border-radius:2px;}
  .macro-bar-item.over .mb-lab{color:var(--red); font-weight:700;}
  .macro-bar-item.over .mb-track > i{background:var(--red);}
  .totals-row .over-macro{color:var(--red); font-weight:700;}
  .totals-row .over-macro .lab{color:var(--red); font-weight:700;}
  .kcal-line.over-macro .big{color:var(--red);}

  /* ---- content ---- */
  #content{flex:1; overflow-y:auto; padding:14px 16px 110px;}
  .empty{color:var(--muted); text-align:center; padding:40px 20px; font-size:14px; line-height:1.6;}

  .entry{
    display:flex; align-items:center; gap:10px;
    padding:10px 2px; border-bottom:1px dotted var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry.entry-over{background:var(--red-dim); margin:0 -12px; padding-left:12px; padding-right:12px; border-radius:8px; border-bottom-color:transparent;}
  .entry.entry-over .name{color:var(--red); font-weight:600;}
  .entry .name{flex:1; font-size:14.5px;}
  .entry .bjupct{font-size:11px; color:var(--muted); font-family:var(--mono); margin-top:2px; line-height:1.35;}
  .entry.entry-over .bjupct{color:var(--red);}
  .entry .grams{color:var(--muted); font-size:12px; font-family:var(--mono);}
  .entry .kcal{font-family:var(--mono); font-size:14px; min-width:52px; text-align:right;}
  .entry .del{color:var(--muted); background:none; border:none; font-size:18px; padding:0 2px 0 6px; cursor:pointer;}

  .section-title{
    font-family:var(--serif); font-size:14px; color:var(--muted); margin:18px 0 6px; padding-top:4px;
  }
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--surface); border-radius:var(--radius-card); padding:14px 16px; margin-bottom:10px;
  }
  .prod-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--bg);}
  .prod-row:last-child{border-bottom:none;}
  .prod-row .pname{font-size:14.5px;}
  .prod-row .pmacros{font-size:11.5px; color:var(--muted); font-family:var(--mono); margin-top:2px;}
  .prod-actions button{background:none;border:none;color:var(--muted);font-size:16px;padding:2px 6px;cursor:pointer;}

  .weight-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px dotted var(--line); font-family:var(--mono); font-size:14px;}
  .weight-row .wdate{font-family:var(--sans); font-size:12.5px; color:var(--muted);}
  .weight-row .wdel{font-family:var(--sans); color:var(--muted); background:none;border:none;font-size:16px;cursor:pointer;}

  svg.chart{width:100%; height:120px; display:block;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat{background:var(--surface); border-radius:var(--radius-card); padding:12px 14px;}
  .stat .slab{font-size:11px; color:var(--muted);}
  .stat .sval{font-family:var(--mono); font-size:19px; margin-top:2px;}

  /* ---- bottom nav ---- */
  nav.tabs{
    position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs button{
    flex:1; background:none; border:none; padding:8px 2px 4px; color:var(--muted);
    font-family:var(--sans); font-size:10.5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav.tabs button .ic{font-size:19px;}
  nav.tabs button.active{color:var(--green);}

  /* ---- fab ---- */
  .fab{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom: calc(78px + env(safe-area-inset-bottom));
    max-width:448px; width:calc(100% - 32px); z-index:5;
  }
  .fab button{
    width:100%; background:var(--green); color:#fff; border:none; border-radius:var(--radius-pill);
    padding:13px; font-size:14.5px; font-weight:600; cursor:pointer; box-shadow:0 4px 14px rgba(60,110,71,.28);
  }

  /* ---- modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,20,15,.4); display:flex; align-items:flex-end; z-index:20;
  }
  .sheet{
    background:var(--bg); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  }
  .sheet h2{font-family:var(--serif); font-weight:400; font-size:17px; margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .field input, .field select{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; background:var(--surface); color:var(--ink); font-family:var(--sans);
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{flex:1; padding:12px; border-radius:var(--radius-pill); border:none; font-size:14.5px; font-weight:600; cursor:pointer;}
  .btn.primary{background:var(--green); color:#fff;}
  .btn.ghost{background:none; color:var(--muted); border:1px solid var(--line);}
  .btn.danger{background:var(--red-dim); color:var(--red);}

  .search-list{max-height:260px; overflow-y:auto; margin-top:4px; border:1px solid var(--line); border-radius:10px; background:var(--surface);}
  .search-item{padding:11px 12px; border-bottom:1px solid var(--bg); cursor:pointer; font-size:14px; display:flex; justify-content:space-between;}
  .search-item:last-child{border-bottom:none;}
  .search-item .sm{color:var(--muted); font-size:11.5px; font-family:var(--mono);}
  .search-item.selected{background:var(--green-dim);}
  .live-calc{font-family:var(--mono); font-size:13px; color:var(--muted); margin:8px 2px 2px; line-height:1.45;}

  body.compact-mode .card{padding:9px 10px !important;margin-bottom:7px !important;}
  body.compact-mode .entry{padding:8px 9px !important;}
  body.compact-mode .entry .bjupct{display:none !important;}
  body.compact-mode .section-subtitle, body.compact-mode .compact-detail{display:none !important;}
  body.compact-mode .btn{padding-top:8px;padding-bottom:8px;}
  .loading{padding:60px 20px; text-align:center; color:var(--muted); font-size:13px;}
  .toast{
    position:fixed; bottom:150px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:9px 16px; border-radius:var(--radius-pill); font-size:13px; z-index:30; opacity:0; transition:opacity .2s;
  }
  .toast.show{opacity:1;}
</style>

<body>
<div id="app">
  <div class="app-build-tag" aria-label="Версия приложения 14">
    <span class="app-build-name">КБЖУ · ДНЕВНИК</span>
    <span id="storageStatus" style="font-size:10px;opacity:.85;flex:1;text-align:center;"></span>
    <span class="app-build-version">ВЕРСИЯ 14</span>
  </div>
  <div class="receipt" id="receipt"></div>
  <div id="content"><div class="loading">Загрузка…</div></div>
  <div class="fab" id="fab"></div>
  <nav class="tabs">
    <button data-tab="diary" class="active"><span class="ic">🧾</span>Дневник</button>
    <button data-tab="workouts"><span class="ic">🏋️</span>Тренировки</button>
    <button data-tab="products"><span class="ic">🥫</span>Продукты</button>
    <button data-tab="report"><span class="ic">📊</span>Отчёт</button>
  </nav>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- storage helpers (robust for iOS) ---------------- */
var _memStore = {};
var _storageOk = true;
var _idb = null;
var _idbReady = false;
var _idbCache = {};
var _idbWriteQueue = Promise.resolve();
var _idbStatus = 'Подготовка локальной базы…';
function idbRequest(req){return new Promise(function(resolve,reject){req.onsuccess=function(){resolve(req.result);};req.onerror=function(){reject(req.error||new Error('IndexedDB error'));};});}
function idbTxDone(tx){return new Promise(function(resolve,reject){tx.oncomplete=function(){resolve();};tx.onerror=tx.onabort=function(){reject(tx.error||new Error('IndexedDB transaction failed'));};});}
async function initIndexedDB(){
  if(!('indexedDB' in window)){_idbStatus='Резервное хранение: localStorage';_idbReady=true;return false;}
  try{
    var req=indexedDB.open('kbju_diary_db',2);
    req.onupgradeneeded=function(){var db=req.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv',{keyPath:'id'});};
    _idb=await idbRequest(req);
    var tx=_idb.transaction('kv','readonly'); var rows=await idbRequest(tx.objectStore('kv').getAll());
    (rows||[]).forEach(function(r){_idbCache[r.id]=r.value;});
    // Merge legacy localStorage even when IDB already has data. Old rows without timestamps
    // are treated as legacy and localStorage wins because its writes were synchronous.
    var legacy={}, legacyKeys=[];
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k){var raw=localStorage.getItem(k);try{legacy[k]=JSON.parse(raw);}catch(e){legacy[k]=raw;}legacyKeys.push(k);}}}catch(e){}
    var wtx=_idb.transaction('kv','readwrite'),st=wtx.objectStore('kv');
    legacyKeys.forEach(function(k){var old=(rows||[]).find(function(r){return r.id===k;});if(!old || !old.updatedAt){_idbCache[k]=legacy[k];st.put({id:k,value:legacy[k],updatedAt:Date.now()});}});
    await idbTxDone(wtx);
    Object.keys(_idbCache).forEach(function(k){try{localStorage.setItem(k,JSON.stringify(_idbCache[k]));}catch(e){_storageOk=false;}});
    _idbReady=true;_idbStatus='IndexedDB активна · данные объединены';return true;
  }catch(e){_idb=null;_idbReady=true;_idbStatus='Резервное хранение: localStorage';return false;}
}
function persistIDB(key,value,remove){
  if(!_idb || !_idbReady)return;
  _idbWriteQueue=_idbWriteQueue.catch(function(){}).then(function(){return new Promise(function(resolve){
    try{var tx=_idb.transaction('kv','readwrite'),st=tx.objectStore('kv');if(remove)st.delete(key);else st.put({id:key,value:value,updatedAt:Date.now()});
      tx.oncomplete=resolve;tx.onerror=tx.onabort=function(){_idbStatus='Ошибка записи IndexedDB — сделай резервную копию';resolve();};
    }catch(e){_idbStatus='Ошибка записи IndexedDB — сделай резервную копию';resolve();}
  });});
}
function flushIndexedDB(){return _idbWriteQueue.catch(function(){_idbStatus='Есть ошибка записи базы';});}
window.addEventListener('pagehide',function(){flushIndexedDB();});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushIndexedDB();});
function sRemove(key){delete _idbCache[key];delete _memStore[key];try{if(_storageOk)localStorage.removeItem(key);}catch(e){}persistIDB(key,null,true);}

(function testStorage(){
  try{
    var t = '__test__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
  }catch(e){
    _storageOk = false;
  }
})();

function escapeHTML(value){
  return String(value == null ? '' : value).replace(/[&<>\"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch];});
}

function sGet(key, fallback){
  if(_idbReady && Object.prototype.hasOwnProperty.call(_idbCache,key)) return _idbCache[key];
  try{if(_storageOk){var raw=localStorage.getItem(key);if(raw!==null)return JSON.parse(raw);}else if(_memStore[key]!==undefined)return _memStore[key];}catch(e){}
  return fallback;
}
function sSet(key,value){
  _idbCache[key]=value;
  try{if(_storageOk)localStorage.setItem(key,JSON.stringify(value));else _memStore[key]=value;}
  catch(e){_storageOk=false;_memStore[key]=value;try{showToast('Сохранение в локальную базу');}catch(_){}}
  persistIDB(key,value,false);
}

/* ---------------- state ---------------- */
var products = [];
var goals = {
  // Рекомендация: сохранение мышц при умеренном дефиците
  kcal: 1500, protein: 154, fat: 50, carbs: 108,
  trainKcal: 1500, trainProtein: 154, trainFat: 50, trainCarbs: 108,
  targetWeight: null, maintenanceKcal: 2000,
  fiberTarget: 28, sugarTarget:50, saltTarget:5, satFatTarget:20, waterTarget:2500,
  vegFruitTarget: 500,
  smartAdjust: false, // спокойный режим: одна норма, без автоурезки
  autoFromWeight: false, // автоцели: −0.5 кг/нед от поддержания
  rule8020: true, // 1 день поддержки в неделю
  maintenanceWeekday: 0, // 0=вс … 6=сб; день поддержки
  workoutAuto: true // авто-упражнения с прогрессией по прошлым тренировкам
};
var dayTemplate = null; // {entries: simplified[]}
var mealTemplates = []; // legacy storage; UI удалён
var weightLog = [];
var waterLog = {}; // date -> ml
var equipmentConfig = {barbell:{bar:3,plates:[{weight:5,pairs:1},{weight:2.5,pairs:2},{weight:1.25,pairs:1},{weight:0.5,pairs:1}]},dumbbell:{handle:1.5,plates:[]}};
var measureLog = []; // {id, date, neck, waist, chest, bicepL, bicepR}
var creatineLog = {}; // date -> true
var workoutCache = {}; // date -> [{id, name, weight, sets}]
var bikeCache = {}; // date -> {km, kcal} | null
var diaryCache = {}; // date -> entries[]
var favorites = []; // product ids
var trainingDays = {}; // legacy, unused for marking
var exercises = []; // {id, name} library like products
var currentDate = todayStr();
var activeTab = 'diary';
// Пользовательская норма: 4 км = 100 ккал
var BIKE_KCAL_PER_KM = 12;
var BIKE_KCAL_DAILY_CAP = 250;

function isTrainingDay(date){
  // Тренировка = есть записанный факт; для сегодня/будущего — ещё и запланированные упражнения
  date = date || currentDate;
  var list = getWorkouts(date);
  if(!list.length) return false;
  if(date >= todayStr()) return true;
  return list.some(function(w){ return w.done || (w.sets && String(w.sets).trim()); });
}
function bodyFatPercent(){
  var v=Number(goals.bodyFatPct);
  return isFinite(v)&&v>=3&&v<=60?v:18;
}
function macrosFromDeficitPlan(planKcal, mode){
  // Белок: 2 г на каждый кг текущей массы тела. Жиры: фиксированный минимум 50 г.
  // Калорийность режима не меняем: углеводы заполняют остаток после белка и жиров.
  var kg=bodyKgNow()||77;
  var latest=(weightLog||[]).filter(function(w){return w&&w.kg>0;}).sort(function(a,b){return a.date.localeCompare(b.date);});
  if(latest.length) kg=Number(latest[latest.length-1].kg)||kg;
  var protein=Math.round(kg*2);
  var fat=50;
  var kcal=Math.max(0,Math.round(planKcal));
  var carbs=Math.max(0,Math.floor((kcal-protein*4-fat*9)/4));
  return {kcal:protein*4+fat*9+carbs*4,protein:protein,fat:fat,carbs:carbs,lean:kg};
}
function autoGoalPlan(mode){
  var e=estimateMaintenanceKcal(), maintenance=(e&&e.kcal)||goals.maintenanceKcal||2000, kg=bodyKgNow()||77;
  var deficit=0, rate='';
  if(mode==='cut'){deficit=kg*0.02*7700/30.4375;rate='дефицит для снижения ≈2% массы в месяц';}
  else if(mode==='supercut'){deficit=kg*0.04*7700/30.4375;rate='дефицит для снижения ≈4% массы в месяц';}
  else if(mode==='bulk'){rate='профицит +150 ккал';}
  else if(mode==='recomp'){deficit=kg*0.01*7700/30.4375;rate='небольшой дефицит ≈1% массы в месяц';}
  else {mode='maintain';rate='энергетическое поддержание';}
  var kcal=mode==='bulk'?Math.round(maintenance+150):Math.round(maintenance-deficit);
  return {maintenance:maintenance,kcal:kcal,rate:rate};
}

function deficitPlanKcal(){
  var maint = effectiveMaintenanceKcal();
  // −0.5 кг/нед ≈ 0.5 * 7700 / 7 ≈ 550 ккал/день
  // При одном дне поддержки недельный дефицит распределяется на 6 остальных дней.
  var dailyDeficit = Math.round((0.5 * 7700) / (goals.rule8020 ? 6 : 7));
  var plan = Math.round(maint - dailyDeficit);
  // только нижний пол: 1200; верхнего потолка нет
  if(plan < 1200) plan = 1200;
  return plan;
}

function deficitPlanKcalRaw(){
  return deficitPlanKcal();
}

function isMaintenanceDay(date){
  if(!goals.rule8020) return false;
  date = date || currentDate;
  var p = date.split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  var wd = d.getDay(); // 0 Sun
  var want = goals.maintenanceWeekday;
  if(want == null) want = 0;
  return wd === +want;
}

/** Срыв в день поддержки: превысили maintenance — без компенсации голодом на след. дни */
function maintenanceSlipOn(date){
  if(!goals.rule8020 || !isMaintenanceDay(date)) return false;
  var maint = effectiveMaintenanceKcal();
  var t = computeTotals(getDiary(date));
  return t.kcal > maint + 30;
}

function baseGoals(date){
  date = date || currentDate;
  // Авто от веса: план −0.5 кг/нед от оценённой поддержки
  var planKcal = goals.kcal;
  var protein = goals.protein;
  var fat = goals.fat;
  var carbs = goals.carbs;
  if(goals.autoFromWeight){
    var ap=autoGoalPlan(goals.autoMode||'cut');
    var m=macrosFromDeficitPlan(ap.kcal,goals.autoMode||'cut');
    planKcal=m.kcal;protein=m.protein;fat=m.fat;carbs=m.carbs;
  }
  // 80/20: один день поддержки в неделю
  if(isMaintenanceDay(date)){
    var mk = effectiveMaintenanceKcal();
    var fatM = Math.max(30, Math.min(50, goals.fat != null ? goals.fat : 45));
    var carbM = Math.round(Math.max(0, mk - protein * 4 - fatM * 9) / 4);
    return { kcal: mk, protein: protein, fat: fatM, carbs: carbM, isMaintenance: true };
  }
  return { kcal: planKcal, protein: protein, fat: fat, carbs: carbs, isMaintenance: false };
}
// start of week = Monday
function averageBaseGoalForWeek(endDate, key){
  var sum = 0;
  for(var i=0;i<7;i++) sum += Number(baseGoals(shiftDate(endDate || currentDate, -i))[key]) || 0;
  return sum / 7;
}

function weekMonday(date){
  var p = date.split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  var day = d.getDay(); // 0 Sun
  var diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

var MIN_DAY_KCAL = 1200; // нижний пол плана

// Белковая цель независима от предыдущих дней: никакого накопления «долга».
function proteinGoalFor(date){
  return baseGoals(date || currentDate).protein;
}

function activeGoals(date){
  // Никаких переносов между днями: калории, жиры и углеводы не урезаются
  // из-за вчерашнего превышения. Контроль калорий и жиров идёт по средней недели.
  // Белок всегда остаётся отдельной ежедневной целью.
  return baseGoals(date || currentDate);
}

/** Средние макросы за последние n полностью отмеченных дней (включая date) */
function weeklyMacroAverages(endDate, n){
  n = n || 7;
  endDate = endDate || todayStr();
  var sum = { kcal:0, protein:0, fat:0, carbs:0, fiber:0 }, days = 0;
  for(var i=0;i<n;i++){
    var d = shiftDate(endDate, -i);
    var e = getDiary(d);
    if(!e.length) continue;
    var t = computeTotals(e);
    sum.kcal += (t.kcal - dayBikeBurn(d)); sum.protein += t.protein; sum.fat += t.fat;
    sum.carbs += t.carbs; sum.fiber += t.fiber;
    days++;
  }
  if(!days) return null;
  return {
    days: days,
    kcal: sum.kcal/days, protein: sum.protein/days, fat: sum.fat/days,
    carbs: sum.carbs/days, fiber: sum.fiber/days
  };
}

/**
 * Логика добора:
 * 1) Персональная цель белка каждый день, ≥30 г за основной приём
 * 2) Калории — ориентир СРЕДНЕГО за неделю, не жёсткий минимум дня
 * 3) Жиры — контроль среднего за неделю; минимум 30 г/день в среднем
 * 4) Клетчатка 25–30 г/день
 * 5) Углеводы — не цель добора; только если нужно закрыть ккал после Б и Ж
 */
function buildTrainingDiagnostics(){
  var items=[], sessions=0,totalSets=0,rirLow=0,lastSession=null,missing=[];
  for(var i=7;i>=1;i--){
    var d=shiftDate(todayStr(),-i);
    getWorkouts(d).forEach(function(w){
      if(!w || !w.done) return;
      sessions++; if(!lastSession || d>lastSession.date) lastSession={date:d,workout:w};
      var reps=parseSetArray(w.sets);
      totalSets+=reps.length;
      if(!reps.length) missing.push(w.name||'упражнение');
      var rv=Array.isArray(w.rirBySet)?w.rirBySet:(w.rir!=null?reps.map(function(){return +w.rir;}):[]);
      rv.forEach(function(v){if(v!=null && isFinite(+v) && +v<=1)rirLow++;});
    });
  }
  var biceps=round(weeklyMuscleLoad(7)['Бицепс']||0);
  var plateaus=exercisePlateaus(56);
  if(missing.length) items.push({level:'info',title:'Не все тренировки записаны полностью',text:'Нет подходов у: '+escapeHTML(missing.slice(0,3).join(', '))+'. Записывай повторы, иначе приложение не сможет оценить прогрессию.'});
  if(rirLow>=2) items.push({level:'warn',title:'Несколько подходов почти до отказа','text':'За неделю отмечено '+rirLow+' подходов с RIR 0–1. На следующей тренировке не повышай вес или повторы в этих упражнениях; сначала закрепи технику и запас.'});
  if(sessions>=5 || totalSets>=55){items.push({level:'warn',title:'Высокая недельная нагрузка','text':'За 7 дней: '+sessions+' тренировок и '+totalSets+' подходов. Не добавляй объём автоматически; при ухудшении результатов сократи рабочие подходы примерно на 20–30% на неделю.'});}
  if(biceps>16){items.push({level:'warn',title:'Бицепс получил большой объём','text':'Оценка — '+biceps+' эффективных подходов за неделю. Не добавляй новые подходы на бицепс; оставь объём прежним или немного снизь его.'});}
  if(plateaus.length>=2 && (sessions>=3 || totalSets>=25)){items.push({level:'info',title:'Возможное плато в нескольких упражнениях','text':'Приложение видит отсутствие роста расчётной силы в '+plateaus.length+' упражнениях. Не наращивай объём вслепую: проверь технику и питание; при накопленной усталости сделай облегчённую неделю.'});}
  if(!items.length && sessions){items.push({level:'ok',title:'Явных проблем по журналу не видно','text':'За 7 дней записано '+sessions+' тренировок и '+totalSets+' подходов. Продолжай постепенную прогрессию, не повышая нагрузку рывками.'});}
  if(!sessions){items.push({level:'info',title:'Пока мало данных','text':'Запиши несколько выполненных тренировок — тогда приложение сможет оценивать нагрузку, RIR и динамику упражнений.'});}
  var rank={warn:0,info:1,ok:2};items.sort(function(a,b){return rank[a.level]-rank[b.level];});
  return items.slice(0,5);
}

function renderTrainingDiagnostics(){
  var items=buildTrainingDiagnostics();
  var period=fmtDateHuman(shiftDate(todayStr(),-7))+' — '+fmtDateHuman(shiftDate(todayStr(),-1));
  return '<div class="section-title">Автопроверка тренировок</div><div class="card auto-check-card"><div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Период: '+period+' · без сегодняшнего дня</div>'+items.map(function(x){return '<div class="auto-check-item '+(x.level==='warn'?'auto-check-warn':(x.level==='ok'?'auto-check-ok-row':'auto-check-info'))+'"><b>'+x.title+'</b><div>'+x.text+'</div></div>';}).join('')+'</div>';
}

    showToast('Нет шаблона'); return;
  }
  var dest = getDiary(currentDate);
  dayTemplate.entries.forEach(function(e){

      row.custom = true; row.name = e.name; row.kcal = e.kcal; row.protein = e.protein; row.fat = e.fat; row.carbs = e.carbs; row.fiber = e.fiber||0; row.grams=e.grams; row.foodGroup=e.foodGroup||'other';

function remainingMacros(date){
  date = date || currentDate;
  var g = activeGoals(date);
  var t = computeTotals(getDiary(date));
  return {
    kcal: Math.max(0, g.kcal - t.kcal),
    protein: Math.max(0, g.protein - t.protein),
    fat: Math.max(0, g.fat - t.fat),
    carbs: Math.max(0, g.carbs - t.carbs),
    goals: g,
    totals: t
  };
}

function maxGramsForProduct(product, rem){
  if(!product) return 0;
  // Limits only by kcal, fat, carbs — protein is soft, not blocking
  var limits = [];
  if(product.kcal > 0) limits.push(rem.kcal / product.kcal * 100);
  if(product.fat > 0) limits.push(rem.fat / product.fat * 100);
  if(product.carbs > 0) limits.push(rem.carbs / product.carbs * 100);
  if(!limits.length) return 500;
  var g = Math.floor(Math.min.apply(null, limits));
  return Math.max(0, g);
}

function suggestAlternatives(selected, wantedGrams, rem){
  if(!selected || !wantedGrams) return [];
  var f = wantedGrams / 100;
  var need = {
    kcal: selected.kcal * f,
    fat: selected.fat * f,
    carbs: selected.carbs * f
  };
  var over = need.kcal > rem.kcal + 5 || need.fat > rem.fat + 2 || need.carbs > rem.carbs + 2;
  if(!over) return [];

  var maxG = maxGramsForProduct(selected, rem);
  var suggestions = [];
  if(maxG >= 20 && maxG < wantedGrams){
    suggestions.push({ kind:'portion', text: 'Максимум по лимитам (ккал/Ж/У): '+maxG+' г «'+selected.name+'» (≈'+round(selected.kcal*maxG/100)+' ккал)' });
  } else if(maxG < 20){
    suggestions.push({ kind:'portion', text: 'Почти нет остатка по ккал/жирам/углеводам для этого продукта.' });
  }

  var scored = products.map(function(p){
    if(p.id === selected.id) return null;
    // skip pure sugar / empty junk (0 protein and very high carbs density)
    if((p.protein||0) < 0.5 && (p.carbs||0) > 80) return null;
    var g = maxGramsForProduct(p, rem);
    if(g < 30) return null;
    g = Math.min(g, 250);
    var pf = g/100;
    var score = 0;
    if(rem.carbs > 10) score += Math.min(p.carbs*pf, rem.carbs) * 0.3;
    score += Math.min(p.kcal*pf, rem.kcal) * 0.05;
    // slight preference for some protein without requiring it
    score += Math.min(p.protein*pf, 30) * 0.3;
    // penalize very high fat if fat remaining is low
    if(rem.fat < 15 && p.fat > 15) score -= 20;
    return { p:p, g:g, score:score, kcal:round(p.kcal*pf), protein:round(p.protein*pf), fat:round(p.fat*pf), carbs:round(p.carbs*pf) };
  }).filter(Boolean).sort(function(a,b){ return b.score - a.score; });

  if(scored[0]) suggestions.push({ kind:'alt', text: 'Лучше: '+scored[0].g+' г «'+scored[0].p.name+'» (Б'+scored[0].protein+' Ж'+scored[0].fat+' У'+scored[0].carbs+', '+scored[0].kcal+' ккал)' });
  if(scored[1]) suggestions.push({ kind:'alt', text: 'Или: '+scored[1].g+' г «'+scored[1].p.name+'» (Б'+scored[1].protein+' Ж'+scored[1].fat+' У'+scored[1].carbs+', '+scored[1].kcal+' ккал)' });

  return suggestions.slice(0, 3);
}
function ensureExerciseInLibrary(name){

  exercises.push(ex);

}

function parseSetArray(setsStr){
  if(!setsStr) return [];
  var s = String(setsStr).trim().toLowerCase().replace(/×/g,'x').replace(/х/g,'x');
  if(/[\d]+([\/\-\s]+[\d]+)+/.test(s) && s.indexOf('x') === -1){
    return s.split(/[\/\-\s]+/).map(function(n){ return parseInt(n,10); }).filter(function(n){ return n>0; });
  }
  var m = s.match(/(\d+)\s*x\s*(\d+)/);
  if(m){
    var a = parseInt(m[1],10), b = parseInt(m[2],10);
    // 12x3 → three sets of 12; 3x12 → three sets of 12 if a < b
    if(a <= 20 && b <= 10) return Array(b).fill(a);
    if(b <= 20 && a <= 10) return Array(a).fill(b);
    return Array(Math.min(a,b)).fill(Math.max(a,b));
  }
  var one = parseInt(s,10);
  return one > 0 ? [one] : [];
}
function parseTotalReps(setsStr){
  return parseSetArray(setsStr).reduce(function(a,b){ return a+b; }, 0);
}

function recentTrainingFatigue(){
  var from=shiftDate(todayStr(),-7),all=trainingJournalList().filter(function(s){return s&&s.status==='finished'&&s.date>=from&&s.date<todayStr();});
  var seen={},sessions=0,sets=0,near=0,failures=0;
  all.forEach(function(s){var key=s.id||s.date+'-'+(s.started||0);if(seen[key])return;seen[key]=1;sessions++;(s.sets||[]).forEach(function(x){sets++;if(x.rir!=null&&+x.rir<=1)near++;if(x.rir!=null&&+x.rir===0)failures++;});});
  // Старые данные без журнала учитываем одной сессией на дату, а не по числу упражнений.
  var journalDates={};all.forEach(function(s){journalDates[s.date]=1;});
  for(var i=1;i<=7;i++){var d=shiftDate(todayStr(),-i);if(journalDates[d])continue;var ws=getWorkouts(d)||[],daySets=0;ws.forEach(function(w){if(w&&w.done){daySets+=parseSetArray(w.sets||'').length;}});if(daySets){sessions++;sets+=daySets;}}
  return {high:near>=5||failures>=3,sessions:sessions,sets:sets,near:near,failures:failures};
}

/** Минимальный шаг веса по инвентарю: блины 1,25 / 2,5 / 3 кг. Гантели: 1 блин 1,25 на гантель; штанга: 1,25 на сторону = 2,5 кг */
function weightStepFor(name){var cfg=/гантел|молот/i.test(String(name||''))?equipmentConfig.dumbbell:equipmentConfig.barbell,plates=(cfg&&cfg.plates||[]).filter(function(x){return +x.weight>0&&+x.pairs>0;});return plates.length?Math.min.apply(null,plates.map(function(x){return +x.weight;}))*2:(/гантел|молот/i.test(String(name||''))?1.25:2.5);}

function suggestNextSession(last, name){
  if(!last) return null;
  var bw = isBodyweightName(name || last.name);
  if(last.weight == null && !bw) return null;
  var sets = parseSetArray(last.sets);
  var fatigue=recentTrainingFatigue();
  if(fatigue.high && sets.length>2){return {weight:last.weight,sets:sets.slice(0,-1).join('/'),text:'Автоконтроль объёма: высокая нагрузка за 7 дней ('+fatigue.sessions+' тренировок, '+fatigue.sets+' подходов). Временно убери один подход и не повышай вес.'};}
  if(!sets.length) return {weight:last.weight, sets:bw?'1/1/1':'8/8/8', text:'Начни с контролируемых подходов и оставляй 2–3 повтора в запасе.'};

  var rir = Array.isArray(last.rirBySet) && last.rirBySet.length
    ? last.rirBySet.map(function(x){return x==null?null:Number(x);})
    : (last.rir != null ? sets.map(function(){return Number(last.rir);}) : []);
  var validRir = rir.filter(function(x){return x!=null && isFinite(x);});
  var minRir = validRir.length ? Math.min.apply(null,validRir) : null;
  // Если хотя бы один подход был почти до отказа — не повышаем нагрузку.
  if(minRir != null && minRir <= 1){
    return {weight:last.weight, sets:sets.join('/'), text:(minRir===0?'Был отказной подход. ':'В одном из подходов оставался 0–1 повтор в запасе. ')+'Повтори тот же вес и повторы, без повышения нагрузки.'};
  }

  var minRep = Math.min.apply(null,sets);
  var maxRep = Math.max.apply(null,sets);
  if(bw){
    if(minRir != null && minRir <= 2) return {weight:last.weight,sets:sets.join('/'),text:'Подтягивания или другое упражнение с собственным весом дались тяжело (RIR 0–2). Повтори тот же объём; не добавляй повторы через силу.'};
    var bodyNext = sets.slice().sort(function(a,b){return b-a;});
    // Сначала выравниваем результат по убыванию: сильные подходы идут первыми,
    // дополнительный повтор добавляется в самый слабый (последний) подход.
    // При равных значениях +1 получает первый подход.
    var addIndex = bodyNext.length-1;
    for(var bi=0;bi<bodyNext.length-1;bi++){if(bodyNext[bi]===bodyNext[addIndex]){addIndex=bi;break;}}
    bodyNext[addIndex] = Math.min(15, bodyNext[addIndex] + 1);
    return {weight:last.weight, sets:bodyNext.join('/'), text:'Добавь один повтор по распределению нагрузки: '+bodyNext.join('/')+'. Когда все подходы станут ровными и техника сохранится, добавляй следующий повтор.'};
  }

  // Повышаем вес только когда каждый рабочий подход достиг верхней границы и запас не был критически мал.
  if(minRep >= 12 && (minRir == null || minRir >= 2)){
    var currentW = Number(last.weight);
    var step = weightStepFor(name || last.name), isDb = step < 2;
    var nextW = equipmentSnapWeight(name||last.name,Math.round((currentW + step) * 100) / 100);if(nextW<=currentW){return {weight:currentW,sets:sets.join('/'),text:'По текущему набору блинов следующий шаг нагрузки недоступен. Проверь настройки оборудования.'};}
    var estimated = currentW * (1 + minRep/30);
    var nextRep = Math.floor((estimated / nextW - 1) * 30);
    nextRep = Math.max(isDb ? 6 : 8, Math.min(12, nextRep));
    var nextSets = sets.map(function(){return nextRep;}).join('/');
    var stepTxt = isDb ? '+1,25 кг на гантель (один блин 1,25)' : '+2,5 кг (по блину 1,25 на сторону)';
    return {weight:nextW, sets:nextSets, text:'Все подходы достигли 12 повторов. Следующий шаг: '+nextW+' кг ('+stepTxt+') и '+nextSets+'. Если техника ухудшится — оставь прежний вес.'};
  }

  // Упорядочиваем цель от сильного подхода к слабому и добавляем один повтор
  // в первый из минимальных подходов. Например 12/8/8/12 -> 12/12/9/8.
  var next = sets.slice().sort(function(a,b){return b-a;}), minValue=Math.min.apply(null,next), addIndex=next.indexOf(minValue);
  next[addIndex]=Math.min(12,next[addIndex]+1);
  return {weight:last.weight, sets:next.join('/'), text:'Добавь один повтор в выбранный подход: '+last.weight+' кг · '+next.join('/')+'. Остальные подходы пока оставь без изменений.'};
}

function exerciseMatchKey(name){
  var n = (name||'').toLowerCase().replace(/[ё]/g,'е').replace(/[^а-яa-z0-9]+/g,' ').trim();
  if(/подтяг/.test(n)) return 'pullup';
  if(/жим/.test(n) && /(леж|полу|пол|floor)/.test(n)) return 'floorpress_dumbbell';
  if(/жим/.test(n) && /(стоя|вверх|плеч)/.test(n)) return 'overheadpress';
  if(/сгиб|подъем|подьем/.test(n) && /штанг/.test(n)) return 'barbellcurl';
  if(/молот/.test(n)) return 'hammercurl';
  if(/сторон/.test(n) && /(гантел|развед|подъем|подьем)/.test(n)) return 'lateralraise';
  if(/сгиб|подъем|подьем/.test(n) && /гантел/.test(n)) return 'dumbbellcurl';
  return n;
}

/** Последняя реальная (не только план) запись упражнения до date */
function getLastRealSession(exerciseName, beforeDate){
  var hist = collectExerciseHistory(exerciseName);
  var eligible = hist.filter(function(h){
    if(beforeDate && h.date >= beforeDate) return false;
    if(!h.sets || !String(h.sets).trim()) return false;
    return h.weight != null || isBodyweightName(h.name);
  });
  // Факт всегда приоритетнее старого/перенесённого плана. Иначе план среды мог
  // брать цель из старой среды, игнорируя завершённую тренировку понедельника.
  var completed = eligible.filter(function(h){ return h.done === true; });
  var pool = completed.length ? completed : eligible.filter(function(h){ return h.planned !== true; });
  return pool.length ? pool[pool.length-1] : null;
}

function weekdayOf(date){
  var p = date.split('-');
  return new Date(+p[0], +p[1]-1, +p[2]).getDay();
}

/** Ближайший прошлый день с тренировкой (желательно тот же день недели) */
function findTemplateTrainingDate(forDate){
  var wantWd = weekdayOf(forDate);
  var sameWd = null, any = null;
  // сканируем до 56 дней назад
  for(var i=1;i<=56;i++){
    var d = shiftDate(forDate, -i);
    var list = getWorkouts(d);
    if(!list || !list.length) continue;
    // есть хотя бы одно выполненное или с весом
    var real = list.filter(function(w){ return w.weight != null && (w.done !== false || !w.planned); });
    if(!real.length) real = list;
    if(!real.length) continue;
    if(!any) any = d;
    if(weekdayOf(d) === wantWd){ sameWd = d; break; }
  }
  return sameWd || any;
}

/**
 * Обратная связь: факт vs цель
 * → совет: +вес или +повторы (та же логика, что и у плана на следующую)
 */
function feedbackAfterSession(done, target){
  if(!done || (done.weight == null && !isBodyweightName(done.name))) return null;
  var dSets = parseSetArray(done.sets);
  var tSets = target ? parseSetArray(target.sets || target.targetSets) : [];
  var bw = isBodyweightName(done.name);
  var dW = done.weight;
  var tW = target && target.weight != null ? target.weight : (target && target.targetWeight);
  if(!dSets.length) return { text: 'Запиши повторы, чтобы дать совет по прогрессии.' };
  var dMin = Math.min.apply(null, dSets);
  var dMax = Math.max.apply(null, dSets);
  var dAll = dSets.every(function(r){ return r === dMax; });

  // не добил цель по повторам на том же весе
  if(!bw && tW != null && dW != null && dW <= tW && tSets.length){
    var tMin = Math.min.apply(null, tSets);
    if(dMin < tMin || (!dAll && dMin < dMax)){
      return {
        kind: 'reps',
        text: 'Цель по повторам не закрыта. На следующей: тот же вес '+dW+' кг, добей до '+dSets.map(function(){return dMax;}).join('/')+'.'
      };
    }
  }
  var next = suggestNextSession(done, done.name);
  if(!next) return null;
  var up = !bw && next.weight > dW;
  return {
    kind: up ? 'weight' : 'reps',
    text: (dAll ? 'Отлично, все подходы по '+dMax+'. ' : 'Сейчас '+done.sets+'. ') + 'Следующий раз: '+(bw?'собственный вес':next.weight+' кг')+' · '+next.sets+'.'
  };
}

/** План на одно упражнение шаблона: по последней реальной сессии, иначе стартовые значения */
function exerciseReplacementMap(){
  var map=sGet('exerciseReplacements',{});return map&&typeof map==='object'?map:{};
}
function resolveExerciseReplacement(name){
  var map=exerciseReplacementMap(),key=String(name||'').toLowerCase().replace(/[ё]/g,'е').trim();
  return map[key]||name;
}
function rememberExerciseReplacement(oldName,newName){
  var map=exerciseReplacementMap(),key=String(oldName||'').toLowerCase().replace(/[ё]/g,'е').trim();
  if(key&&newName){map[key]=newName;sSet('exerciseReplacements',map);}
}

function planForExercise(item, date){
  var last = getLastRealSession(item.name, date);
  var next = null, fromDate = null, startNote = '';
  if(last && (last.weight != null || item.bw || isBodyweightName(item.name)) && (!setsBroken(last.sets) || item.bw || isBodyweightName(item.name))){
    if(last.planned && !last.done){
      next={weight:last.weight,sets:last.sets,text:'Перенос последней цели: предыдущая тренировка ещё не выполнена, поэтому повторы не увеличиваются автоматически.'};
    }else{
      next = suggestNextSession(last, item.name);
    }
    fromDate = last.date;
  }
  if(!next){
    var w = (item.start && item.start.weight != null) ? item.start.weight
          : ((last && last.weight != null) ? last.weight : bodyKgNow());
    startNote = last ? 'Прошлый раз подход сорван ('+last.sets+') — старт по плану: ' : 'Старт по плану: ';
    next = {
      weight: w,
      sets: item.start.sets,
      text: startNote + (item.bw ? '' : w+' кг · ') + item.start.sets + '.'
    };
    fromDate = last ? last.date : null;
  }
  if(item.bw || isBodyweightName(item.name)){next.weight=bodyKgAtDate(date)||bodyKgNow()||next.weight;}
  if(next.weight!=null&&!isBodyweightName(item.name))next.weight=equipmentSnapWeight(item.name,+next.weight);
  var fitted = fitSets(next.sets, item.n);
  var recentLoad=weeklyMuscleLoadBefore(date,7), prof=exerciseMuscleProfile(item.name);
  var overloaded=prof.primary.some(function(m){return (recentLoad[m]||0)>=16;});
  if(overloaded && parseSetArray(fitted).length>2){var parts=parseSetArray(fitted);parts.pop();fitted=parts.join('/');next.text+=' Объём этой группы уже высокий — убран один подход.';}
  if(fitted !== next.sets){ next.text = next.text.replace(next.sets, fitted); next.sets = fitted; }
  next.fromDate = fromDate;
  return next;
}

function workoutPriority(name){
  var p=exerciseMuscleProfile(name), all=p.primary.concat(p.secondary.map(function(x){return x[0];}));
  if(isBodyweightName(name) && /подтяг|негатив/.test(String(name||'').toLowerCase())) return -1;
  if(all.some(function(x){return /бицепс|брахиалис/.test(x);})) return 0;
  if(all.some(function(x){return /грудь/.test(x);})) return 1;
  if(all.some(function(x){return /широчайшие|верх спины|спина/.test(x);})) return 2;
  if(all.some(function(x){return /трицепс/.test(x);})) return 3;
  return 4;
}
function orderWorkoutRows(rows){return (rows||[]).map(function(w,i){return {w:w,i:i};}).sort(function(a,b){return workoutPriority(a.w.name)-workoutPriority(b.w.name)||a.i-b.i;}).map(function(x){return x.w;});}
function exerciseSessions(name){return collectExerciseHistory(name).filter(function(x){return x && x.date;}).sort(function(a,b){return a.date.localeCompare(b.date);});}
function estimatedExerciseStrength(session){
  if(!session||!session.sets)return null;
  var baseWeight=session.weight!=null?+session.weight:(session.bodyweight?bodyKgNow():0); if(!baseWeight)return null;
  var reps=parseSetArray(session.sets), best=0;
  reps.forEach(function(r){var v=baseWeight*(1+(+r)/30);if(v>best)best=v;});
  return best||null;
}
function openSameExerciseComparison(name){
  var hist=exerciseSessions(name), root=document.getElementById('modalRoot'), recent=hist.slice(-6).reverse();
  var rows=recent.map(function(h,i){var prev=recent[i+1],cur=estimatedExerciseStrength(h),old=estimatedExerciseStrength(prev),delta=cur&&old?Math.round((cur/old-1)*100):null;
    return '<div class="entry"><div class="name">'+fmtDateHuman(h.date)+'<div style="font-size:11px;color:var(--muted)">'+escapeHTML((h.bodyweight?'собственный вес':(h.weight!=null?h.weight+' кг':'собственный вес'))+' · '+(h.sets||'—'))+'</div></div><div class="kcal">'+(delta==null?'—':(delta>0?'+':'')+delta+'%')+'</div></div>';}).join('');
  root.innerHTML='<div class="overlay" id="ov"><div class="sheet"><h2>'+escapeHTML(name)+' · сравнение</h2><div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Сравнение с предыдущей записью этого же упражнения. Процент — изменение расчётного 1ПМ по лучшему подходу.</div>'+(rows||'<div class="empty">Пока недостаточно записей</div>')+'<button class="btn primary" id="closeCompare" style="width:100%;margin-top:12px;">Закрыть</button></div></div>';
  document.getElementById('closeCompare').onclick=closeModal;document.getElementById('ov').onclick=function(e){if(e.target.id==='ov')closeModal();};
}
function planCustomKey(date){return 'planCustom:'+date;}
function markPlanCustom(date){try{sSet(planCustomKey(date),1);}catch(e){}}
function isPlanCustom(date){try{return !!sGet(planCustomKey(date),false);}catch(e){return false;}}
function isAutoEmptyRow(w){
  return !!(w && w.planned && !w.done && !(w.sets && String(w.sets).trim()) && !w.manual && (w.auto || w.fromDate));
}

function buildTemplateRows(code, date, manual){
  var tpl = WORKOUT_TEMPLATES[code] || [];
  return tpl.map(function(item){
    var plannedItem=Object.assign({},item,{name:resolveExerciseReplacement(item.name)});
    var nx = planForExercise(plannedItem, date);
    return {
      id: uid(),
      name: plannedItem.name,
      weight: nx.weight,
      sets: '',
      targetWeight: nx.weight,
      targetSets: nx.sets,
      advice: nx.text,
      planned: true,
      done: false,
      fromDate: nx.fromDate || null,
      tpl: code,
      auto: !manual,
      manual: !!manual
    };
  });
}

/** Ручная подстановка (кнопка): шаблон дня или ближайшего запланированного */
function autoSeedWorkoutsForDate(date, manual){
  date = date || currentDate;
  var existing = getWorkouts(date);
  if(existing && existing.length) return false;
  var code = WORKOUT_SCHEDULE[weekdayOf(date)] || nextTemplateCode(date);
  var rows = buildTemplateRows(code, date, !!manual);
  if(!rows.length) return false;
  if(manual){ try{sRemove(planCustomKey(date));}catch(e){} }
  saveWorkouts(date, rows);
  return true;
}

/** Вызывается при отрисовке дня: Пн/Ср/Пт — свежий план, остальные дни — без упражнений */
function prepareWorkoutsForDate(date){
  if(goals.workoutAuto === false) return;
  date = date || currentDate;
  var list = getWorkouts(date) || [];
  var code = WORKOUT_SCHEDULE[weekdayOf(date)];
  var today = todayStr();

  // Не тренировочный день: убираем пустые автопланы (в т.ч. старые «вторники»)
  if(!code){
    if(date >= today && list.some(isAutoEmptyRow)){
      saveWorkouts(date, list.filter(function(w){ return !isAutoEmptyRow(w); }));
    }
    return;
  }
  if(date < today) return; // прошлое не трогаем
  var replacementsChanged=false;
  list.forEach(function(w){
    if(!w || w.done || !w.planned) return;
    var replacement=resolveExerciseReplacement(w.name);
    if(replacement===w.name) return;
    w.name=replacement;
    var tplItem=(WORKOUT_TEMPLATES[code]||[]).find(function(t){return resolveExerciseReplacement(t.name)===replacement;});
    if(tplItem){
      var item=Object.assign({},tplItem,{name:replacement}),nx=planForExercise(item,date);
      w.weight=nx.weight;w.targetWeight=nx.weight;w.targetSets=nx.sets;w.advice=nx.text;w.fromDate=nx.fromDate||null;
    } else {w.weight=null;w.targetWeight=null;w.sets='';w.targetSets=w.targetSets||'3x10';w.advice='Замена упражнения. Цель рассчитана по последним результатам именно этого упражнения.';}
    replacementsChanged=true;
  });
  if(replacementsChanged) saveWorkouts(date,list);
  if(isPlanCustom(date)) return; // пользователь менял/удалял упражнения — не пересоздаём план

  // Пусто → создаём план по шаблону дня
  if(!list.length){
    var rows = buildTemplateRows(code, date, false);
    if(rows.length) saveWorkouts(date, rows);
    return;
  }
  // Весь план автосгенерирован и ничего не записано → пересобираем по свежим данным
  if(list.every(isAutoEmptyRow)){
    var fresh = buildTemplateRows(code, date, false);
    if(fresh.length) saveWorkouts(date, fresh);
    return;
  }
  // Смешанный день: обновляем только пустые автопланы
  var tpl = WORKOUT_TEMPLATES[code] || [];
  var changed = false;
  list.forEach(function(w){
    if(!isAutoEmptyRow(w)) return;
    var item = tpl.find(function(t){ return t.name.toLowerCase() === (w.name||'').toLowerCase(); });
    if(!item) return;
    var nx = planForExercise(item, date);
    w.weight = nx.weight; w.targetWeight = nx.weight; w.targetSets = nx.sets;
    w.advice = nx.text; w.fromDate = nx.fromDate || null; w.auto = true;
    changed = true;
  });
  if(changed) saveWorkouts(date, list);
}

function collectExerciseHistory(exerciseName){
  var nameLower = (exerciseName||'').toLowerCase();
  var matchKey = exerciseMatchKey(exerciseName);
  var pts = [];
  function scanDate(date, list){
    (list||[]).forEach(function(w){
      if(w&&/гантел/i.test(w.name||'')&&Math.abs((+w.weight||0)-13)<0.001)w.weight=13.5;
      if(((w.name||'').toLowerCase() === nameLower || exerciseMatchKey(w.name) === matchKey) && (w.weight != null && !isNaN(w.weight) || isBodyweightName(w.name) && w.sets)){
        // пропускаем чисто плановые без факта
        if(w.planned && !w.done && !(w.sets && String(w.sets).trim())) return;
        var reps = parseTotalReps(w.sets||'');
        var bodyweight = isBodyweightName(w.name);
        var volume = bodyweight ? reps : w.weight * (reps > 0 ? reps : 1);
        pts.push({date:date, weight:bodyweight?null:w.weight, bodyweight:bodyweight, sets:w.sets||'', reps:reps, volume:volume, rir:w.rir==null?null:+w.rir, planned:!!w.planned, done:!!w.done});
      }
    });
  }
  Object.keys(workoutCache).forEach(function(d){ scanDate(d, workoutCache[d]); });
  Object.keys(_idbCache).forEach(function(k){if(k.indexOf('workout:')===0){var d=k.slice(8);if(!workoutCache[d])scanDate(d,_idbCache[k]);}});
  try{
    if(_storageOk){
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('workout:')===0){
          var d = k.slice(8);
          if(!workoutCache[d]){
            try{
              var list = JSON.parse(localStorage.getItem(k));
              scanDate(d, list);
            }catch(e){}
          }
        }
      }
    }
  }catch(e){}
  pts.sort(function(a,b){ return a.date.localeCompare(b.date); });
  // Сохраняем все записи, включая несколько рабочих подходов/вариантов за день.
  // Для графика сортируем по дате и объёму, не скрывая слабые подходы.
  return pts.sort(function(a,b){ return a.date.localeCompare(b.date) || a.volume-b.volume; });
}

function exerciseProgressSvg(history){
  if(!history || history.length < 2) return '<div class="empty" style="padding:12px;">Нужно минимум 2 тренировки с весом</div>';
  // Graph volume (weight × reps) so same weight + more reps shows progress
  var vals = history.map(function(h){ return h.volume; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var range = (max - min) || 1;
  min -= range * 0.12; max += range * 0.12; range = max - min;
  var W = 300, H = 120, padL = 10, padR = 10, padT = 12, padB = 22;
  var t0 = dateToMs(history[0].date), t1 = dateToMs(history[history.length-1].date);
  var tSpan = Math.max(t1 - t0, 86400000);
  var segments = '';
  function xy(h){
    var x = padL + ((dateToMs(h.date) - t0) / tSpan) * (W - padL - padR);
    var y = padT + (1 - (h.volume - min) / range) * (H - padT - padB);
    return {x:x, y:y};
  }
  for(var i=1;i<history.length;i++){
    var a = xy(history[i-1]), b = xy(history[i]);
    var up = history[i].volume >= history[i-1].volume;
    segments += '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+(up?'#3c6e47':'#c45c4a')+'" stroke-width="2.2" stroke-linecap="round"/>';
  }
  var circles = history.map(function(h){
    var p = xy(h);
    return '<circle cx="'+p.x+'" cy="'+p.y+'" r="4.5" fill="#fff" stroke="#3c6e47" stroke-width="2"/>';
  }).join('');
  var labels = '<text x="'+padL+'" y="'+(H-4)+'" font-size="9" fill="#8a8a7d">'+history[0].date.slice(5)+'</text>'+
    '<text x="'+(W-padR)+'" y="'+(H-4)+'" font-size="9" fill="#8a8a7d" text-anchor="end">'+history[history.length-1].date.slice(5)+'</text>';
  var first = history[0], last = history[history.length-1];
  var dVol = round(last.volume - first.volume);
  var bodyweightOnly = history.every(function(h){return h.bodyweight;});
  var dWt = bodyweightOnly ? 0 : round((last.weight||0) - (first.weight||0));
  var dReps = (last.reps||0) - (first.reps||0);
  var summary = bodyweightOnly ? (first.reps+' повт. → '+last.reps+' повт.') : (first.weight+' кг × '+first.reps+' → '+last.weight+' кг × '+last.reps);
  var deltas = [];
  if(dWt) deltas.push((dWt>0?'+':'')+dWt+' кг');
  if(dReps) deltas.push((dReps>0?'+':'')+dReps+' повт.');
  if(dVol) deltas.push('объём '+(dVol>0?'+':'')+dVol);
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:130px;">'+segments+circles+labels+'</svg>'+
    '<div style="font-size:12px;color:var(--muted);text-align:center;line-height:1.4;">'+summary+
    (deltas.length ? '<br><span style="color:var(--green);font-weight:600;">'+deltas.join(' · ')+'</span>' : '')+
    '</div>';
}

var MEAL_ORDER = ['breakfast','lunch','dinner','snack'];
var MEAL_LABELS = { breakfast:'Завтрак', lunch:'Обед', dinner:'Ужин', snack:'Перекус' };

function defaultMealByTime(){
  var h = new Date().getHours();
  if(h < 11) return 'breakfast';
  if(h < 16) return 'lunch';
  if(h < 21) return 'dinner';
  return 'snack';
}

function isValidISODate(value){
  if(typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  var p=value.split('-').map(Number);
  var d=new Date(p[0],p[1]-1,p[2]);
  return d.getFullYear()===p[0] && d.getMonth()===p[1]-1 && d.getDate()===p[2];
}

function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function shiftDate(str, days){

function inferFoodGroup(name){
  var n = (name || '').toLowerCase();
  if(/огурец|помидор|томат|перец|капуст|брокколи|морков|салат|лук|кабачок|баклажан|шпинат|зелень|овощ|свекл|редьк|редис|спарж|фасоль струч|горошек зел|тыкв/.test(n)) return 'veg';
  if(/яблок|банан|апельсин|мандар|киви|ягод|клубник|черник|малин|груш|персик|фрукт|виноград|арбуз|дыня|слив|абрикос|вишня|черешня|гранат|манго/.test(n)) return 'fruit';
  if(/гречк|рис|овсян|перлов|пш[её]н|киноа|хлеб|макарон|паста|картоф|хлопья|булгур|кускус/.test(n)) return 'grain';
  if(/творог|йогурт|молоко|сыр |кефир|ряженк|сметан|протеин|казеин/.test(n)) return 'dairy';
  if(/куриц|индейк|говяд|свинин|рыб|лосос|тунц|яйц|фарш|шницел|ветчин|грудк|мясо|кревет|треск|скумбр|сельдь/.test(n)) return 'protein';
  return 'other';
}
function inferFiberPer100(name, group, carbs){
  var n = (name || '').toLowerCase();
  if(group === 'veg') return 2.5;
  if(group === 'fruit') return 2.2;
  if(/овсян|гречк|перлов|хлеб|чечевиц|фасоль|горох|киноа/.test(n)) return 3.5;
  if(group === 'grain') return 1.5;
  if(carbs > 10) return Math.min(3, carbs * 0.08);
  return 0;
}
function ensureProductMeta(p){
  if(!p) return p;
  if(!p.foodGroup) p.foodGroup = inferFoodGroup(p.name);
  if(p.fiber == null || isNaN(p.fiber)) p.fiber = inferFiberPer100(p.name, p.foodGroup, p.carbs||0);

}

function foodDataWarnings(item){

  if(kcal<0||p<0||f<0||c<0) warnings.push('Макросы не могут быть отрицательными');
  var fiber = Math.max(0,+item.fiber||0);

  if(kcal>0 && calc>0 && Math.abs(kcal-calc)>Math.max(60,kcal*0.20)) warnings.push('Проверь калорийность: есть заметное расхождение с БЖУ и клетчаткой');
  if(kcal>950) warnings.push('Проверь калорийность на 100 г: значение очень высокое');
  if(p>100||f>100||c>100||p+f+c>110) warnings.push('Проверь БЖУ на 100 г');
  return warnings;
}

function computeTotals(entries){
  var t = {kcal:0, protein:0, fat:0, carbs:0, fiber:0, sugar:0, salt:0, satFat:0, carbsSimple:0, carbsComplex:0, micronutrients:{}, nutrientKnown:{}, veg:0, fruit:0};

    var m = entryMacros(e);
    t.kcal += m.kcal; t.protein += m.protein; t.fat += m.fat; t.carbs += m.carbs;
    t.fiber += m.fiber||0; ['sugar','salt','satFat','carbsSimple','carbsComplex'].forEach(function(k){if(m[k]!=null){t[k]=(t[k]||0)+(+m[k]||0);t.nutrientKnown[k]=(t.nutrientKnown[k]||0)+1;}}); Object.keys(m.micronutrients||{}).forEach(function(k){t.micronutrients[k]=(t.micronutrients[k]||0)+(+m.micronutrients[k]||0);t.nutrientKnown[k]=(t.nutrientKnown[k]||0)+1;}); t.veg += m.vegGrams||0; t.fruit += m.fruitGrams||0;
  });

/** Разнообразие за n дней до date включительно */
function dietDiversity(days){
  days = days || 7;
  var groups = { veg:0, fruit:0, grain:0, protein:0, dairy:0, other:0 };
  var names = {};
  var daysWithFood = 0, fiberSum = 0, vegSum = 0, fruitSum = 0;
  for(var i=0;i<days;i++){
    var d = shiftDate(todayStr(), -i);
    var entries = getDiary(d);
    if(!entries.length) continue;
    daysWithFood++;
    var t = computeTotals(entries);
    fiberSum += t.fiber; vegSum += t.veg; fruitSum += t.fruit;
    entries.forEach(function(e){
      var m = entryMacros(e);
      names[m.name] = true;
      if(groups[m.foodGroup] != null) groups[m.foodGroup]++;
      else groups.other++;
    });
  }
  var unique = Object.keys(names).length;
  var groupCount = 0;
  ['veg','fruit','grain','protein','dairy'].forEach(function(k){ if(groups[k] > 0) groupCount++; });
  // score 0–100
  var score = Math.min(40, unique * 2) + groupCount * 10;
  if(vegSum / Math.max(1,daysWithFood) >= 200) score += 5;
  if(fruitSum / Math.max(1,daysWithFood) >= 100) score += 5;
  if(fiberSum / Math.max(1,daysWithFood) >= 20) score += 5;
  score = Math.min(100, Math.round(score));
  return {
    unique: unique,
    groups: groups,
    groupCount: groupCount,
    daysWithFood: daysWithFood,
    avgFiber: daysWithFood ? fiberSum / daysWithFood : 0,
    avgVeg: daysWithFood ? vegSum / daysWithFood : 0,
    avgFruit: daysWithFood ? fruitSum / daysWithFood : 0,
    score: score,
    productNames: Object.keys(names)
  };
}

  if(i >= 0) favorites.splice(i, 1);
  else favorites.push(productId);
  sSet('favorites', favorites);
}

function productUsageCounts(){
  var counts = {};
  function addFrom(entries){
    (entries||[]).forEach(function(e){
      if(e.productId){
        counts[e.productId] = (counts[e.productId]||0) + 1;
      }
    });
  }
  Object.keys(diaryCache).forEach(function(d){ addFrom(diaryCache[d]); });
  try{
    if(_storageOk){
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('diary:')===0){
          try{ addFrom(JSON.parse(localStorage.getItem(k)||'[]')); }catch(e){}
        }
      }
    }
  }catch(e){}
  return counts;
}

function autoFavoriteIds(){
  var counts = productUsageCounts();
  return Object.keys(counts)
    .filter(function(id){ return counts[id] >= 2; })
    .sort(function(a,b){ return counts[b] - counts[a]; })
    .slice(0, 15);
}

function isFavorite(productId){
  if(favorites.indexOf(productId) >= 0) return true;
  return autoFavoriteIds().indexOf(productId) >= 0;
}

function favoriteRank(productId){
  // lower = higher in list. Manual pin first, then by frequency
  if(favorites.indexOf(productId) >= 0) return 0;
  var counts = productUsageCounts();
  var c = counts[productId] || 0;
  if(c >= 2) return 1000 - c; // frequent next
  return 10000;
}

function productHasPortion(p){
  return p && p.portionName && p.portionGrams > 0;
}

function formatPortionLine(p, grams){
  if(!productHasPortion(p) || !grams) return null;
  var n = grams / p.portionGrams;
  // show if close to whole or half portions
  var rounded = Math.round(n * 2) / 2;
  if(Math.abs(n - rounded) < 0.08){
    var label = p.portionName;
    if(rounded === 1) return '1 '+label;
    return (rounded % 1 === 0 ? String(rounded) : String(rounded).replace('.',',')) + ' '+label;
  }
  return null;
}

function entriesThatCrossedGoal(entries, onlyMacro){
  var crossed = {};
  var crossedMacros = {};
  var run = { protein:0, fat:0, carbs:0, kcal:0 };
  var g = baseGoals(currentDate); // red only vs base plan
  var goalsMap = { protein: g.protein, fat: g.fat, carbs: g.carbs, kcal: g.kcal };
  // Don't "scare" with protein — only fat, carbs, kcal trigger red highlight
  var defaultKeys = ['fat','carbs','kcal'];
  var keys = onlyMacro ? [onlyMacro] : defaultKeys;
  if(onlyMacro === 'protein') keys = ['protein']; // still allow breakdown view
  entries.forEach(function(e){
    var m = entryMacros(e);
    keys.forEach(function(key){
      var before = run[key];
      var after = before + (m[key]||0);
      if(before <= goalsMap[key] && after > goalsMap[key]){
        if(key !== 'protein' || onlyMacro === 'protein'){
          crossed[e.id] = true;
          if(!crossedMacros[e.id]) crossedMacros[e.id] = [];
          crossedMacros[e.id].push(key);
        }
      }
      run[key] = after;
    });
    ['protein','fat','carbs','kcal'].forEach(function(key){
      if(keys.indexOf(key)===-1) run[key] += (m[key]||0);
    });
  });
  return { crossed: crossed, crossedMacros: crossedMacros };
}

function openWorkoutForm(existing){

        <details style="margin:4px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;">

          <div class="field" style="margin-top:10px;"><label>RIR по каждому подходу</label><input id="woRirSets" type="text" inputmode="numeric" placeholder="Например: 2/2/1" value="${existing && existing.rirBySet ? existing.rirBySet.join('/') : (existing && existing.rir != null && factS ? parseSetArray(factS).map(function(){return existing.rir;}).join('/') : '')}"></div>

          <div class="field"><label>Вторичные мышцы (название:доля)</label><input id="woSecondaryMuscles" type="text" placeholder="Например: Предплечья:0.5, Бицепс:0.25" value="${escapeHTML((selectedEx&&selectedEx.secondaryMuscles||[]).map(function(x){return x.name+':'+x.factor;}).join(', '))}"></div>

      return '<div class="search-item '+(selectedEx && selectedEx.id===e.id?'selected':'')+'" data-ex="'+e.id+'"><span>'+e.name+'</span></div>';

    var rirRaw = (rirSetsEl && rirSetsEl.value || '').trim();

    if(rirArr.some(function(v){return !Number.isInteger(v)||v<0||v>4;}) || (rirArr.length && rirArr.length!==parseSetArray(sets).length)){showToast('RIR: укажи 0–4 для каждого подхода');return;}

    exLib.secondaryMuscles=secondary;
    sSet('exercises',exercises);
    var noteEl=document.getElementById('woNote');var note=(noteEl?noteEl.value:'').trim();
    var list = getWorkouts(currentDate);
    if(existing){
      existing.name = name;

      existing.weight = isNaN(weight) ? (isBodyweightName(name) ? bodyKgNow() : null) : weight;
      existing.sets = sets;

      });

function workoutSetQuality(w){
  var reps=parseSetArray(w&&w.sets||'');if(reps.length<2)return null;
  var drops=[];for(var i=1;i<reps.length;i++){var drop=(reps[i-1]-reps[i])/Math.max(1,reps[i-1])*100;if(drop>=30)drops.push({from:reps[i-1],to:reps[i],pct:Math.round(drop),set:i+1});}
  var rir=Array.isArray(w.rirBySet)?w.rirBySet:(w.rir!=null?reps.map(function(){return +w.rir;}):[]);
  var failures=rir.filter(function(x){return x!=null&&+x===0;}).length;
  return {drops:drops,failures:failures,warning:drops.length>0||failures>0};
}

{id:'pushup',name:'Отжимания от пола',gear:'Собственный вес',muscle:'Грудь',level:'Начальный',group:'Грудь',kind:'pushup',rom:'Опускай грудь почти до пола, сохраняя единое положение корпуса; вверху выпрямляй руки без болезненного переразгибания.',steps:['Поставь ладони немного шире плеч, пальцы направь вперёд или слегка наружу. Выпрями ноги и напряги живот и ягодицы.','Сгибай локти примерно под углом 30–60° к корпусу и опускайся контролируемо.','Оттолкнись ладонями от пола и вернись в верхнее положение.'],cues:['Не провисай в пояснице и не поднимай таз домиком.','Не разводи локти строго в стороны.','Если тяжело — отжимайся с колен или от устойчивой высокой опоры.'],image:'https://diary-workout.ru/stc/exr/64/img1280x800.jpg',source:'https://diary-workout.ru/exercises/64/'},
{id:'diamond-pushup',name:'Алмазные отжимания',gear:'Собственный вес',muscle:'Трицепс',level:'Средний',group:'Трицепс',kind:'pushup',rom:'Опускайся до комфортной глубины, сохраняя кисти и локти в удобном положении.',steps:['Прими упор лёжа, поставь кисти ближе друг к другу под нижней частью груди. Не обязательно соединять пальцы в идеальный ромб.','Сгибай локти назад вдоль корпуса, опуская грудь к кистям.','Выжми себя вверх, сохраняя корпус прямым.'],cues:['Не допускай боли в запястьях. При дискомфорте поставь руки шире.','Не разводи локти в стороны.','Усложняй только после освоения обычных отжиманий.'],image:'',source:'https://diary-workout.ru/exercises/64/'},
{id:'pullup',name:'Подтягивания прямым хватом',gear:'Турник',muscle:'Широчайшие мышцы спины',level:'Средний',group:'Спина',kind:'pullup',rom:'Внизу контролируемо выпрямляй локти; вверху поднимайся до уровня, который можешь достичь без рывка и боли.',steps:['Возьмись за перекладину прямым хватом немного шире плеч. Напряги пресс и ягодицы.','Начни движение лопатками и веди локти вниз, поднимая корпус к перекладине.','Опускайся медленно и подконтрольно до почти полного разгибания рук.'],cues:['Не раскачивайся и не подбрасывай колени.','Не вытягивай подбородок отдельно от корпуса.','Если пока не получается — используй помощь ногами или небольшое число негативных повторений.'],image:'https://diary-workout.ru/stc/exr/62/img1280x800.jpg',source:'https://diary-workout.ru/exercises/62/'},
{id:'chinup',name:'Подтягивания обратным хватом',gear:'Турник',muscle:'Спина и бицепс',level:'Средний',group:'Спина',kind:'pullup',rom:'Контролируемо выпрямляй локти внизу; поднимайся без рывка до комфортной верхней точки.',steps:['Возьмись за перекладину обратным хватом: ладони к себе, кисти примерно на ширине плеч.','Веди локти вниз и поднимай грудь к перекладине, не раскачивая тело.','Плавно опустись в исходное положение.'],cues:['Не сокращай амплитуду ради дополнительных повторений.','Не переразгибай поясницу.','При дискомфорте в локтях уменьши объём или используй прямой хват.'],image:'',source:'https://diary-workout.ru/exercises/62/'},
{id:'negative-pullup',name:'Негативные подтягивания',gear:'Турник',muscle:'Спина и бицепс',level:'Начальный',group:'Спина',kind:'pullup',rom:'Главная задача — медленно опуститься из верхней точки за 3–6 секунд без падения в нижнюю позицию.',steps:['Поднимись в верхнюю точку с помощью устойчивой опоры или небольшого прыжка.','Зафиксируй положение над перекладиной и начинай медленно разгибать локти.','Опустись до контролируемого виса, затем поставь ноги на опору.'],cues:['Не запрыгивай на скользкую или неустойчивую опору.','Останавливай подход, если опускание становится неконтролируемым.','Не делай много негативов ежедневно: они могут сильно нагружать мышцы и сухожилия.'],image:'',source:'https://diary-workout.ru/exercises/62/'},
{id:'knee-raise-hang',name:'Подъём коленей в висе на турнике',gear:'Турник',muscle:'Пресс',level:'Начальный',group:'Пресс',kind:'generic',rom:'Поднимай колени настолько высоко, насколько можешь без раскачки; опускай до исходного виса под контролем.',steps:['Повисни на турнике, стабилизируй плечи и корпус.','Подкрути таз и подними согнутые колени к животу.','Медленно опусти ноги, не раскачивая тело.'],cues:['Не раскачивайся для создания инерции.','Не превращай движение только в сгибание тазобедренных суставов — подкручивай таз.','Сократи амплитуду, если появляется боль в пояснице.'],image:'https://diary-workout.ru/stc/exr/58/img1280x800.jpg',source:'https://diary-workout.ru/exercises/58/'},
{id:'barbell-curl',name:'Сгибание рук со штангой',gear:'Штанга',muscle:'Бицепс',level:'Начальный',group:'Бицепс',kind:'curl',rom:'Внизу почти полностью выпрямляй локти без переразгибания; вверху сгибай до максимума без выноса локтей вперёд.',steps:['Встань устойчиво, возьми штангу хватом снизу. Локти расположи около корпуса.','Согни руки и подними гриф, не помогая корпусом.','Плавно опусти штангу до почти полного разгибания локтей.'],cues:['Не раскачивай туловище.','Не уводи локти далеко вперёд.','Кисти держи продолжением предплечий.'],image:'https://diary-workout.ru/stc/exr/22/img1280x800.jpg',source:'https://diary-workout.ru/exercises/22/'},
{id:'db-curl',name:'Сгибание рук с гантелями сидя',gear:'Гантели',muscle:'Бицепс',level:'Начальный',group:'Бицепс',kind:'curl',rom:'Опускай гантель почти до полного разгибания локтя; поднимай до сокращения бицепса, не выдвигая плечо вперёд.',steps:['Сядь устойчиво, держи гантели по бокам туловища, ладони направлены друг к другу.','Согни одну руку, плавно разворачивая ладонь вверх по мере подъёма.','Опусти гантель под контролем и повтори другой рукой.'],cues:['Не раскачивай корпус.','Не бросай гантель вниз.','Не выводи локоть далеко вперёд.'],image:'https://diary-workout.ru/stc/exr/23/img1280x800.jpg',source:'https://diary-workout.ru/exercises/23/'},
{id:'hammer-curl',name:'Молотковые сгибания гантелей',gear:'Гантели',muscle:'Брахиалис и бицепс',level:'Начальный',group:'Бицепс',kind:'hammer',rom:'Внизу почти полностью выпрями локоть; вверху согни его без разворота кисти и движения плеча.',steps:['Держи гантели вдоль тела нейтральным хватом: ладони обращены друг к другу.','Согни локти и подними гантели, сохраняя нейтральное положение кистей.','Медленно опусти гантели в исходное положение.'],cues:['Держи локти около корпуса.','Не раскачивай туловище.','Не поднимай плечи к ушам.'],image:'https://diary-workout.ru/stc/exr/32/img1280x800.jpg',source:'https://diary-workout.ru/exercises/32/'},
{id:'concentration-curl',name:'Концентрированное сгибание гантели',gear:'Гантели',muscle:'Бицепс',level:'Начальный',group:'Бицепс',kind:'curl',rom:'Разгибай локоть почти полностью и сгибай до максимума без отрыва плеча от внутренней стороны бедра.',steps:['Сядь, слегка наклони корпус и упрись локтем рабочей руки во внутреннюю сторону бедра.','Согни локоть, поднимая гантель к плечу.','Опусти гантель медленно, сохраняя неподвижное плечо.'],cues:['Не раскачивай корпус.','Не дави локтем чрезмерно в бедро.','Используй вес, который позволяет контролировать нижнюю фазу.'],image:'https://diary-workout.ru/stc/exr/26/img1280x800.jpg',source:'https://diary-workout.ru/exercises/26/'},
{id:'overhead-triceps-db',name:'Разгибание гантели из-за головы одной рукой',gear:'Гантели',muscle:'Трицепс',level:'Начальный',group:'Трицепс',kind:'overhead_triceps',rom:'Согни локоть, опуская гантель за голову; затем разогни руку вверх, сохраняя плечо неподвижным.',steps:['Сядь устойчиво. Возьми гантель одной рукой и подними её над головой.','Удерживая плечо вертикально, согни локоть и опусти гантель за голову.','Разогни локоть и верни гантель в верхнее положение.'],cues:['Не прогибай поясницу.','Не разводи локти насильно и не своди их через дискомфорт.','Не превращай движение в жим плечами.'],image:'https://diary-workout.ru/stc/exr/49/img1280x800.jpg',source:'https://diary-workout.ru/exercises/49/'},
{id:'floorpress-db',name:'Жим гантелей лёжа на полу',gear:'Гантели',muscle:'Грудь',level:'Начальный',group:'Грудь',kind:'floorpress',rom:'Опускай плечи до мягкого касания пола; не проваливай локти ниже уровня корпуса.',steps:['Ляг на пол, согни ноги, удерживай гантели над грудью нейтральным или прямым хватом.','Опускай локти к полу под контролем.','Выжми гантели вверх, не сталкивая их резко друг с другом.'],cues:['Не отбивай локти от пола.','Сохраняй устойчивые запястья.','Выбирай вес, который можешь безопасно поднять и опустить самостоятельно.'],image:'',source:'https://diary-workout.ru/exercises/'},
{id:'close-floorpress',name:'Узкий жим штанги лёжа на полу',gear:'Штанга',muscle:'Трицепс',level:'Средний',group:'Трицепс',kind:'closepress',rom:'Опускай гриф до мягкого касания плечами/трицепсами пола; запястья остаются над локтями.',steps:['Ляг на пол и возьми штангу хватом немного уже обычного жима, но без дискомфорта в кистях.','Опускай гриф к нижней части груди, локти держи ближе к корпусу.','Выжми гриф вверх, не отбивая руки от пола.'],cues:['Не используй чрезмерно узкий хват.','Не заламывай запястья.','Не ударяй локтями о пол.'],image:'',source:'https://diary-workout.ru/exercises/'},
{id:'barbell-reverse-curl',name:'Обратное сгибание рук со штангой',gear:'Штанга',muscle:'Предплечья и брахиалис',level:'Средний',group:'Бицепс',kind:'curl',rom:'Опускай штангу почти до полного разгибания локтей; поднимай без раскачивания корпуса.',steps:['Встань прямо, возьми штангу хватом сверху примерно на ширине плеч.','Согни локти и подними гриф к нижней части груди, удерживая локти около корпуса.','Медленно опусти штангу в исходное положение.'],cues:['Не раскачивай туловище.','Держи кисти прямыми.','Не используй инерцию и чрезмерный вес.'],image:'https://diary-workout.ru/stc/exr/31/img1280x800.jpg',source:'https://diary-workout.ru/exercises/31/'},
{id:'barbell-ohp',name:'Жим штанги стоя',gear:'Штанга',muscle:'Плечи',level:'Средний',group:'Плечи',kind:'press',rom:'Начинай у верхней части груди и выжимай над головой до комфортного разгибания рук, не компенсируя движением поясницы.',steps:['Поставь ноги примерно на ширине таза, удерживай гриф у верхней части груди. Напряги ягодицы и живот.','Проведи гриф близко к лицу, слегка отведя голову назад, затем выжми над головой.','Верни гриф к верхней части груди по той же траектории.'],cues:['Не прогибай поясницу и не выталкивай рёбра вперёд.','Не запрокидывай голову.','Не начинай с тяжёлого веса без уверенной техники.'],image:'https://diary-workout.ru/stc/exr/42/img1280x800.jpg',source:'https://diary-workout.ru/exercises/42/'},
{id:'db-ohp',name:'Жим гантелей над головой',gear:'Гантели',muscle:'Плечи',level:'Начальный',group:'Плечи',kind:'press',rom:'Опускай гантели до комфортного уровня плеч; выжимай вверх без боли и чрезмерного прогиба поясницы.',steps:['Встань устойчиво, удерживай гантели около плеч. Ладони направлены вперёд или друг к другу.','Выжми гантели вверх по контролируемой траектории.','Опусти их обратно к плечам.'],cues:['Напряги живот и ягодицы.','Не сталкивай гантели в верхней точке.','Не позволяй локтям резко проваливаться вниз.'],image:'',source:'https://diary-workout.ru/exercises/'},
{id:'lateral-raise',name:'Подъём гантелей в стороны',gear:'Гантели',muscle:'Средняя дельта',level:'Начальный',group:'Плечи',kind:'raise',rom:'Поднимай руки примерно до уровня плеч или немного ниже; опускай контролируемо до положения у бёдер.',steps:['Встань ровно, гантели у бёдер, локти слегка согнуты.','Поднимай руки в стороны, ведя движение локтями.','Медленно опусти гантели, не бросая их вниз.'],cues:['Не раскачивай корпус.','Не поднимай плечи к ушам.','Не гонись за весом: движение должно оставаться чистым.'],image:'https://diary-workout.ru/stc/exr/1/img1280x800.jpg',source:'https://diary-workout.ru/exercises/1/'},
{id:'rear-delt-raise',name:'Разведение гантелей в наклоне',gear:'Гантели',muscle:'Задняя дельта',level:'Начальный',group:'Плечи',kind:'raise',rom:'Разводи руки до линии корпуса или немного выше без рывка; возвращай гантели под контролем.',steps:['Наклони корпус вперёд, сохраняя спину нейтральной, гантели свисают под плечами.','Разведи руки в стороны, слегка согнув локти.','Медленно верни гантели вниз.'],cues:['Не превращай движение в тягу локтями к поясу.','Не округляй поясницу.','Используй небольшой вес.'],image:'https://diary-workout.ru/stc/exr/8/img1280x800.jpg',source:'https://diary-workout.ru/exercises/8/'},
{id:'db-row-bilateral',name:'Тяга двух гантелей в наклоне',gear:'Гантели',muscle:'Спина',level:'Средний',group:'Спина',kind:'generic',rom:'В нижней точке дай лопаткам контролируемо разойтись; тяни гантели к нижним рёбрам без рывка.',steps:['Наклони корпус, слегка согни колени, удерживай спину нейтральной.','Потяни обе гантели к нижним рёбрам, ведя локти назад.','Медленно опусти гантели, не меняя положения корпуса.'],cues:['Не округляй поясницу.','Не поднимай корпус при каждом повторении.','Если удерживать наклон тяжело, уменьши вес.'],image:'',source:'https://diary-workout.ru/exercises/'},
{id:'barbell-squat',name:'Приседания со штангой',gear:'Штанга',muscle:'Ноги и ягодицы',level:'Средний',group:'Ноги',kind:'generic',rom:'Приседай настолько глубоко, насколько сохраняешь устойчивость стоп и нейтральное положение корпуса без боли.',steps:['Установи гриф на верх спины, возьми его симметрично и поставь стопы примерно на ширине плеч.','Отведи таз назад и согни колени, направляя их по линии носков.','Оттолкнись всей стопой и вернись в исходное положение.'],cues:['Не своди колени внутрь.','Не отрывай пятки от пола.','Не используй стойки и вес, которые не можешь безопасно контролировать.'],image:'',source:'https://diary-workout.ru/exercises/'},
{id:'db-goblet-squat',name:'Приседание с гантелью у груди',gear:'Гантели',muscle:'Ноги и ягодицы',level:'Начальный',group:'Ноги',kind:'generic',rom:'Сохраняй глубину, при которой стопы устойчивы, колени следуют за носками, а корпус не теряет контроль.',steps:['Держи одну гантель вертикально у груди, стопы немного шире таза.','Согни колени и таз, опускаясь между бёдер.','Встань, отталкиваясь всей стопой.'],cues:['Не округляй поясницу внизу.','Не заваливай колени внутрь.','Держи гантель близко к корпусу.'],image:'',source:'https://diary-workout.ru/exercises/'},
{id:'split-squat',name:'Выпады со штангой',gear:'Штанга',muscle:'Квадрицепсы и ягодицы',level:'Средний',group:'Ноги',kind:'generic',rom:'Опускайся до комфортной глубины, сохраняя переднюю стопу устойчивой; отталкивайся передней ногой.',steps:['Установи штангу на верх спины и встань устойчиво.','Сделай шаг вперёд и опустись, сгибая оба колена.','Оттолкнись передней ногой и вернись; повтори другой ногой.'],cues:['Не заваливай колено внутрь.','Сохраняй корпус устойчивым.','Начинай с лёгкого веса и контролируй равновесие.'],image:'https://diary-workout.ru/stc/exr/55/img1280x800.jpg',source:'https://diary-workout.ru/exercises/55/'},
{id:'rdl-barbell',name:'Румынская тяга со штангой',gear:'Штанга',muscle:'Бицепс бедра и ягодицы',level:'Средний',group:'Ноги',kind:'generic',rom:'Отводи таз назад до выраженного натяжения задней поверхности бедра, пока спина остаётся нейтральной.',steps:['Держи штангу перед бёдрами, колени слегка согнуты.','Отводи таз назад, скользя грифом вдоль ног.','Напряги ягодицы и верни таз вперёд, выпрямляясь.'],cues:['Это движение тазом, а не присед.','Не округляй спину ради большей глубины.','Не переразгибай поясницу в верхней точке.'],image:'',source:'https://diary-workout.ru/exercises/'},
{id:'glute-bridge',name:'Ягодичный мост без веса',gear:'Собственный вес',muscle:'Ягодицы',level:'Начальный',group:'Ноги',kind:'generic',rom:'Поднимай таз до линии плечи-таз-колени без переразгибания поясницы.',steps:['Ляг на спину, согни колени, стопы поставь на пол на ширине таза.','Напряги ягодицы и подними таз вверх.','Плавно опусти таз, не расслабляя корпус полностью.'],cues:['Не выталкивай рёбра вверх.','Толкайся всей стопой.','Не переноси нагрузку в поясницу.'],image:'',source:'https://diary-workout.ru/exercises/'},
