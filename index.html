        </div>
      </div>`;
    }).join('') : '<div class="empty">Пока нет записей</div>'}</div>
    <div class="section-title">Замеры (см)</div>
    <div class="card" style="margin-bottom:8px;">
      <button class="btn primary" id="addMeasureBtn" style="width:100%;">+ Записать замеры</button>
      <button class="btn ghost" id="measureTipsBtn" style="width:100%;margin-top:8px;">Как правильно мерить</button>
    </div>
    <div class="card">${(function(){
      var mSorted = measureLog.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
      if(!mSorted.length) return '<div class="empty">Пока нет замеров</div>';
      return mSorted.map(function(m){

        if(m.waist!=null) parts.push('Талия '+m.waist);
        if(m.chest!=null) parts.push('Грудь '+m.chest);
        if(m.bicepL!=null) parts.push('Биц.Л '+m.bicepL);
        if(m.bicepR!=null) parts.push('Биц.П '+m.bicepR);
        return `<div class="entry">
          <div class="name">${fmtDateHuman(m.date)}
            <div style="font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35;">${parts.join(' · ')||'—'}</div>
          </div>

  if(append){

  var wToggle = document.getElementById('weightLogToggle');

  content.querySelectorAll('[data-mdel]').forEach(function(b){

  content.querySelectorAll('[data-goto-date]').forEach(function(row){

  var tipsM = document.getElementById('measureTipsBtn');
  if(tipsM) tipsM.onclick = openMeasureTips;

  var weekOlder = document.getElementById('weekPairOlder');
  var weekNewer = document.getElementById('weekPairNewer');
  if(weekOlder) weekOlder.onclick = function(){ weekPairOffset = Math.min(12, weekPairOffset + 1); render(); };
  if(weekNewer) weekNewer.onclick = function(){ weekPairOffset = Math.max(0, weekPairOffset - 1); render(); };
  var weekCard = document.getElementById('weekPairCard');
  if(weekCard){
    var touchX = null;
    weekCard.addEventListener('touchstart', function(e){
      if(e.changedTouches && e.changedTouches[0]) touchX = e.changedTouches[0].clientX;
    }, {passive:true});
    weekCard.addEventListener('touchend', function(e){
      if(touchX == null || !e.changedTouches || !e.changedTouches[0]) return;
      var dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if(Math.abs(dx) < 40) return;
      // свайп вправо → более старые недели; влево → к текущей
      if(dx > 0) weekPairOffset = Math.min(12, weekPairOffset + 1);
      else weekPairOffset = Math.max(0, weekPairOffset - 1);
      render();
    }, {passive:true});
  }

  var periodCalcBtn = document.getElementById('periodCalcBtn');
  if(periodCalcBtn) periodCalcBtn.onclick = function(){
    periodFrom = document.getElementById('periodFrom').value;
    periodTo = document.getElementById('periodTo').value;
    render(); // график и итоги пересчитываются под период
  };
  var periodAllBtn = document.getElementById('periodAllBtn');
  if(periodAllBtn) periodAllBtn.onclick = function(){

    var f = (s[0] && s[0].date) || (allD[0] || todayStr());
    var t = (s.length && s[s.length-1].date) || (allD.length ? allD[allD.length-1] : todayStr());
    // expand to earliest/latest of diary OR weight
    if(allD.length){
      if(allD[0] < f) f = allD[0];
      if(allD[allD.length-1] > t) t = allD[allD.length-1];
    }
    document.getElementById('periodFrom').value = f;

  if(periodResultEl) renderPeriodResult(periodResultEl, defaultFrom, defaultTo);
  if(fab){
    fab.innerHTML = `<button id="addWeightBtn">+ Записать вес</button>`;
    var aw = document.getElementById('addWeightBtn');
    if(aw) aw.onclick = openAddWeight;
  }

var periodFrom = null;
var periodTo = null;

function collectDiaryDates(){
  var dates = {};
  Object.keys(diaryCache).forEach(function(d){ dates[d]=1; });
  try{
    if(_storageOk){
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('diary:')===0) dates[k.slice(6)] = 1;
      }
    }
  }catch(e){}
  return Object.keys(dates).sort();
}

function weightOnOrBefore(date, sorted){
  var best = null;
  for(var i=0;i<sorted.length;i++){
    if(sorted[i].date <= date) best = sorted[i];
    else break;
  }
  return best;
}
function weightOnOrAfter(date, sorted){
  for(var i=0;i<sorted.length;i++){
    if(sorted[i].date >= date) return sorted[i];
  }
  return null;
}

function renderPeriodResult(el, from, to){
  if(!el) return;
  if(!from || !to){
    el.innerHTML = '<div class="empty" style="padding:8px;">Укажи даты</div>';
    return;
  }
  if(from > to){
    el.innerHTML = '<div class="empty" style="padding:8px;">«С» должно быть раньше «По»</div>';
    return;
  }

  // Еда: [from, to) — конечная дата не учитывается
  // Вес: [from, to] — обе границы
  var totalKcal = 0, totalBike = 0, daysWithFood = 0, dayCount = 0;
  var d = from;
  while(d < to){
    dayCount++;
    var entries = getDiary(d);
    var t = computeTotals(entries);
    var burn = dayBikeBurn(d);
    if(t.kcal > 0 || entries.length || burn > 0){
      totalKcal += t.kcal;
      totalBike += burn;
      if(t.kcal > 0 || entries.length) daysWithFood++;
    }
    d = shiftDate(d, 1);
    if(dayCount > 4000) break;
  }
  var totalNet = totalKcal - totalBike;
  var avgIntake = daysWithFood ? totalNet / daysWithFood : 0;

  var sorted = [...weightLog].sort(function(a,b){ return a.date.localeCompare(b.date); });
  var wStart = weightOnOrBefore(from, sorted) || weightOnOrAfter(from, sorted);
  var wEnd = weightOnOrBefore(to, sorted) || weightOnOrAfter(to, sorted);
  // prefer start at/near from and end at/near to
  if(sorted.length){
    var nearStart = null, nearEnd = null;
    sorted.forEach(function(w){
      if(w.date >= from && w.date <= to){
        if(!nearStart || w.date < nearStart.date) nearStart = w;
        if(!nearEnd || w.date > nearEnd.date) nearEnd = w;
      }
    });
    if(nearStart) wStart = nearStart;
    if(nearEnd) wEnd = nearEnd;
  }

  var html = '';
  html += '<div class="entry"><div class="name">Дней с едой (без даты «По»)</div><div class="kcal">'+dayCount+'</div></div>';
  html += '<div class="entry"><div class="name">Из них с записями</div><div class="kcal">'+daysWithFood+'</div></div>';
  html += '<div class="entry"><div class="name">Сумма калорий (еда)</div><div class="kcal">'+round(totalKcal)+'</div></div>';
  if(totalBike > 0){
    html += '<div class="entry"><div class="name">Вело (сожжено)</div><div class="kcal" style="color:var(--green);">−'+round(totalBike)+'</div></div>';
    html += '<div class="entry"><div class="name">Нетто калорий</div><div class="kcal">'+round(totalNet)+'</div></div>';
  }
  html += '<div class="entry"><div class="name">Средние нетто ккал/день</div><div class="kcal">'+round(avgIntake)+'</div></div>';

  var maint = goals.maintenanceKcal;
  if(maint){
    var expectedMaintTotal = maint * (daysWithFood || dayCount);
    var vsMaint = totalKcal - expectedMaintTotal;
    var vsMaintDay = (daysWithFood || dayCount) ? vsMaint / (daysWithFood || dayCount) : 0;
    var vsColor = vsMaint > 50 ? 'var(--red)' : (vsMaint < -50 ? 'var(--green)' : 'var(--muted)');
    var vsSign = vsMaint > 0 ? '+' : '';
    html += '<div class="entry"><div class="name">Vs поддержание ('+maint+'/день)</div><div class="kcal" style="color:'+vsColor+';font-weight:700;">'+vsSign+round(vsMaint)+'<div style="font-size:11px;font-weight:400;">'+vsSign+round(vsMaintDay)+' ккал/день</div></div></div>';
  } else {
    html += '<div style="font-size:12px;color:var(--muted);margin:8px 0;">Укажи калории поддержания в цели по весу — будет сравнение с ними.</div>';
  }

  if(wStart && wEnd && wStart.date !== wEnd.date){
    var deltaKg = wEnd.kg - wStart.kg;
    var daysW = Math.max(1, daysBetween(wStart.date, wEnd.date));
    var kcalBalance = deltaKg * 7700; // >0 weight gain ≈ surplus stored
    var dailyFromWeight = kcalBalance / daysW;
    var dColor = deltaKg > 0.05 ? 'var(--red)' : (deltaKg < -0.05 ? 'var(--green)' : 'var(--muted)');
    var dSign = deltaKg > 0 ? '+' : '';
    html += '<div class="entry"><div class="name">Вес '+fmtDateHuman(wStart.date)+'</div><div class="kcal">'+wStart.kg+' кг</div></div>';
    html += '<div class="entry"><div class="name">Вес '+fmtDateHuman(wEnd.date)+'</div><div class="kcal">'+wEnd.kg+' кг</div></div>';
    html += '<div class="entry"><div class="name">Изменение веса</div><div class="kcal" style="color:'+dColor+';font-weight:700;">'+dSign+round(deltaKg)+' кг</div></div>';
    html += '<div class="entry"><div class="name">По весу (≈7700 ккал/кг)</div><div class="kcal" style="color:'+dColor+';">'+((kcalBalance>0)?'+':'')+round(kcalBalance)+'<div style="font-size:11px;font-weight:400;">'+((dailyFromWeight>0)?'+':'')+round(dailyFromWeight)+' ккал/день</div></div></div>';

    // Real deficit/surplus vs stated maintenance
    if(maint){
      // theoretical: eating avg vs maint
      var theoreticalDaily = avgIntake - maint; // negative = deficit
      var actualDaily = dailyFromWeight; // from scale
      var gap = actualDaily - theoreticalDaily;
      html += '<div style="font-size:12.5px;line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);">';
      html += '<div>По дневнику vs поддержание: <b style="color:'+(theoreticalDaily>0?'var(--red)':'var(--green)')+'">'+(theoreticalDaily>0?'+':'')+round(theoreticalDaily)+' ккал/день</b></div>';
      html += '<div>По весам (факт): <b style="color:'+(actualDaily>0?'var(--red)':'var(--green)')+'">'+(actualDaily>0?'+':'')+round(actualDaily)+' ккал/день</b></div>';
      // implied true maintenance: intake - weight_balance_daily
      // if lost weight, actualDaily negative; trueMaint = avgIntake - actualDaily
      if(daysWithFood > 0){
        var impliedMaint = avgIntake - actualDaily;
        html += '<div style="margin-top:6px;">Оценка реального поддержания: <b>'+round(impliedMaint)+' ккал</b><div style="font-size:11px;color:var(--muted);">среднее питание − изменение веса в ккал/день</div></div>';
      }
      html += '</div>';
    }
  } else if(!wStart || !wEnd){
    html += '<div style="font-size:12px;color:var(--muted);margin-top:8px;">Нужны записи веса на границах периода (или внутри).</div>';
  } else {
    html += '<div style="font-size:12px;color:var(--muted);margin-top:8px;">Одна точка веса — изменение не посчитать.</div>';
  }

  el.innerHTML = html;
}

function renderReportTab(content, fab){
  fab.innerHTML = '';
  const days = [];
  // последние 7 дней включая сегодня
  for(let i=6;i>=0;i--) days.push(shiftDate(todayStr(), -i));
  const rows = [];
  for(const d of days){
    const e = getDiary(d);
    const tot = computeTotals(e);
    const bg = activeGoals(d);
    rows.push({date:d, train:isTrainingDay(d), goalKcal:bg.kcal, goalP:bg.protein, goalF:bg.fat, goalC:bg.carbs, ...tot});
  }
  const today = todayStr();
  const withData = rows.filter(function(r){ return r.kcal > 0; }).map(function(r){
    var burn = dayBikeBurn(r.date);
    return Object.assign({}, r, { netKcal: r.kcal - burn, bike: burn });
  });
  const avg = (key)=> withData.length ? round(withData.reduce((s,r)=>s+r[key],0)/withData.length) : 0;
  const avgGoal = (key)=> withData.length ? round(withData.reduce((s,r)=>s+r[key],0)/withData.length) : 0;
  var avgKcal = avg('netKcal'), avgP = avg('protein'), avgF = avg('fat'), avgC = avg('carbs');
  var avgBike = avg('bike');
  var gKcal = avgGoal('goalKcal'), gP = avgGoal('goalP'), gF = avgGoal('goalF'), gC = avgGoal('goalC');
  var sortedWrep = weightLog.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  var pairRep = getWeekPair(sortedWrep, 0);
  var avgWthis = pairRep.newer.avg;
  var avgWprev = pairRep.older.avg;
  var wWeekDelta = (avgWthis != null && avgWprev != null) ? round(avgWthis - avgWprev) : null;

  function overStyle(val, goal){
    return (val > goal) ? 'color:var(--red);font-weight:700;' : '';
  }

  const sortedW = [...weightLog].sort((a,b)=>a.date.localeCompare(b.date));
  const wFirst = sortedW[0], wLast = sortedW[sortedW.length-1];
  const wDelta = (wFirst && wLast && wFirst!==wLast) ? round(wLast.kg - wFirst.kg) : null;
  var weightByDate = {};
  sortedW.forEach(function(w){ weightByDate[w.date] = w.kg; });

  var weekPairReportHtml = buildWeekPairHtml(sortedW);
  var reportGoal = activeGoals(todayStr());
  var trainingDays = days.filter(function(d){
    return getWorkouts(d).some(function(w){ return !!w.done || (w.weight != null && w.sets); });
  });
  var recentExerciseFacts = [];
  for(var di=days.length-1; di>=0 && recentExerciseFacts.length<3; di--){
    var ws = getWorkouts(days[di]);
    ws.forEach(function(w){
      if(w.weight != null && w.sets && recentExerciseFacts.length<3){
        recentExerciseFacts.push({name:w.name||'Упражнение', weight:w.weight, sets:w.sets, date:days[di]});
      }
    });
  }

  lines.push('Средние: клетчатка '+round(div.avgFiber)+' г, овощи '+round(div.avgVeg)+' г, фрукты '+round(div.avgFruit)+' г.');
  lines.push('Группы (число записей): овощи '+(div.groups.veg||0)+', фрукты '+(div.groups.fruit||0)+', крупы '+(div.groups.grain||0)+', белок '+(div.groups.protein||0)+', молочное '+(div.groups.dairy||0)+'.');

function fallbackCopyText(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
    showToast('Сводка скопирована');
  }catch(e){
    showToast('Не удалось скопировать — выдели текст вручную');
  }
  document.body.removeChild(ta);
}

function collectAllData(){
  var diary = {};
  // collect known diary keys from cache + scan localStorage if possible
  Object.keys(diaryCache).forEach(function(d){ diary[d] = diaryCache[d]; });
  try{
    if(_storageOk){
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('diary:')===0){
          var date = k.slice(6);
          if(!diary[date]){
            try{ diary[date] = JSON.parse(localStorage.getItem(k)); }catch(e){}
          }
        }
      }
    }
  }catch(e){}
  var workouts = {};
  Object.keys(workoutCache).forEach(function(d){ workouts[d] = workoutCache[d]; });
  try{
    if(_storageOk){
      for(var j=0;j<localStorage.length;j++){
        var kk = localStorage.key(j);
        if(kk && kk.indexOf('workout:')===0){
          var wd = kk.slice(8);
          if(!workouts[wd]){
            try{ workouts[wd] = JSON.parse(localStorage.getItem(kk)); }catch(e){}
          }
        }
      }
    }
  }catch(e){}
  var bike = {};
  Object.keys(bikeCache).forEach(function(d){ if(bikeCache[d]) bike[d] = bikeCache[d]; });
  try{
    if(_storageOk){
      for(var bi=0;bi<localStorage.length;bi++){
        var bk = localStorage.key(bi);
        if(bk && bk.indexOf('bike:')===0){
          var bd = bk.slice(5);
          if(!bike[bd]){
            try{ bike[bd] = JSON.parse(localStorage.getItem(bk)); }catch(e){}
          }
        }
      }
    }
  }catch(e){}
  return {
    version: 1,
    products: products,
    goals: goals,
    weightLog: weightLog,
    measureLog: measureLog,
    creatineLog: creatineLog,
    favorites: favorites,
    trainingDays: trainingDays,
    exercises: exercises,
    diary: diary,
    workouts: workouts,
    bike: bike
  };
}

function exportData(){
  try{
    var data = collectAllData();
    var json = JSON.stringify(data, null, 2);
    // try download
    var blob = new Blob([json], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'kbju-backup.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    // also copy to clipboard as fallback
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(function(){
        showToast('Скопировано + файл');
      }).catch(function(){ showToast('Файл сохранён'); });
    } else {
      showToast('Файл сохранён');
    }
  }catch(e){
    showToast('Ошибка экспорта');
  }
}

function importData(ev){
  var file = ev.target.files && ev.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object') throw new Error('bad');
      if(data.products && data.products.length) products = data.products;
      if(data.goals) goals = data.goals;
      if(data.weightLog) weightLog = data.weightLog;
      if(data.measureLog) measureLog = data.measureLog;
      if(data.creatineLog) creatineLog = data.creatineLog;
      if(data.favorites) favorites = data.favorites;
      if(data.trainingDays) trainingDays = data.trainingDays;
      if(data.exercises) exercises = data.exercises;
      sSet('products', products);
      sSet('goals', goals);
      sSet('weightLog', weightLog);
      sSet('measureLog', measureLog);
      sSet('creatineLog', creatineLog);
      sSet('favorites', favorites);
      sSet('trainingDays', trainingDays);
      sSet('exercises', exercises);
      diaryCache = {};
      if(data.diary){
        Object.keys(data.diary).forEach(function(date){
          var entries = data.diary[date] || [];
          diaryCache[date] = entries;
          sSet('diary:'+date, entries);
        });
      }
      if(data.workouts){
        workoutCache = {};
        Object.keys(data.workouts).forEach(function(date){
          var list = data.workouts[date] || [];
          workoutCache[date] = list;
          sSet('workout:'+date, list);
        });
      }
      if(data.bike){
        bikeCache = {};
        Object.keys(data.bike).forEach(function(date){
          var b = data.bike[date];
          if(b && b.km > 0){
            bikeCache[date] = { km: b.km, kcal: b.kcal != null ? b.kcal : bikeKcalFromKm(b.km) };
            sSet('bike:'+date, bikeCache[date]);
          }
        });
      }
      showToast('Данные импортированы');
      render();
    }catch(e){
      showToast('Не удалось прочитать файл');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

  const gramsEl = document.getElementById('gramsInput');
  const liveEl = document.getElementById('liveCalc');
  const modeProdBtn = document.getElementById('modeProd');
  const modeCustomBtn = document.getElementById('modeCustom');
  const productModeEl = document.getElementById('productMode');
  const customModeEl = document.getElementById('customMode');

  document.querySelectorAll('#mealPick [data-meal]').forEach(function(btn){
    btn.onclick = function(){
      meal = btn.dataset.meal;
      document.querySelectorAll('#mealPick [data-meal]').forEach(function(b){
        b.className = 'btn ' + (b.dataset.meal===meal ? 'primary' : 'ghost');
        b.style.flex='1'; b.style.minWidth='70px'; b.style.padding='8px'; b.style.fontSize='12px';
      });
    };
  });

  var amountUnit = 'grams'; // 'grams' | 'portions'

  function refreshUnitUI(){
    var unitToggle = document.getElementById('unitToggle');
    var quickG = document.getElementById('quickGrams');
    var quickP = document.getElementById('quickPortions');
    var hint = document.getElementById('portionHint');
    var label = document.getElementById('amountLabel');
    var has = productHasPortion(selected);
    if(unitToggle) unitToggle.style.display = has ? 'flex' : 'none';
    if(!has){
      amountUnit = 'grams';
      if(quickG) quickG.style.display = 'flex';
      if(quickP) quickP.style.display = 'none';
      if(hint) hint.style.display = 'none';
      if(label) label.textContent = 'Граммы';
      return;
    }
    if(label) label.textContent = amountUnit === 'portions' ? ('Кол-во ('+selected.portionName+')') : 'Граммы';
    if(quickG) quickG.style.display = amountUnit === 'grams' ? 'flex' : 'none';
    if(quickP) quickP.style.display = amountUnit === 'portions' ? 'flex' : 'none';
    var ug = document.getElementById('unitGrams');
    var up = document.getElementById('unitPortions');
    if(ug){ ug.className = 'btn '+(amountUnit==='grams'?'primary':'ghost'); ug.style.flex='1'; ug.style.padding='8px'; ug.style.fontSize='12px'; }
    if(up){ up.className = 'btn '+(amountUnit==='portions'?'primary':'ghost'); up.style.flex='1'; up.style.padding='8px'; up.style.fontSize='12px'; up.textContent = 'Порции ('+selected.portionName+')'; }
    if(hint){
      hint.style.display = '';
      hint.textContent = '1 '+selected.portionName+' = '+selected.portionGrams+' г';
    }
  }

  function amountToGrams(){
    var v = parseFloat(gramsEl.value)||0;
    if(amountUnit === 'portions' && productHasPortion(selected)){
      return v * selected.portionGrams;
    }
    return v;
  }

  document.querySelectorAll('#quickGrams [data-g]').forEach(function(btn){
    btn.onclick = function(){
      amountUnit = 'grams';
      gramsEl.value = btn.dataset.g;
      refreshUnitUI();
      updateLive();
    };
  });
  document.querySelectorAll('#quickPortions [data-n]').forEach(function(btn){
    btn.onclick = function(){
      amountUnit = 'portions';
      gramsEl.value = btn.dataset.n;
      refreshUnitUI();
      updateLive();
    };
  });
  var ugBtn = document.getElementById('unitGrams');
  var upBtn = document.getElementById('unitPortions');
  if(ugBtn) ugBtn.onclick = function(){
    if(amountUnit === 'portions' && productHasPortion(selected)){
      var n = parseFloat(gramsEl.value)||0;
      gramsEl.value = n ? round(n * selected.portionGrams) : '';
    }
    amountUnit = 'grams';
    refreshUnitUI();
    updateLive();
  };
  if(upBtn) upBtn.onclick = function(){
    if(!productHasPortion(selected)) return;
    if(amountUnit === 'grams'){
      var g = parseFloat(gramsEl.value)||0;
      gramsEl.value = g ? (Math.round(g / selected.portionGrams * 100) / 100) : '';
    }
    amountUnit = 'portions';
    refreshUnitUI();
    updateLive();
  };

  function setMode(m){
    mode = m;
    productModeEl.style.display = m==='product' ? '' : 'none';
    customModeEl.style.display = m==='custom' ? '' : 'none';
    modeProdBtn.className = 'btn ' + (m==='product'?'primary':'ghost');
    modeCustomBtn.className = 'btn ' + (m==='custom'?'primary':'ghost');
    modeProdBtn.style.flex='1'; modeProdBtn.style.padding='10px'; modeProdBtn.style.fontSize='13px';
    modeCustomBtn.style.flex='1'; modeCustomBtn.style.padding='10px'; modeCustomBtn.style.fontSize='13px';
  }
  modeProdBtn.onclick = function(){ setMode('product'); };
  modeCustomBtn.onclick = function(){ setMode('custom'); };

  function renderResults(q){
    var qLower = (q||'').toLowerCase();
    var list = products.filter(function(p){ return p.name.toLowerCase().indexOf(qLower) !== -1; });
    // pinned + frequent first
    list.sort(function(a,b){
      var ra = favoriteRank(a.id);
      var rb = favoriteRank(b.id);
      if(ra !== rb) return ra - rb;
      return a.name.localeCompare(b.name);
    });
    resultsEl.innerHTML = list.map(function(p){
      var star = isFavorite(p.id) ? '★' : '☆';
      var pinned = favorites.indexOf(p.id) >= 0;
      var sm = p.kcal+' ккал/100г';
      if(productHasPortion(p)) sm += ' · 1 '+p.portionName+'='+p.portionGrams+'г';
      return `<div class="search-item ${selected&&selected.id===p.id?'selected':''}" data-pick="${p.id}">
        <span><span data-fav="${p.id}" style="margin-right:6px;cursor:pointer;${pinned?'color:var(--amber)':''}">${star}</span>${p.name}</span>
        <span class="sm">${sm}</span>
      </div>`;
    }).join('') || `<div class="search-item" style="color:var(--muted)">Ничего не найдено</div>`;
    resultsEl.querySelectorAll('[data-pick]').forEach(function(el){
      el.onclick = function(ev){
        if(ev.target && ev.target.getAttribute && ev.target.getAttribute('data-fav')){
          ev.stopPropagation();
          toggleFavorite(ev.target.getAttribute('data-fav'));
          renderResults(searchEl.value);
          return;
        }
        selected = products.find(function(p){ return p.id===el.dataset.pick; });
        if(productHasPortion(selected)){
          amountUnit = 'portions';
          if(!gramsEl.value) gramsEl.value = '1';
        } else {
          amountUnit = 'grams';
        }
        refreshUnitUI();
        renderResults(searchEl.value);
        updateLive();
      };
    });
  }
  function updateLive(){
    var g = amountToGrams();
    if(selected && g>0){
      var f = g/100;
      var rem = remainingMacros(currentDate);
      var html = '≈ '+round(selected.kcal*f)+' ккал · Б'+round(selected.protein*f)+' Ж'+round(selected.fat*f)+' У'+round(selected.carbs*f);
      if(amountUnit === 'portions' && productHasPortion(selected)){
        html += '<div style="margin-top:2px;">= '+round(g)+' г</div>';
      } else if(productHasPortion(selected)){
        var pl = formatPortionLine(selected, g);
        if(pl) html += '<div style="margin-top:2px;">≈ '+pl+'</div>';
      }
      html += '<div style="margin-top:4px;opacity:.85;">Остаток дня: '+round(rem.kcal)+' ккал · Б'+round(rem.protein)+' Ж'+round(rem.fat)+' У'+round(rem.carbs)+'</div>';
      var alts = suggestAlternatives(selected, g, rem);
      if(alts.length){
        html += '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--red);">';
        alts.forEach(function(a){ html += '<div style="margin:4px 0;line-height:1.35;">'+a.text+'</div>'; });
        html += '</div>';
      }
      liveEl.innerHTML = html;
    } else {
      liveEl.textContent = '';
    }
  }
  renderResults('');
  if(searchEl) searchEl.oninput = function(){ renderResults(searchEl.value); };
  if(gramsEl) gramsEl.oninput = updateLive;
  // when editing: if product has portion and grams fits, offer portions mode
  if(selected && productHasPortion(selected) && existing && existing.grams){
    var n = existing.grams / selected.portionGrams;
    if(Math.abs(n - Math.round(n*2)/2) < 0.08){
      amountUnit = 'portions';
      gramsEl.value = Math.round(n*2)/2;
    }
  }
  refreshUnitUI();
  updateLive();
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = function(e){ if(e.target.id==='ov') closeModal(); };
  document.getElementById('saveBtn').onclick = function(){
    var entries = getDiary(currentDate);
    var timeVal = (document.getElementById('entryTime').value || nowTimeStr());
    if(mode === 'product'){
      if(!selected){ showToast('Выбери продукт'); return; }
      var g = amountToGrams();
      if(!g || g<=0){ showToast(amountUnit==='portions'?'Укажи порции':'Укажи граммы'); return; }
      g = Math.round(g * 10) / 10;
      if(isEdit){
        existing.productId = selected.id;
        existing.grams = g;
        existing.meal = meal;
        existing.time = timeVal;
        existing.snap = snapshotFromProduct(selected, g);
        delete existing.custom;
        delete existing.name;
        delete existing.kcal;
        delete existing.protein;
        delete existing.fat;
        delete existing.carbs;
      } else {
        entries.push({id:uid(), productId:selected.id, grams:g, meal:meal, time:timeVal, snap: snapshotFromProduct(selected, g)});
      }
    } else {
      var name = (document.getElementById('customName').value || '').trim() || 'Свой приём';
      var kcal = parseFloat(document.getElementById('customKcal').value);
      var protein = parseFloat(document.getElementById('customProtein').value) || 0;
      var fat = parseFloat(document.getElementById('customFat').value) || 0;
      var carbs = parseFloat(document.getElementById('customCarbs').value) || 0;
      if(isNaN(kcal) || kcal < 0){ showToast('Укажи калории'); return; }
      if(isEdit){
        existing.custom = true;
        existing.name = name;
        existing.kcal = kcal;
        existing.protein = protein;
        existing.fat = fat;
        existing.carbs = carbs;
        existing.meal = meal;
        existing.time = timeVal;
        delete existing.productId;
        delete existing.grams;
        delete existing.snap;
      } else {
        entries.push({id:uid(), custom:true, name:name, kcal:kcal, protein:protein, fat:fat, carbs:carbs, meal:meal, time:timeVal});
      }
    }
    saveDiary(currentDate, entries);
    closeModal();
    render();
  };
}

        <h2>Скопировать день</h2>
        <div class="field">
          <label>Откуда</label>
          <input type="date" id="copyFrom" value="${yesterday}">
        </div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.4;">
          Записи будут добавлены к текущему дню (${fmtDateHuman(currentDate)}). Уже существующие не удалятся.
        </div>
        <div class="sheet-actions">
          <button class="btn ghost" id="cancelBtn">Отмена</button>
          <button class="btn primary" id="saveBtn">Скопировать</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = function(e){ if(e.target.id==='ov') closeModal(); };
  document.getElementById('saveBtn').onclick = function(){
    var from = document.getElementById('copyFrom').value;
    if(!from){ showToast('Укажи дату'); return; }

    var src = getDiary(from);
    if(!src.length){ showToast('В этот день пусто'); return; }
    var dest = getDiary(currentDate);
    src.forEach(function(e){
      var copy = Object.assign({}, e, { id: uid() });
      dest.push(copy);
    });
    saveDiary(currentDate, dest);
    closeModal();
    render();
    showToast('Скопировано: '+src.length);
  };
}

    // one entry per date
    measureLog = measureLog.filter(function(m){ return m.date !== date; });
    measureLog.push({id:uid(), date:date, neck:neck, waist:waist, chest:chest, bicepL:bicepL, bicepR:bicepR});
    sSet('measureLog', measureLog);
    closeModal();
    render();
  };
}

function openGoalsForm(){
  const root = document.getElementById('modalRoot');
  var estM = estimateMaintenanceKcal();
  var autoSupport = estM && estM.kcal ? estM.kcal : (goals.maintenanceKcal || 2000);
  var autoSupportSource = estM && estM.kcal ? (estM.confidence === 'high' ? 'по весу и питанию · надёжность высокая' : 'по весу и питанию · предварительная оценка') : 'резервное значение · пока мало данных';
  var autoPlan = Math.max(1200, Math.round(autoSupport - Math.round(0.5 * 7700 / 7)));
  var autoMacros = macrosFromDeficitPlan(autoPlan);

  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <h2>Дневные цели</h2>
        <label style="display:flex;align-items:flex-start;gap:10px;margin:4px 0 12px;font-size:13px;line-height:1.4;">
          <input type="checkbox" id="gAutoW" ${goals.autoFromWeight?'checked':''} style="width:20px;height:20px;margin-top:2px;accent-color:var(--green);">
          <span><b>Автоматический расчёт от веса</b><br><span style="color:var(--muted);font-size:12px;">Цель рассчитывается для снижения примерно на 0,5 кг в неделю.</span></span>
        </label>
        <div id="autoGoalsView" class="card" style="margin-bottom:12px;padding:12px 14px;">
          <div style="font-size:13px;color:var(--muted);">Цель на день</div>
          <div style="font-size:22px;font-weight:700;margin:2px 0 10px;">${autoMacros.kcal} ккал</div>
          <div style="font-size:13px;">Б ${autoMacros.protein} г · Ж ${autoMacros.fat} г · У ${autoMacros.carbs} г</div>
          <div style="font-size:13px;color:var(--muted);margin-top:10px;">Поддержание: <b style="color:var(--ink);">${Math.round(autoSupport)} ккал</b></div><div style="font-size:11px;color:var(--muted);margin-top:3px;">${autoSupportSource}</div>
        </div>
        <div id="manualGoalsView">
          <div class="field"><label>Калории</label><input id="gKcal" type="number" value="${goals.kcal}"></div>
          <div class="row4">
            <div class="field"><label>Белки</label><input id="gProtein" type="number" value="${goals.protein}"></div>
            <div class="field"><label>Жиры</label><input id="gFat" type="number" value="${goals.fat}"></div>
            <div class="field"><label>Углеводы</label><input id="gCarbs" type="number" value="${goals.carbs}"></div>
          </div>
          <div class="field"><label>Калории поддержания</label><input id="gMaint2" type="number" inputmode="decimal" value="${goals.maintenanceKcal||''}" placeholder="например, 2200"></div>
        </div>
        <label style="display:flex;align-items:flex-start;gap:10px;margin:10px 0 8px;font-size:13px;line-height:1.4;">
          <input type="checkbox" id="g8020" ${goals.rule8020!==false?'checked':''} style="width:20px;height:20px;margin-top:2px;accent-color:var(--green);">
          <span><b>80/20 — 1 день поддержки в неделю</b><br><span style="color:var(--muted);font-size:12px;">В выбранный день калорийность равна поддержанию. На следующий день возвращается обычная цель.</span></span>
        </label>
        <div class="field" id="maintenanceDayField"><label>День поддержки</label>
          <select id="gMaintDay" style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--surface);">
            <option value="0" ${goals.maintenanceWeekday===0?'selected':''}>Воскресенье</option>
            <option value="1" ${goals.maintenanceWeekday===1?'selected':''}>Понедельник</option>
            <option value="2" ${goals.maintenanceWeekday===2?'selected':''}>Вторник</option>
            <option value="3" ${goals.maintenanceWeekday===3?'selected':''}>Среда</option>
            <option value="4" ${goals.maintenanceWeekday===4?'selected':''}>Четверг</option>
            <option value="5" ${goals.maintenanceWeekday===5?'selected':''}>Пятница</option>
            <option value="6" ${goals.maintenanceWeekday===6?'selected':''}>Суббота</option>
          </select>
        </div>
        <label style="display:flex;align-items:flex-start;gap:10px;margin:6px 0 8px;font-size:13px;line-height:1.4;">
          <input type="checkbox" id="gWoAuto" ${goals.workoutAuto!==false?'checked':''} style="width:20px;height:20px;margin-top:2px;accent-color:var(--green);">
          <span><b>Авто-упражнения</b><br><span style="color:var(--muted);font-size:12px;">Подставлять план тренировки с учётом прошлых результатов.</span></span>
        </label>
        <label style="display:flex;align-items:flex-start;gap:10px;margin:10px 0 12px;font-size:13px;line-height:1.4;">
          <input type="checkbox" id="gSmart" ${goals.smartAdjust?'checked':''} style="width:20px;height:20px;margin-top:2px;accent-color:var(--green);">
          <span><b>Умная корректировка</b><br><span style="color:var(--muted);font-size:12px;">Учитывать переедание в последующие дни. Выкл. — спокойный режим.</span></span>
        </label>
        <div class="sheet-actions">
          <button class="btn ghost" id="cancelBtn">Отмена</button>
          <button class="btn primary" id="saveBtn">Сохранить</button>
        </div>
      </div>
    </div>`;

  function refreshGoalsMode(){
    var auto = document.getElementById('gAutoW').checked;
    document.getElementById('autoGoalsView').style.display = auto ? 'block' : 'none';
    document.getElementById('manualGoalsView').style.display = auto ? 'none' : 'block';
    document.getElementById('maintenanceDayField').style.display = document.getElementById('g8020').checked ? 'block' : 'none';
  }
  document.getElementById('gAutoW').onchange = refreshGoalsMode;
  document.getElementById('g8020').onchange = refreshGoalsMode;
  refreshGoalsMode();

  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = function(e){ if(e.target.id==='ov') closeModal(); };
  document.getElementById('saveBtn').onclick = function(){
    goals.autoFromWeight = !!document.getElementById('gAutoW').checked;
    if(!goals.autoFromWeight){
      goals.kcal = parseFloat(document.getElementById('gKcal').value)||goals.kcal;
      goals.protein = parseFloat(document.getElementById('gProtein').value)||goals.protein;
      goals.fat = parseFloat(document.getElementById('gFat').value)||goals.fat;
      goals.carbs = parseFloat(document.getElementById('gCarbs').value)||goals.carbs;
      var mk2 = parseFloat(document.getElementById('gMaint2').value);
      if(mk2 > 0) goals.maintenanceKcal = mk2;
    } else {
      var est2 = estimateMaintenanceKcal();
      var mk = est2 && est2.kcal ? est2.kcal : (goals.maintenanceKcal || 2000);
      goals.maintenanceKcal = mk;
      var plan = Math.max(1200, Math.round(mk - Math.round(0.5 * 7700 / 7)));
      var mm = macrosFromDeficitPlan(plan);
      goals.kcal = mm.kcal; goals.protein = mm.protein; goals.fat = mm.fat; goals.carbs = mm.carbs;
    }
    goals.rule8020 = !!document.getElementById('g8020').checked;
    goals.workoutAuto = !!document.getElementById('gWoAuto').checked;
    goals.maintenanceWeekday = parseInt(document.getElementById('gMaintDay').value, 10);
    if(isNaN(goals.maintenanceWeekday)) goals.maintenanceWeekday = 0;
    goals.smartAdjust = !!document.getElementById('gSmart').checked;
    goals.trainKcal = goals.kcal;
    goals.trainProtein = goals.protein;
    goals.trainFat = goals.fat;
    goals.trainCarbs = goals.carbs;
    sSet('goals', goals);
    closeModal();
    render();
  };
}

function esc(s){
  return String(s==null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
