function computeRecipeFromIngredients(ings){
  // ings: [{productId, grams}]
  var tot = { kcal:0, protein:0, fat:0, carbs:0, fiber:0, sugar:0, salt:0, satFat:0, micronutrients:{}, grams:0 };
  var resolved = [];
  ings.forEach(function(ing){
    var p = products.find(function(x){ return x.id === ing.productId; });
    if(!p || !(ing.grams > 0)) return;
    ensureProductMeta(p);
    var f = ing.grams / 100;
    tot.kcal += (p.kcal||0)*f;
    tot.protein += (p.protein||0)*f;
    tot.fat += (p.fat||0)*f;
    tot.carbs += (p.carbs||0)*f;
    tot.fiber += (p.fiber||0)*f; if(p.sugar!=null)tot.sugar+=(+p.sugar||0)*f;if(p.salt!=null)tot.salt+=(+p.salt||0)*f;if(p.satFat!=null)tot.satFat+=(+p.satFat||0)*f;Object.keys(p.micronutrients||{}).forEach(function(k){tot.micronutrients[k]=(tot.micronutrients[k]||0)+(+p.micronutrients[k]||0)*f;});
    tot.grams += ing.grams;
    resolved.push({ productId: p.id, name: p.name, grams: ing.grams });
  });
  if(tot.grams <= 0) return null;
  var per100 = {
    kcal: round(tot.kcal / tot.grams * 100),
    protein: round(tot.protein / tot.grams * 100 * 10) / 10,
    fat: round(tot.fat / tot.grams * 100 * 10) / 10,
    carbs: round(tot.carbs / tot.grams * 100 * 10) / 10,
    fiber: round(tot.fiber / tot.grams * 100 * 10) / 10,
    sugar:round(tot.sugar/tot.grams*100*10)/10,salt:round(tot.salt/tot.grams*100*10)/10,satFat:round(tot.satFat/tot.grams*100*10)/10,micronutrients:Object.fromEntries(Object.keys(tot.micronutrients).map(function(k){return [k,round(tot.micronutrients[k]/tot.grams*100*10)/10];})),
    totalGrams: round(tot.grams),
    totalKcal: round(tot.kcal),
    ingredients: resolved
  };
  return per100;
}

function migrateLegacyTrainingJournal(){
  var all=trainingJournalList();
  // Старые версии ошибочно создавали отдельную legacy-сессию на каждое упражнение. Объединяем их по дате.
  var merged={},keep=[];all.forEach(function(x){if(x&&x.legacy){var k=x.date||'unknown';if(!merged[k]){merged[k]=Object.assign({},x,{id:'legacy-'+k,sets:[]});keep.push(merged[k]);}merged[k].sets=merged[k].sets.concat(x.sets||[]);merged[k].plannedSets+=0;merged[k].completedSets=merged[k].sets.length;}else keep.push(x);});all=keep;
  // Восстанавливаем фактические подходы из дневного плана даже после прежней миграции.
  // Это закрывает случай, когда факт виден в отчёте за день, но не попал в журнал.
  var recoveredChanged=false;
  Object.keys(workoutCache||{}).forEach(function(date){
    (workoutCache[date]||[]).forEach(function(w){
      if(!w||(!w.done&&!w.sets))return;
      var vals=String(w.sets||'').split(/[\/,; ]+/).map(function(x){return parseInt(x,10);}).filter(function(x){return isFinite(x)&&x>0;});
      if(!vals.length)return;
      var key=exerciseMatchKey(w.name),already=all.some(function(session){return session.date===date&&(session.sets||[]).some(function(x){return exerciseMatchKey(x.name)===key;});});
      if(already)return;
      var sid='recovered-'+date+'-'+String(w.id||key).replace(/[^a-z0-9а-я]/gi,'').slice(0,24);
      var rec=all.find(function(x){return x.id===sid;});
      if(!rec){rec={id:sid,date:date,started:0,ended:0,sets:[],plannedSets:0,completedSets:0,status:'finished',recovered:true};all.push(rec);}
      vals.forEach(function(reps,i){rec.sets.push({key:sid+':'+i,exerciseId:w.id,name:w.name,set:i+1,total:vals.length,reps:reps,weight:+w.weight||0});});
      rec.plannedSets+=vals.length;rec.completedSets=rec.sets.length;recoveredChanged=true;
    });
  });
  if(sGet('trainingJournalMigratedV42',false)){if(recoveredChanged)sSet('trainingSessions',all);else sSet('trainingSessions',all);return;}
  var seen={};
  all.forEach(function(s){(s.sets||[]).forEach(function(x){seen[x.key]=1;});});
  Object.keys(workoutCache||{}).forEach(function(date){
    (workoutCache[date]||[]).forEach(function(w){
      if(!w||(!w.done&&!w.sets))return;
      var vals=String(w.sets||'').split(/[\\/,; ]+/).map(function(x){return parseInt(x,10);}).filter(function(x){return isFinite(x)&&x>0;});
      if(!vals.length)return;
      var sid='legacy-'+date+'-'+String(w.id||w.name).replace(/[^a-z0-9а-я]/gi,'').slice(0,24);
      var rec=all.find(function(x){return x.id===sid;});
      if(!rec){rec={id:sid,date:date,started:0,ended:0,sets:[],plannedSets:vals.length,completedSets:0,status:'finished',legacy:true};all.push(rec);}
      vals.forEach(function(reps,i){var key=sid+':'+i;if(!seen[key]){rec.sets.push({key:key,exerciseId:w.id,name:w.name,set:i+1,total:vals.length,reps:reps,weight:+w.weight||0});seen[key]=1;}});
      rec.completedSets=rec.sets.length;
    });
  });
  var byLegacyDate={},mergedAll=[];all.forEach(function(x){if(x&&x.legacy){var k=x.date||'unknown';if(!byLegacyDate[k]){byLegacyDate[k]=Object.assign({},x,{id:'legacy-'+k,sets:[]});mergedAll.push(byLegacyDate[k]);}byLegacyDate[k].sets=byLegacyDate[k].sets.concat(x.sets||[]);byLegacyDate[k].completedSets=byLegacyDate[k].sets.length;}else mergedAll.push(x);});
  sSet('trainingSessions',mergedAll);sSet('trainingJournalMigratedV42',true);
}
function trainingJournalStats(days){
  var from=shiftDate(todayStr(),-(days-1)),all=trainingJournalList().filter(function(s){return s.date>=from&&s.date<=todayStr()&&(s.sets||[]).length>0;});
  var sets=0,volume=0,ex={},covered={};
  all.forEach(function(s){covered[s.date]=true;(s.sets||[]).forEach(function(x){sets++;volume+=(+x.weight||0)*(+x.reps||0);ex[x.name||'Упражнение']=1;});});
  // Совместимость со старыми записями плана: если журнал ещё не содержит дату,
  // считаем только упражнения с явным фактом выполнения.
  for(var i=0;i<days;i++){var d=shiftDate(todayStr(),-i);if(covered[d])continue;var ws=getWorkouts(d)||[],daySets=0;
    ws.forEach(function(w){if(!w||(!w.done&&!w.sets))return;var reps=parseSetArray(w.sets||'');if(!reps.length)return;daySets+=reps.length;reps.forEach(function(r){sets++;volume+=(+w.weight||0)*r;});ex[w.name||'Упражнение']=1;});

var KCAL_PER_KG = 7700;

function avgIntakeLastDays(n){
  // n = null → all fully completed diary days with food
  // условное нетто = еда − оценка вело (учитываем расход к поддержанию)
  var total = 0, daysWithData = 0;
  if(n == null){
    var dates = collectDiaryDates();
    dates.forEach(function(d){
      var t = computeTotals(getDiary(d));
      if(t.kcal > 0){ total += (t.kcal - dayBikeBurn(d)); daysWithData++; }
    });
  } else {
    // последние n дней включая сегодня: 0 … n-1
    for(var i=0;i<n;i++){
      var d = shiftDate(todayStr(), -i);
      var t = computeTotals(getDiary(d));
      if(t.kcal > 0){ total += (t.kcal - dayBikeBurn(d)); daysWithData++; }
    }
  }
  return {
    avg: daysWithData ? total / daysWithData : 0,
    days: daysWithData,
    total: total
  };
}

/** Средний вес в окне [fromDate, toDate] включительно */
function avgWeightInRange(fromDate, toDate){
  var list = (weightLog || []).filter(function(w){
    return w && w.date && w.kg > 0 && w.date >= fromDate && w.date <= toDate;
  });
  if(!list.length) return null;
  var s = 0;
  list.forEach(function(w){ s += +w.kg; });
  return { avg: s / list.length, n: list.length, first: list.slice().sort(function(a,b){return a.date.localeCompare(b.date);})[0],
    last: list.slice().sort(function(a,b){return a.date.localeCompare(b.date);})[list.length-1] };
}

/**
 * Оценка поддержки по еде+весу за 30 и 45 дней.
 * Важно: быстрый сброс (вода/гликоген) не считаем целиком жиром —
 * учитываем Δкг не быстрее ~0.75 кг/нед для формулы.
 */
function estimateMaintenanceKcal(){
  var sortedW = (weightLog || []).filter(function(w){ return w && w.kg > 0; })
    .slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  var completedEnd = shiftDate(todayStr(), -1);
  sortedW = sortedW.filter(function(w){ return w.date <= completedEnd; });
  var lastKg = sortedW.length ? sortedW[sortedW.length-1].kg : null;

  function windowEst(daysBack){
    var end = completedEnd;
    var start = shiftDate(end, -(daysBack - 1));
    var totalK = 0, foodDays = 0;
    for(var i=0;i<daysBack;i++){
      var d = shiftDate(end, -i);
      var t = computeTotals(getDiary(d));
      if(t.kcal > 0){
        totalK += (t.kcal - dayBikeBurn(d));
        foodDays++;
      }
    }
    // Требуем не менее 80% дней, явно отмеченных как полностью записанные.
    var minFoodDays = Math.round(daysBack * 0.8);
    if(foodDays < minFoodDays) return null;
    var avgIntake = totalK / foodDays;

    var wStart = shiftDate(start, -3);
    var weights = sortedW.filter(function(w){ return w.date >= wStart && w.date <= end; });
    var minWeights = daysBack >= 40 ? 6 : 4;
    if(weights.length < minWeights) return null;
    var w0 = weights[0], w1 = weights[weights.length - 1];
    var spanDays = daysBetween(w0.date, w1.date);
    if(spanDays < Math.round(daysBack * 0.7)) return null;

    // Линейный тренд по всем взвешиваниям вместо разницы двух крайних точек.
    // Это снижает влияние разовых скачков воды и соли.
    var x0 = dateToMs(w0.date), sumX = 0, sumY = 0, sumXX = 0, sumXY = 0;
    weights.forEach(function(w){
      var x = daysBetween(w0.date, w.date);
      sumX += x; sumY += +w.kg; sumXX += x*x; sumXY += x*(+w.kg);
    });
    var nW = weights.length, denom = nW*sumXX - sumX*sumX;
    if(!denom) return null;
    var slopeKgDay = (nW*sumXY - sumX*sumY) / denom;
    var deltaKgRaw = slopeKgDay * spanDays;
    var maxAbs = 0.75 * (spanDays / 7);
    var deltaKg = Math.max(-maxAbs, Math.min(maxAbs, deltaKgRaw));
    var dailyBal = (deltaKg * KCAL_PER_KG) / spanDays;
    var maint = avgIntake - dailyBal;
    if(!isFinite(maint)) return null;

    // вес окна: длиннее + больше еды — надёжнее; 30д важнее 14д
    var wgt = (foodDays / daysBack) * (spanDays / daysBack);
    return {
      daysBack: daysBack,
      foodDays: foodDays,
      spanDays: spanDays,
      avgIntake: round(avgIntake),
      deltaKg: round(deltaKgRaw),
      deltaUsed: round(deltaKg),
      maint: round(maint),
      weight: wgt,
      weightCount: weights.length,
      foodCoverage: foodDays / daysBack,
      weightMethod: 'linear-trend' 
    };
  }

  // Окна 30 и 45 дней. Короткие окна (14 дн.) не используем: колебания воды
  // и гликогена в них принимаются за изменение жира и завышают поддержание.
  var e30 = windowEst(30);
  var e45 = windowEst(45);
  var parts = [];
  if(e30) parts.push(e30);
  if(e45) parts.push(e45);

  // Автооценка требует полноценного 30-дневного окна: минимум 24 дня питания,
  // 4 взвешивания и не менее 21 дня между крайними измерениями. Короткое окно
  // само по себе не переключает автоматическую цель на нестабильную оценку.
  if(!e30) return null;

  var sumW = 0, sumM = 0;
  parts.forEach(function(p){ sumW += p.weight; sumM += p.maint * p.weight; });
  var kcal = sumM / sumW;

  // якорь по массе тела: 22–36 ккал/кг (сидячий…умеренный)
  if(lastKg && lastKg > 40){
    var lo = lastKg * 22;
    var hi = lastKg * 36;
    // мягко тянем к окну, не режем жёстко одним скачком
    if(kcal < lo) kcal = lo * 0.35 + kcal * 0.65;
    if(kcal > hi) kcal = hi * 0.35 + kcal * 0.65;
    if(kcal < lastKg * 20) kcal = lastKg * 20;
    if(kcal > lastKg * 38) kcal = lastKg * 38;
  } else {
    if(kcal < 1400) kcal = 1400;
    if(kcal > 3200) kcal = 3200;
  }
  kcal = round(kcal);

  var detail = parts.map(function(p){
    var note = (Math.abs(p.deltaKg - p.deltaUsed) > 0.15) ? (' учтён Δ'+p.deltaUsed+' из '+p.deltaKg) : '';
    return p.daysBack+'д: приём ~'+p.avgIntake+', Δ'+p.deltaKg+' кг → ~'+p.maint+note;
  }).join(' · ');
  detail += ' → итог '+kcal;
  var confidence = 'medium';
  if(e45 && Math.abs(e45.maint - e30.maint) <= 150 && e30.foodCoverage >= 0.8 && e30.weightCount >= 6) confidence = 'high';
  return { kcal: kcal, source: 'weight+intake', confidence: confidence, detail: detail, windows: parts, foodDays30:e30.foodDays, weightCount30:e30.weightCount, spanDays30:e30.spanDays };
}

/** Актуальная поддержка: авто-оценка или ручной ввод */
function effectiveMaintenanceKcal(){
  if(goals.autoFromWeight){
    var est = estimateMaintenanceKcal();
    if(est && est.kcal) return est.kcal;
  }
  return goals.maintenanceKcal || 2000;
}

function fmtFutureDate(days){
  if(days <= 0) return 'уже достигнуто';
  if(!isFinite(days) || days > 3650) return 'более 10 лет';
  var d = new Date();
  d.setDate(d.getDate() + Math.ceil(days));
  var months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function daysUntilDate(iso){
  if(!iso) return null;
  var a = dateToMs(todayStr());
  var b = dateToMs(iso);
  return Math.round((b - a) / 86400000);
}

function projectFromAvg(current, target, maint, avgIntake){
  var kgLeft = current - target;
  if(kgLeft <= 0) return { date: 'цель уже достигнута или выше', days: 0, deficit: 0, avg: avgIntake };
  if(!avgIntake || avgIntake <= 0) return { date: 'нет данных', days: null, deficit: null, avg: 0 };
  var deficit = maint - avgIntake;
  if(deficit <= 50) return { date: 'цель не достигается', days: null, deficit: round(deficit), avg: round(avgIntake), note: 'дефицит слишком мал' };
  var days = kgLeft * KCAL_PER_KG / deficit;
  return { date: fmtFutureDate(days), days: days, deficit: round(deficit), avg: round(avgIntake) };
}

function weightByDate(current, maint, avgIntake, targetIso){
  var days = daysUntilDate(targetIso);
  if(days == null || days < 0) return null;
  if(!avgIntake || avgIntake <= 0 || !maint) return null;
  var dailyDeltaKg = (avgIntake - maint) / KCAL_PER_KG; // positive = gain
  return round(current + dailyDeltaKg * days);
}

function kcalToHitTargetByDate(current, target, maint, targetIso){
  var days = daysUntilDate(targetIso);
  if(days == null || days <= 0) return null;
  var kgLeft = current - target;
  // needed daily deficit to lose kgLeft in `days`
  var neededDeficit = (kgLeft * KCAL_PER_KG) / days;
  return round(maint - neededDeficit); // target daily intake
}

function projectWeightDate(){
  var sorted = [...weightLog].sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(!sorted.length) return null;
  var current = sorted[sorted.length-1].kg;
  var target = goals.targetWeight;
  var maint = goals.autoFromWeight ? effectiveMaintenanceKcal() : goals.maintenanceKcal;
  if(!target || !maint) return null;

  var w7 = avgIntakeLastDays(7);
  var w30 = avgIntakeLastDays(30);
  var wall = avgIntakeLastDays(null);

  var plannedDeficit = maint - goals.kcal;
  // Средний дефицит за неделю с одним днём поддержки.
  var plannedWeeklyDailyDeficit = goals.rule8020 ? plannedDeficit * 6 / 7 : plannedDeficit;
  var planned = null;
  if(target < current){
    if(plannedWeeklyDailyDeficit > 50){
      var pd = (current - target) * KCAL_PER_KG / plannedWeeklyDailyDeficit;
      planned = { date: fmtFutureDate(pd), days: pd, avg: goals.rule8020 ? round((goals.kcal * 6 + maint) / 7) : goals.kcal, deficit: round(plannedWeeklyDailyDeficit) };
    } else {
      planned = { date: 'нужен больший дефицит', days: null, avg: goals.rule8020 ? round((goals.kcal * 6 + maint) / 7) : goals.kcal, deficit: round(plannedWeeklyDailyDeficit) };
    }
  } else if(target > current){
    planned = { date: 'цель выше текущего — это набор', days: null };
  } else {
    planned = { date: 'уже на цели', days: 0 };
  }

  return {
    current: current,
    target: target,
    kgLeft: round(current - target),
    maint: maint,
    planned: planned,
    week: projectFromAvg(current, target, maint, w7.avg),
    month: projectFromAvg(current, target, maint, w30.avg),
    all: projectFromAvg(current, target, maint, wall.avg),
    avg7: w7,
    avg30: w30,
    avgAll: wall
  };
}

function dateToMs(str){
  var p = str.split('-');
  return new Date(+p[0], +p[1]-1, +p[2]).getTime();
}
function daysBetween(a, b){
  return Math.round((dateToMs(b) - dateToMs(a)) / 86400000);
}
function weekAvgWeight(sorted, fromDate, toDate){
  var list = sorted.filter(function(w){ return w.date >= fromDate && w.date <= toDate; });
  if(!list.length) return null;
  return list.reduce(function(s,w){ return s + w.kg; }, 0) / list.length;
}

var weekPairOffset = 0; // 0 = текущая vs прошлая, 1 = ещё на неделю назад и т.д.

function currentWeightKg(){
  if(!weightLog.length) return null;
  var s = weightLog.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  return s[s.length-1].kg;
}

/** Макс. безопасный сброс за неделю: ~1% массы, не больше 1 кг */
function safeMaxWeeklyLossKg(){
  var w = currentWeightKg();
  if(!w || w <= 0) return 0.7;
  return Math.min(1.0, Math.max(0.5, Math.round(w * 0.01 * 10) / 10));
}

function getWeekPair(sorted, offset){
  offset = offset || 0;
  var today = todayStr();
  var newerEnd = offset === 0 ? today : shiftDate(today, -7 * offset);
  var newerStart = shiftDate(newerEnd, -6);
  var olderEnd = shiftDate(newerStart, -1);
  var olderStart = shiftDate(olderEnd, -6);
  return {

function productGroupKey(p){

  if(/яйц|рыб|тунц|куриц|индей|говяд|свинин|мясо|ветчин|сосиск|карпач/.test(n)) return 'protein';
  if(/творог|йогурт|молоко|сыр|кефир|скир|протеин|пудинг|exponenta|teos|neo /.test(n)) return 'dairy';
  if(/гречк|рис|овсян|хлеб|картоф|чечевиц|макарон|лаваш|перлов|пш[её]н/.test(n)) return 'grain';
  if(/огур|помид|капуст|броккол|морков|салат|лук|перец/.test(n)) return 'veg';
  if(/яблок|банан|мандар|груш|апельсин|ягод|киви/.test(n)) return 'fruit';

function productsByGroups(list){
  list = (list || products).slice();
  var used = {};
  var out = [];
  var customNames=[]; list.forEach(function(p){if(p.customCategory&&p.customCategory.trim()&&customNames.indexOf(p.customCategory.trim())<0)customNames.push(p.customCategory.trim());});
  customNames.sort(function(a,b){return a.localeCompare(b,'ru');}).forEach(function(name){var items=list.filter(function(p){if(used[p.id]||!p.customCategory||p.customCategory.trim()!==name)return false;used[p.id]=true;return true;}).sort(function(a,b){return (a.name||'').localeCompare(b.name||'','ru');});if(items.length)out.push({key:'custom:'+name,title:name,items:items});});
  PRODUCT_GROUPS.forEach(function(g){
    var items = list.filter(function(p){
      if(used[p.id]) return false;

}

      var tooFast = weekDelta < -safeMax;
      var dColor = tooFast ? 'var(--red)' : (weekDelta > 0 ? 'var(--red)' : (weekDelta < 0 ? 'var(--green)' : 'var(--muted)'));
      var dSign = weekDelta > 0 ? '+' : '';

function bindWeekPairHandlers(){
  var weekOlder = document.getElementById('weekPairOlder');
  var weekNewer = document.getElementById('weekPairNewer');
  if(weekOlder) weekOlder.onclick = function(){ weekPairOffset = Math.min(12, weekPairOffset + 1); render(); };
  if(weekNewer) weekNewer.onclick = function(){ weekPairOffset = Math.max(0, weekPairOffset - 1); render(); };
  var weekCard = document.getElementById('weekPairCard');
  if(weekCard){
    var touchX = null;
    weekCard.addEventListener('touchstart', function(e){
      if(e.changedTouches && e.changedTouches[0]) touchX = e.changedTouches[0].clientX;
    }, {passive:true});
    weekCard.addEventListener('touchend', function(e){
      if(touchX == null || !e.changedTouches || !e.changedTouches[0]) return;
      var dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if(Math.abs(dx) < 40) return;
      if(dx > 0) weekPairOffset = Math.min(12, weekPairOffset + 1);
      else weekPairOffset = Math.max(0, weekPairOffset - 1);
      render();
    }, {passive:true});
  }
}

function collectDiaryDates(){
  var dates = {};
  Object.keys(diaryCache).forEach(function(d){ dates[d]=1; });
  try{
    if(_storageOk){
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('diary:')===0) dates[k.slice(6)] = 1;
      }
    }
  }catch(e){}
  return Object.keys(dates).sort();
}

function weightOnOrBefore(date, sorted){
  var best = null;
  for(var i=0;i<sorted.length;i++){
    if(sorted[i].date <= date) best = sorted[i];
    else break;
  }
  return best;
}
function weightOnOrAfter(date, sorted){
  for(var i=0;i<sorted.length;i++){
    if(sorted[i].date >= date) return sorted[i];
  }
  return null;
}

function renderPeriodResult(el, from, to){
  if(!el) return;
  if(!from || !to){
    el.innerHTML = '<div class="empty" style="padding:8px;">Укажи даты</div>';
    return;
  }
  if(from > to){
    el.innerHTML = '<div class="empty" style="padding:8px;">«С» должно быть раньше «По»</div>';
    return;
  }

  // Еда: [from, to) — конечная дата не учитывается
  // Вес: [from, to] — обе границы
  var totalKcal = 0, totalBike = 0, daysWithFood = 0, dayCount = 0;
  var d = from;
  while(d < to){
    dayCount++;
    var entries = getDiary(d);
    var t = computeTotals(entries);
    var burn = dayBikeBurn(d);
    if(t.kcal > 0 || entries.length || burn > 0){
      totalKcal += t.kcal;
      totalBike += burn;
      if(t.kcal > 0 || entries.length) daysWithFood++;
    }
    d = shiftDate(d, 1);
    if(dayCount > 4000) break;
  }
  var totalNet = totalKcal - totalBike;
  var avgIntake = daysWithFood ? totalNet / daysWithFood : 0;

  var sorted = [...weightLog].sort(function(a,b){ return a.date.localeCompare(b.date); });
  var wStart = weightOnOrBefore(from, sorted) || weightOnOrAfter(from, sorted);
  var wEnd = weightOnOrBefore(to, sorted) || weightOnOrAfter(to, sorted);
  // prefer start at/near from and end at/near to
  if(sorted.length){
    var nearStart = null, nearEnd = null;
    sorted.forEach(function(w){
      if(w.date >= from && w.date <= to){
        if(!nearStart || w.date < nearStart.date) nearStart = w;
        if(!nearEnd || w.date > nearEnd.date) nearEnd = w;
      }
    });
    if(nearStart) wStart = nearStart;
    if(nearEnd) wEnd = nearEnd;
  }

  var html = '';
  html += '<div class="entry"><div class="name">Дней с едой (без даты «По»)</div><div class="kcal">'+dayCount+'</div></div>';
  html += '<div class="entry"><div class="name">Из них с записями</div><div class="kcal">'+daysWithFood+'</div></div>';
  html += '<div class="entry"><div class="name">Сумма калорий (еда)</div><div class="kcal">'+round(totalKcal)+'</div></div>';
  if(totalBike > 0){
    html += '<div class="entry"><div class="name">Вело (сожжено)</div><div class="kcal" style="color:var(--green);">−'+round(totalBike)+'</div></div>';
    html += '<div class="entry"><div class="name">Нетто калорий</div><div class="kcal">'+round(totalNet)+'</div></div>';
  }
  html += '<div class="entry"><div class="name">Среднее за 7 дней/день</div><div class="kcal">'+round(avgIntake)+'</div></div>';

  var maint = goals.maintenanceKcal;
  if(maint){
    var expectedMaintTotal = maint * (daysWithFood || dayCount);
    var vsMaint = totalKcal - expectedMaintTotal;
    var vsMaintDay = (daysWithFood || dayCount) ? vsMaint / (daysWithFood || dayCount) : 0;
    var vsColor = vsMaint > 50 ? 'var(--red)' : (vsMaint < -50 ? 'var(--green)' : 'var(--muted)');
    var vsSign = vsMaint > 0 ? '+' : '';
    html += '<div class="entry"><div class="name">Vs поддержание ('+maint+'/день)</div><div class="kcal" style="color:'+vsColor+';font-weight:700;">'+vsSign+round(vsMaint)+'<div style="font-size:11px;font-weight:400;">'+vsSign+round(vsMaintDay)+' ккал/день</div></div></div>';
  } else {
    html += '<div style="font-size:12px;color:var(--muted);margin:8px 0;">Укажи калории поддержания в цели по весу — будет сравнение с ними.</div>';
  }

  if(wStart && wEnd && wStart.date !== wEnd.date){
    var deltaKg = wEnd.kg - wStart.kg;
    var daysW = Math.max(1, daysBetween(wStart.date, wEnd.date));
    var kcalBalance = deltaKg * 7700; // >0 weight gain ≈ surplus stored
    var dailyFromWeight = kcalBalance / daysW;
    var dColor = deltaKg > 0.05 ? 'var(--red)' : (deltaKg < -0.05 ? 'var(--green)' : 'var(--muted)');
    var dSign = deltaKg > 0 ? '+' : '';
    html += '<div class="entry"><div class="name">Вес '+fmtDateHuman(wStart.date)+'</div><div class="kcal">'+wStart.kg+' кг</div></div>';
    html += '<div class="entry"><div class="name">Вес '+fmtDateHuman(wEnd.date)+'</div><div class="kcal">'+wEnd.kg+' кг</div></div>';
    html += '<div class="entry"><div class="name">Изменение веса</div><div class="kcal" style="color:'+dColor+';font-weight:700;">'+dSign+round(deltaKg)+' кг</div></div>';
    html += '<div class="entry"><div class="name">По весу (≈7700 ккал/кг)</div><div class="kcal" style="color:'+dColor+';">'+((kcalBalance>0)?'+':'')+round(kcalBalance)+'<div style="font-size:11px;font-weight:400;">'+((dailyFromWeight>0)?'+':'')+round(dailyFromWeight)+' ккал/день</div></div></div>';

    // Real deficit/surplus vs stated maintenance
    if(maint){
      // theoretical: eating avg vs maint
      var theoreticalDaily = avgIntake - maint; // negative = deficit
      var actualDaily = dailyFromWeight; // from scale
      var gap = actualDaily - theoreticalDaily;
      html += '<div style="font-size:12.5px;line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);">';
      html += '<div>По дневнику vs поддержание: <b style="color:'+(theoreticalDaily>0?'var(--red)':'var(--green)')+'">'+(theoreticalDaily>0?'+':'')+round(theoreticalDaily)+' ккал/день</b></div>';
      html += '<div>По весам (факт): <b style="color:'+(actualDaily>0?'var(--red)':'var(--green)')+'">'+(actualDaily>0?'+':'')+round(actualDaily)+' ккал/день</b></div>';
      html += '</div>';
    }
  } else if(!wStart || !wEnd){
    html += '<div style="font-size:12px;color:var(--muted);margin-top:8px;">Нужны записи веса на границах периода (или внутри).</div>';
  } else {
    html += '<div style="font-size:12px;color:var(--muted);margin-top:8px;">Одна точка веса — изменение не посчитать.</div>';
  }

  el.innerHTML = html;
}

var MUSCLE_MEV = {'Бицепс':4,'Брахиалис':4,'Плечевая':4,'Трицепс':4,'Грудь':6,'Широчайшие':6,'Верх спины':6,'Передняя дельта':4,'Средняя дельта':4,'Задняя дельта':4,'Предплечья':4,'Квадрицепс':6,'Задняя поверхность бедра':4,'Ягодицы':4,'Икры':4};
function muscleMev(group){return MUSCLE_MEV[group]||4;}
function muscleMevPercent(group, sets){return Math.round((+sets||0)/muscleMev(group)*100);}
function planMevSummary(){
  var load=weeklyMuscleLoad(7), groups=['Бицепс','Широчайшие','Грудь','Трицепс','Средняя дельта'];

}

function exerciseMuscleProfile(name){
  var lib=(exercises||[]).find(function(e){return (e.name||'').toLowerCase()===(name||'').toLowerCase();});
  if(lib && Array.isArray(lib.primaryMuscles) && lib.primaryMuscles.length){return {primary:lib.primaryMuscles.slice(),secondary:Array.isArray(lib.secondaryMuscles)?lib.secondaryMuscles.map(function(x){return [x.name,+x.factor||0.5];}):[]};}
  var n=(name||'').toLowerCase();
  if(/жим/.test(n) && /(узк|трицепс)/.test(n)) return {primary:['Трицепс'],secondary:[['Грудь',0.5],['Передняя дельта',0.25]]};
  if(/молот/.test(n)) return {primary:['Плечевая','Брахиалис'],secondary:[['Бицепс',0.5],['Предплечья',0.5]]};
  if(/сгиб|бицепс/.test(n)) return {primary:['Бицепс'],secondary:[['Брахиалис',0.5],['Предплечья',0.25]]};
  if(/подтяг/.test(n)) return {primary:['Широчайшие'],secondary:[['Бицепс',0.5],['Верх спины',0.5]]};
  if(/развод|подъем.*сторон|подъём.*сторон|махи.*сторон/.test(n)) return {primary:['Средняя дельта'],secondary:[['Трапеции',0.25]]};
  if(/жим.*стоя|жим.*вверх|армейск/.test(n)) return {primary:['Передняя дельта'],secondary:[['Трицепс',0.5],['Средняя дельта',0.5]]};
  if(/жим|отжим/.test(n)) return {primary:['Грудь'],secondary:[['Трицепс',0.5],['Передняя дельта',0.5]]};
  if(/присед|выпад/.test(n)) return {primary:['Квадрицепс','Ягодицы'],secondary:[['Задняя поверхность бедра',0.25]]};
  if(/румын|станов/.test(n)) return {primary:['Задняя поверхность бедра','Ягодицы'],secondary:[['Разгибатели спины',0.5]]};
  if(/икр/.test(n)) return {primary:['Икры'],secondary:[]};
  if(/тяга|греб|развод.*наклон/.test(n)) return {primary:['Широчайшие','Верх спины'],secondary:[['Бицепс',0.5],['Задняя дельта',0.5]]};
  return {primary:['Не распределено'],secondary:[]};
}
function muscleGroupForExercise(name){return exerciseMuscleProfile(name).primary.join(' / ');}
function effectiveMuscleSets(workout){
  var reps=parseSetArray(workout.sets), p=exerciseMuscleProfile(workout.name), out={};
  var rir=Array.isArray(workout.rirBySet)?workout.rirBySet:(workout.rir!=null?reps.map(function(){return +workout.rir;}):[]);
  // Approximate hard-set credit: close-to-failure sets count more; unknown RIR is shown conservatively.
  var credits=reps.map(function(_,i){var r=rir[i];return r==null?0.75:(+r<=3?1:(+r===4?0.5:0.25));});
  var total=credits.reduce(function(a,b){return a+b;},0);
  p.primary.forEach(function(m){out[m]=(out[m]||0)+total;});
  p.secondary.forEach(function(x){out[x[0]]=(out[x[0]]||0)+total*x[1];});
  return out;
}
function exercisePlateaus(daysBack){
  var endDate=shiftDate(todayStr(),-1), cutoff=shiftDate(endDate,-((daysBack||56)-1)), by={};
  function addSession(date,w){
    if(!w||!w.done||!w.sets||w.weight==null||!isFinite(+w.weight)||+w.weight<=0)return;
    var reps=parseSetArray(w.sets);if(!reps.length)return;
    var rir=Array.isArray(w.rirBySet)?w.rirBySet:(w.rir!=null?reps.map(function(){return +w.rir;}):[]);
    var e1rm=0;
    reps.forEach(function(r,i){var reserve=rir[i]==null?0:Math.min(4,+rir[i]);var est=+w.weight*(1+(r+reserve)/30);if(est>e1rm)e1rm=est;});
    var key=String(w.name||'Упражнение').trim();(by[key]||(by[key]={}))[date]=Math.max((by[key][date]||0),e1rm);
  }
  Object.keys(workoutCache).forEach(function(d){if(d>=cutoff&&d<=endDate)(workoutCache[d]||[]).forEach(function(w){addSession(d,w);});});
  Object.keys(_idbCache).forEach(function(k){if(k.indexOf('workout:')===0){var d=k.slice(8);if(d>=cutoff&&d<=endDate&&!workoutCache[d]){var a=_idbCache[k];(Array.isArray(a)?a:[]).forEach(function(w){addSession(d,w);});}}});
  try{if(_storageOk)for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('workout:')===0){var d=k.slice(8);if(d>=cutoff&&d<=endDate&&!workoutCache[d]&&!Object.prototype.hasOwnProperty.call(_idbCache,k)){var a=JSON.parse(localStorage.getItem(k)||'[]');(Array.isArray(a)?a:[]).forEach(function(w){addSession(d,w);});}}}}catch(e){}
  var out=[];Object.keys(by).forEach(function(name){var h=Object.keys(by[name]).sort().map(function(d){return {date:d,score:by[name][d]};});if(h.length<3)return;var recent=h.slice(-3),first=recent[0],last=recent[2];var span=(new Date(last.date)-new Date(first.date))/86400000;if(span<21)return;var change=first.score>0?(last.score/first.score-1)*100:0;if(change<=2)out.push({name:name,sessions:h.length,from:first.date,to:last.date,change:round(change),score:round(last.score)});});return out;
}

function weeklyMuscleLoad(days){
  var out={},n=Math.max(1,days||7),start=shiftDate(todayStr(),-(n-1));
  for(var i=0;i<n;i++){var d=shiftDate(start,i);getWorkouts(d).forEach(function(w){if(!w.done&&!w.inProgress&&!(d===todayStr()&&w.sets))return;var x=effectiveMuscleSets(w);Object.keys(x).forEach(function(k){out[k]=(out[k]||0)+x[k];});});}
  return out;
}
function weeklyMuscleLoadBefore(date,days){
  var out={},n=Math.max(1,days||7);
  for(var i=1;i<=n;i++){var d=shiftDate(date,-i);(getWorkouts(d)||[]).forEach(function(w){if(!w||(!w.done&&!w.inProgress))return;var x=effectiveMuscleSets(w);Object.keys(x).forEach(function(k){out[k]=(out[k]||0)+x[k];});});}
  return out;

function muscleRecoverySnapshot(){var groups=['Бицепс','Грудь','Широчайшие','Верх спины','Трицепс','Плечи'],load=weeklyMuscleLoad(7);return groups.map(function(m){var ago=null;for(var i=0;i<21;i++){var d=shiftDate(todayStr(),-i);if(getWorkouts(d).some(function(w){return w.done&&(effectiveMuscleSets(w)[m]||0)>0;})){ago=i;break;}}var v=load[m]||0;return {name:m,ago:ago,status:ago==null?'нет записей':ago===0?'сегодня':ago+' дн. назад',note:v>=16?'объём высокий':(ago!=null&&ago<2?'недавно нагружалась':'')};});}

function csvCell(v){

  if(/^[\s\u0000-\u001f]*[=+@]/.test(x) || (/^-/.test(x) && !/^-\d+(?:[.,]\d+)?$/.test(x))) x="'"+x;
  return '"'+x.replace(/"/g,'""')+'"';
}

function importData(ev){
  var file = ev.target.files && ev.target.files[0];
  if(!file) return;
  if(file.size>20*1024*1024){showToast('Резервная копия больше 20 МБ');ev.target.value='';return;}
  var reader = new FileReader();
  reader.onload = async function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object' || Array.isArray(data) || (data.version!=null && (!Number.isFinite(+data.version) || +data.version>10))) throw new Error('bad backup');
      var arrayKeys = ['products','weightLog','measureLog','favorites','exercises','mealTemplates'];
      arrayKeys.forEach(function(k){ if(data[k] != null && !Array.isArray(data[k])) throw new Error('bad '+k); });
      ['diary','workouts','bike','goals','waterLog','equipmentConfig','creatineLog','trainingDays','mealPlan','shopChecked','inventory','dayCompleteness','dayTemplate','recovery','muscleVolumeTargets'].forEach(function(k){
        if(data[k] != null && (typeof data[k] !== 'object' || Array.isArray(data[k]) && !['diary','workouts','bike'].includes(k))) throw new Error('bad '+k);
      });
      if(data.recovery != null && (typeof data.recovery !== 'object' || Array.isArray(data.recovery))) throw new Error('bad recovery');
      if(data.muscleVolumeTargets != null && (typeof data.muscleVolumeTargets !== 'object' || Array.isArray(data.muscleVolumeTargets))) throw new Error('bad muscleVolumeTargets');
      if(data.dayCompleteness != null && (typeof data.dayCompleteness !== 'object' || Array.isArray(data.dayCompleteness))) throw new Error('bad dayCompleteness');
      if(data.progressPhotos != null && !Array.isArray(data.progressPhotos)) throw new Error('bad progress photos');
      if(data.dayCompleteness) Object.keys(data.dayCompleteness).forEach(function(d){if(!isValidISODate(d) || typeof data.dayCompleteness[d] !== 'boolean') throw new Error('bad completeness date');});
      if(data.recovery) Object.keys(data.recovery).forEach(function(d){var r=data.recovery[d];if(!isValidISODate(d)||!r||typeof r!=='object'||Array.isArray(r))throw new Error('bad recovery row');['sleep','energy','soreness'].forEach(function(k){if(r[k]!=null&&r[k]!==''&&!isFinite(+r[k]))throw new Error('bad recovery value');});if(r.sleep!=null&&r.sleep!==''&&(+r.sleep<0||+r.sleep>24))throw new Error('bad sleep');if(r.energy!=null&&r.energy!==''&&(+r.energy<1||+r.energy>5))throw new Error('bad energy');if(r.soreness!=null&&r.soreness!==''&&(+r.soreness<1||+r.soreness>5))throw new Error('bad soreness');});
      ['diary','workouts','bike'].forEach(function(k){
        if(data[k]) Object.keys(data[k]).forEach(function(d){
          if(!isValidISODate(d) || !Array.isArray(data[k][d]) && k!=='bike') throw new Error('bad date data');
        });
      });
      if(data.recovery) Object.keys(data.recovery).forEach(function(d){if(!isValidISODate(d))throw new Error('bad recovery date');});
      if(data.dayTemplate && (typeof data.dayTemplate!=='object' || !Array.isArray(data.dayTemplate.entries))) throw new Error('bad dayTemplate');
      if(data.waterLog!=null && (typeof data.waterLog!=='object'||Array.isArray(data.waterLog)))throw new Error('bad waterLog');
      if(data.equipmentConfig!=null && (typeof data.equipmentConfig!=='object'||Array.isArray(data.equipmentConfig)))throw new Error('bad equipmentConfig');
      if(data.weightLog) data.weightLog.forEach(function(w){if(!w || !isValidISODate(w.date) || !isFinite(+w.kg) || +w.kg<=0)throw new Error('bad weight');});
      if(data.diary) Object.keys(data.diary).forEach(function(d){(data.diary[d]||[]).forEach(function(e){
        if(!e || typeof e!=='object' || Array.isArray(e))throw new Error('bad diary row');
        ['grams','kcal','protein','fat','carbs','fiber'].forEach(function(k){if(e[k]!=null && (!isFinite(+e[k]) || +e[k]<0))throw new Error('bad diary macro');});
      });});
      if(data.workouts) Object.keys(data.workouts).forEach(function(d){data.workouts[d].forEach(function(w){
        if(!w || typeof w!=='object' || Array.isArray(w))throw new Error('bad workout row');
        if(w.weight!=null && (!isFinite(+w.weight) || +w.weight<0))throw new Error('bad workout weight');
        if(w.rirBySet!=null && (!Array.isArray(w.rirBySet) || w.rirBySet.some(function(v){return !Number.isInteger(+v)||+v<0||+v>4;})))throw new Error('bad workout RIR');
      });});
      if(data.bike) Object.keys(data.bike).forEach(function(d){var b=data.bike[d];if(!b || !isFinite(+b.km) || +b.km<0)throw new Error('bad bike');});
      if(data.products) data.products.forEach(function(pr){
        if(!pr || typeof pr!=='object' || typeof pr.name!=='string')throw new Error('bad product');
        ['kcal','protein','fat','carbs','fiber'].forEach(function(k){if(pr[k]!=null && (!isFinite(+pr[k]) || +pr[k]<0))throw new Error('bad product macro');});
      });
      var nDiary=Object.keys(data.diary||{}).reduce(function(n,d){return n+(data.diary[d]||[]).length;},0);
      var nWork=Object.keys(data.workouts||{}).reduce(function(n,d){return n+(data.workouts[d]||[]).length;},0);
      var nWeight=(data.weightLog||[]).length;
      if(!confirm('Импорт заменит текущие данные. В файле: '+(data.products||[]).length+' продуктов, '+nDiary+' записей питания, '+nWork+' записей тренировок, '+nWeight+' взвешиваний. Перед импортом рекомендуется сделать экспорт текущих данных. Продолжить?')) return;
      // Снимок ключей localStorage позволяет откатить импорт при ошибке записи; новые архивы имеют версию схемы.
      // Импорт старых версий остаётся совместимым, неизвестные будущие версии отклоняются.
      var storageBackup = {};
      if(_storageOk){ for(var si=0;si<localStorage.length;si++){ var sk=localStorage.key(si); storageBackup[sk]=localStorage.getItem(sk); } }
      var oldIdbCache=Object.assign({},_idbCache);
      var oldMemStore=Object.assign({},_memStore);
      var oldState = {products:products,goals:goals,weightLog:weightLog,waterLog:waterLog,equipmentConfig:equipmentConfig,measureLog:measureLog,creatineLog:creatineLog,favorites:favorites,trainingDays:trainingDays,exercises:exercises,dayTemplate:dayTemplate,diaryCache:diaryCache,workoutCache:workoutCache,bikeCache:bikeCache,hasMealPlan:(typeof mealPlan!=='undefined'),mealPlan:(typeof mealPlan!=='undefined'?mealPlan:null),mealTemplates:[],progressPhotos:sGet('progressPhotos',[]),hasShopChecked:(typeof shopChecked!=='undefined'),shopChecked:(typeof shopChecked!=='undefined'?shopChecked:null),hasInventory:(typeof inventory!=='undefined'),inventory:(typeof inventory!=='undefined'?inventory:null)};
      try{
        // Удаляем старые датированные записи из всех хранилищ, включая IDB-only режим.
        var dynamicKeyMap={};
        Object.keys(_idbCache).forEach(function(k){if(/^(diary:|workout:|bike:|recovery:|planCustom:)/.test(k))dynamicKeyMap[k]=true;});

function openCopyToToday(entry){
  if(!entry) return;
  var m = entryMacros(entry);
  var baseGrams = m.grams != null ? m.grams : 100;
  var root = document.getElementById('modalRoot');

  function label(x){
    if(x === 0.25) return '1/4';
    if(x === 0.5) return '1/2';
    if(x === 1) return '1';
    if(x === 1.5) return '1,5';
    return '2';
  }
  function draw(){
    var g = round(baseGrams * mult);
    var k = round(m.kcal * mult);
    var p = round(m.protein * mult);
    var f = round(m.fat * mult);
    var c = round(m.carbs * mult);

      '<h2>В сегодня</h2>'+
      '<div style="font-size:14px;font-weight:600;margin-bottom:6px;">'+esc(m.name)+'</div>'+

      '<div class="field"><label>Порция</label>'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap;">'+
          mults.map(function(x){
            return '<button type="button" class="btn '+(mult===x?'primary':'ghost')+'" data-mult="'+x+'" style="flex:1;min-width:52px;padding:10px 6px;font-size:13px;">'+label(x)+'</button>';
          }).join('')+
        '</div></div>'+
      '<div class="live-calc">'+g+' г · '+k+' ккал · Б'+p+' Ж'+f+' У'+c+'</div>'+
      '<div class="sheet-actions">'+
        '<button class="btn ghost" id="cancelBtn">Отмена</button>'+
        '<button class="btn primary" id="saveBtn">Добавить в сегодня</button>'+
      '</div></div></div>';
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('ov').onclick = function(e){ if(e.target.id==='ov') closeModal(); };
    root.querySelectorAll('[data-mult]').forEach(function(b){
      b.onclick = function(){ mult = parseFloat(b.getAttribute('data-mult')); draw(); };
    });
    document.getElementById('saveBtn').onclick = function(){
      var today = todayStr();
      var list = getDiary(today).slice();
      var g = round(baseGrams * mult);
      var neu;
      if(entry.custom){
        neu = {
          id: uid(), custom: true, name: entry.name || m.name,
          kcal: round((entry.kcal||m.kcal) * mult),
          protein: round((entry.protein||m.protein) * mult),
          fat: round((entry.fat||m.fat) * mult),
          carbs: round((entry.carbs||m.carbs) * mult),
          fiber: entry.fiber != null ? round(entry.fiber * mult) : (m.fiber != null ? round(m.fiber * mult) : 0),
          meal: entry.meal || 'snack',
          time: (function(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); })()
        };
      } else {
        var prod = entry.productId ? products.find(function(p){ return p.id===entry.productId; }) : null;
        var snap = prod ? snapshotFromProduct(prod, g) : {
          name: m.name, kcal: round(m.kcal*mult), protein: round(m.protein*mult),
          fat: round(m.fat*mult), carbs: round(m.carbs*mult), fiber: round((m.fiber||0)*mult),
          foodGroup: m.foodGroup || 'other'
        };
        neu = {
          id: uid(), productId: entry.productId, grams: g, meal: entry.meal || 'snack',
          time: (function(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); })(),
          snap: snap
        };
      }
      list.push(neu);
      saveDiary(today, list);
      closeModal();
      currentDate = today;
      activeTab = 'diary';
      showToast('Добавлено в сегодня · '+label(mult));

}

}
function rememberFoodGrams(productId,grams){

  function renderResults(q){

          ev.stopPropagation();
          toggleFavorite(ev.target.getAttribute('data-fav'));
          renderResults(searchEl.value);
          return;
        }
        selected = products.find(function(p){ return p.id===el.dataset.pick; });
        var remembered=rememberedFoodGrams(selected.id);
        if(remembered){
          amountUnit='grams';gramsEl.value=remembered;
          if(productHasPortion(selected)){var pn=remembered/selected.portionGrams;if(Math.abs(pn-Math.round(pn*2)/2)<0.08){amountUnit='portions';gramsEl.value=Math.round(pn*2)/2;}}
        } else if(productHasPortion(selected)){
          amountUnit = 'portions';
          if(!gramsEl.value) gramsEl.value = '1';
        } else {
          amountUnit = 'grams';
          if(!gramsEl.value) gramsEl.value = '100';
        }
        refreshUnitUI();
        renderResults(searchEl.value);
        updateLive();
      };
    });
  }
  function updateLive(){
    var g = amountToGrams();
    if(selected && g>0){
      var f = g/100;
      var rem = remainingMacros(currentDate);
      var html = '≈ '+round(selected.kcal*f)+' ккал · Б'+round(selected.protein*f)+' Ж'+round(selected.fat*f)+' У'+round(selected.carbs*f);
      if(amountUnit === 'portions' && productHasPortion(selected)){
        html += '<div style="margin-top:2px;">= '+round(g)+' г</div>';
      } else if(productHasPortion(selected)){
        var pl = formatPortionLine(selected, g);
        if(pl) html += '<div style="margin-top:2px;">≈ '+pl+'</div>';
      }
      html += '<div style="margin-top:4px;opacity:.85;">Остаток дня: '+round(rem.kcal)+' ккал · Б'+round(rem.protein)+' Ж'+round(rem.fat)+' У'+round(rem.carbs)+'</div>';
      var alts = suggestAlternatives(selected, g, rem);
      if(alts.length){
        html += '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--red);">';
        alts.forEach(function(a){ html += '<div style="margin:4px 0;line-height:1.35;">'+a.text+'</div>'; });
        html += '</div>';
      }
      liveEl.innerHTML = html;
    } else {
      liveEl.textContent = '';
    }
  }
  renderResults('');
  renderQuickFoodPicks();
  if(searchEl) searchEl.oninput = function(){ renderResults(searchEl.value); };
  if(gramsEl) gramsEl.oninput = updateLive;
  // when editing: if product has portion and grams fits, offer portions mode
  if(selected && productHasPortion(selected) && existing && existing.grams){
    var n = existing.grams / selected.portionGrams;
    if(Math.abs(n - Math.round(n*2)/2) < 0.08){
      amountUnit = 'portions';
      gramsEl.value = Math.round(n*2)/2;
    }
  }
  refreshUnitUI();
  updateLive();
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = function(e){ if(e.target.id==='ov') closeModal(); };
  document.getElementById('saveBtn').onclick = function(){
    var entries = getDiary(currentDate);
    var timeVal = (document.getElementById('entryTime').value || nowTimeStr());
    if(mode === 'product'){
      if(!selected){ showToast('Выбери продукт'); return; }
      var g = amountToGrams();
      if(!g || g<=0){ showToast(amountUnit==='portions'?'Укажи порции':'Укажи граммы'); return; }
      if(g>5000){showToast('Порция больше 5000 г — проверь ввод');return;}
      g = Math.round(g * 10) / 10;
      rememberFoodGrams(selected.id,g);
      if(isEdit){
        existing.productId = selected.id;
        existing.grams = g;
        existing.meal = meal;
        existing.time = timeVal;
        existing.snap = snapshotFromProduct(selected, g);
        delete existing.custom;
        delete existing.name;
        delete existing.kcal;
        delete existing.protein;
        delete existing.fat;
        delete existing.carbs;
      } else {
        entries.push({id:uid(), productId:selected.id, grams:g, meal:meal, time:timeVal, snap: snapshotFromProduct(selected, g)});
      }
    } else {
      var name = (document.getElementById('customName').value || '').trim() || 'Свой приём';
      var kcal = numInput(document.getElementById('customKcal').value);
      var protein = numInput(document.getElementById('customProtein').value) || 0;
      var fat = numInput(document.getElementById('customFat').value) || 0;
      var carbs = numInput(document.getElementById('customCarbs').value) || 0;
      if(!validRange(kcal,0,5000) || ![protein,fat,carbs].every(function(v){return validRange(v,0,500); })){ showToast('Проверь значения: ккал 0–5000, БЖУ 0–500 г'); return; }
      var calcEnergy=protein*4+fat*9+carbs*4;
      if(kcal>0 && calcEnergy>0 && Math.abs(kcal-calcEnergy)>Math.max(100,kcal*.25) && !confirm('Калорийность заметно расходится с БЖУ. Сохранить всё равно?')) return;
      if(isEdit){
        existing.custom = true;
        existing.name = name;
        existing.kcal = kcal;
        existing.protein = protein;
        existing.fat = fat;
        existing.carbs = carbs;
        existing.meal = meal;
        existing.time = timeVal;
        delete existing.productId;
        delete existing.grams;
        delete existing.snap;
      } else {
        entries.push({id:uid(), custom:true, name:name, kcal:kcal, protein:protein, fat:fat, carbs:carbs, meal:meal, time:timeVal});
      }
    }
    saveDiary(currentDate, entries);
    closeModal();
    render();
  };
}

    }
    var neck = num('mNeck'), waist = num('mWaist'), chest = num('mChest');
    var bicepL = num('mBicepL'), bicepR = num('mBicepR');
    if(!isValidISODate(date)){ showToast('Укажи корректную дату'); return; }
    var vals=[neck,waist,chest,bicepL,bicepR].filter(function(v){return v!=null;});
    if(vals.some(function(v){return !validRange(v,10,200);})){showToast('Проверь замеры: допустимо 10–200 см');return;}
    if(neck==null && waist==null && chest==null && bicepL==null && bicepR==null){
      showToast('Введи хотя бы один замер'); return;
    }
    // one entry per date
    measureLog = measureLog.filter(function(m){ return m.date !== date; });
    measureLog.push({id:uid(), date:date, neck:neck, waist:waist, chest:chest, bicepL:bicepL, bicepR:bicepR});
    sSet('measureLog', measureLog);
    closeModal();
    render();
  };
}

function parsePlateInventory(text){return String(text||'').split(/[;\n]+/).map(function(x){var m=x.trim().match(/^(\d+(?:[.,]\d+)?)\s*[:xх]\s*(\d+)$/i);return m?{weight:numInput(m[1]),pairs:Math.max(0,Math.floor(+m[2]))}:null;}).filter(function(x){return x&&x.weight>0&&x.pairs>0;});}
function formatPlateInventory(arr){return (arr||[]).map(function(x){return String(x.weight)+':'+x.pairs;}).join('; ');}
function equipmentSnapWeight(name,target){
  var isDb=/гантел|молот/i.test(String(name||'')),cfg=isDb?equipmentConfig.dumbbell:equipmentConfig.barbell,base=isDb?(+cfg.handle||0):(+cfg.bar||0),plates=(cfg.plates||[]).filter(function(x){return +x.weight>0&&+x.pairs>0;});
  if(!plates.length||!(target>0))return target;
  // перебираем все допустимые сочетания блинов на одну сторону; количество задаётся парами.
  var sums=[0];plates.forEach(function(pl){var before=sums.slice();for(var n=1;n<=pl.pairs;n++)before.forEach(function(v){sums.push(v+n*(+pl.weight));});sums=Array.from(new Set(sums.map(function(v){return Math.round(v*100)/100;}))).slice(0,5000);});
  var totalTarget=+target,perSideTarget=isDb?(totalTarget-base)/2:(totalTarget-base)/2;
  if(perSideTarget<0)return base;
  var candidates=sums.map(function(v){return base+2*v;}).filter(function(v){return v<=totalTarget+0.001;});
  if(!candidates.length)return base;
  return Math.max.apply(null,candidates);
}
function openEquipmentSettings(){
  var root=document.getElementById('modalRoot'),b=equipmentConfig.barbell,d=equipmentConfig.dumbbell;
  root.innerHTML='<div class="overlay" id="equipmentOverlay"><div class="sheet"><h2>Оборудование</h2><div style="font-size:12px;color:var(--muted);margin-bottom:10px;">Количество блинов указывается парами: сколько одинаковых блинов есть на каждую сторону грифа или каждой гантели. План будет округляться до реально собираемого веса.</div><div class="section-title">Штанга</div><div class="field"><label>Вес пустого грифа, кг</label><input id="eqBar" type="number" step="0.1" inputmode="decimal" value="'+(+b.bar||0)+'"></div><div class="field"><label>Блины: вес:количество пар</label><input id="eqBarPlates" value="'+escapeHTML(formatPlateInventory(b.plates))+'" placeholder="0.5:1; 1.25:1; 2.5:2; 5:1"></div><div class="section-title">Гантели</div><div class="field"><label>Вес рукояти одной гантели, кг</label><input id="eqDb" type="number" step="0.1" inputmode="decimal" value="'+(+d.handle||0)+'"></div><div class="field"><label>Блины: вес:количество пар на одну гантель</label><input id="eqDbPlates" value="'+escapeHTML(formatPlateInventory(d.plates))+'" placeholder="0.5:2; 1.25:2; 2.5:2"></div><div class="sheet-actions"><button class="btn ghost" id="eqCancel">Отмена</button><button class="btn primary" id="eqSave">Сохранить</button></div></div></div>';
  document.getElementById('eqCancel').onclick=closeModal;document.getElementById('equipmentOverlay').onclick=function(e){if(e.target.id==='equipmentOverlay')closeModal();};
  document.getElementById('eqSave').onclick=function(){var bar=numInput(document.getElementById('eqBar').value),db=numInput(document.getElementById('eqDb').value);if(!validRange(bar,0,30)||!validRange(db,0,10)){showToast('Проверь вес грифа и рукояти');return;}equipmentConfig={barbell:{bar:bar,plates:parsePlateInventory(document.getElementById('eqBarPlates').value)},dumbbell:{handle:db,plates:parsePlateInventory(document.getElementById('eqDbPlates').value)}};sSet('equipmentConfig',equipmentConfig);closeModal();render();showToast('Оборудование сохранено');};activateModal();
}

function openGoalsForm(){
  const root=document.getElementById('modalRoot');
  var mode=goals.autoMode||'cut';

  var plan=autoGoalPlan(mode), preview=macrosFromDeficitPlan(plan.kcal,mode);
  root.innerHTML=`
    <div class="overlay" id="ov"><div class="sheet">
      <h2>Режим питания</h2><button type="button" class="btn ghost" id="openEquipmentSettings" style="width:100%;margin-bottom:10px;">⚙️ Настроить оборудование</button>

        <option value="supercut" ${mode==='supercut'?'selected':''}>Супер-сушка · −4% массы в месяц</option>
        <option value="maintain" ${mode==='maintain'?'selected':''}>Поддержание</option>
        <option value="bulk" ${mode==='bulk'?'selected':''}>Массонабор</option>
        <option value="recomp" ${mode==='recomp'?'selected':''}>Рекомпозиция тела</option>
      </select></div>
      <div class="field"><label>Оценка жира в организме, %</label><input id="gBodyFat" type="number" min="3" max="60" step="0.5" inputmode="decimal" value="${bodyFatPercent()}"></div>
      <div id="autoGoalsView" class="card" style="margin-bottom:12px;padding:12px 14px;"></div>
      <div class="field"><label>Калории поддержания</label><input id="gMaint2" type="number" inputmode="decimal" value="${goals.maintenanceKcal||''}" placeholder="например, 2200"></div>
      <label style="display:flex;align-items:flex-start;gap:10px;margin:6px 0 8px;font-size:13px;line-height:1.4;">
        <input type="checkbox" id="gWoAuto" ${goals.workoutAuto!==false?'checked':''} style="width:20px;height:20px;margin-top:2px;accent-color:var(--green);">
        <span><b>Авто-упражнения</b><br><span style="color:var(--muted);font-size:12px;">Подставлять план тренировки с учётом прошлых результатов.</span></span>
      </label>
      <div class="card" style="padding:10px 12px;margin:10px 0 12px;font-size:12px;line-height:1.45;color:var(--muted);">
        <b style="color:var(--ink);">Правила расчёта</b><br>
        Белок — 2 г на кг текущей массы тела. Жиры — 50 г ежедневно для любого режима. Углеводы заполняют оставшуюся калорийность. Калорийность режима не меняется.
      </div>
      <div class="sheet-actions"><button class="btn ghost" id="cancelBtn">Отмена</button><button class="btn primary" id="saveBtn">Сохранить</button></div>
    </div></div>`;
  var eqBtn=document.getElementById('openEquipmentSettings');if(eqBtn)eqBtn.onclick=openEquipmentSettings;
  function refresh(){
    var m=document.getElementById('gAutoMode').value, bf=Number(document.getElementById('gBodyFat').value);
    if(isFinite(bf)&&bf>=3&&bf<=60)goals.bodyFatPct=bf;
    var pl=autoGoalPlan(m), mm=macrosFromDeficitPlan(pl.kcal,m);
    var labels={cut:'Сушка',supercut:'Супер-сушка',maintain:'Поддержание',bulk:'Массонабор',recomp:'Рекомпозиция тела'};
    var fatText='50 г ежедневно';
    document.getElementById('autoGoalsView').innerHTML='<div style="font-size:13px;color:var(--muted);">'+labels[m]+'</div><div style="font-size:22px;font-weight:700;margin:2px 0 10px;">'+mm.kcal+' ккал</div><div style="font-size:13px;">Б '+mm.protein+' г · Ж '+mm.fat+' г · У '+mm.carbs+' г</div><div style="font-size:13px;color:var(--muted);margin-top:8px;">Поддержание: <b style="color:var(--ink);">'+Math.round(pl.maintenance)+' ккал</b></div><div style="font-size:11px;color:var(--muted);margin-top:3px;">'+pl.rate+' · масса тела '+mm.lean.toFixed(1)+' кг · жиры '+fatText+'</div>';
  }
  document.getElementById('gAutoMode').onchange=refresh;
  document.getElementById('gBodyFat').oninput=refresh;
  refresh();
  document.getElementById('cancelBtn').onclick=closeModal;

    goals.workoutAuto=!!document.getElementById('gWoAuto').checked;

    goals.trainKcal=goals.kcal;goals.trainProtein=goals.protein;goals.trainFat=goals.fat;goals.trainCarbs=goals.carbs;
    sSet('goals',goals);closeModal();render();
  };
}

function esc(s){
  return String(s==null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
