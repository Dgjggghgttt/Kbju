<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>КБЖУ — дневник</title>
<meta name="theme-color" content="#3c6e47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="КБЖУ">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    --bg:#eeebe3;
    --surface:#ffffff;
    --ink:#24261f;
    --muted:#8a8a7d;
    --line:#d8d4c8;
    --green:#3c6e47;
    --green-dim:#e5ede6;
    --red:#a83c3c;
    --red-dim:#f3e4e2;
    --amber:#a3792f;
    --radius-card:14px;
    --radius-pill:999px;
    --serif: Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
  }
  #app{width:100%; max-width:480px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative;}

  /* ---- top receipt summary ---- */
  .receipt{
    background:var(--surface);
    padding:18px 20px 14px;
    border-bottom:1px dashed var(--line);
  }
  .receipt-date{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .receipt-date button{
    background:none; border:none; font-size:20px; color:var(--muted); padding:4px 10px; cursor:pointer;
  }
  .receipt-date h1{
    font-family:var(--serif); font-size:17px; font-weight:400; margin:0; letter-spacing:.2px;
  }
  .receipt-date .today-link{font-size:12px; color:var(--green); font-family:var(--sans); cursor:pointer;}
  .totals-row{display:flex; justify-content:space-between; font-family:var(--mono); font-size:13px; margin-top:8px;}
  .totals-row .lab{color:var(--muted); font-family:var(--sans); font-size:11px; display:block; margin-bottom:2px;}
  .macro-tap{cursor:pointer; -webkit-tap-highlight-color:transparent; border-radius:8px; padding:4px 2px;}
  .macro-tap:active{background:var(--green-dim);}
  .kcal-line{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:var(--mono); margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);
  }
  .kcal-line .big{font-size:26px; font-weight:600;}
  .kcal-line .of{color:var(--muted); font-size:13px;}
  .bar{height:5px; border-radius:3px; background:var(--line); margin-top:8px; overflow:hidden;}
  .bar > i{display:block; height:100%; background:var(--green);}
  .bar.over > i{background:var(--red);}
  .macro-bars{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px;}
  .macro-bar-item .mb-lab{font-size:10px; color:var(--muted); margin-bottom:3px; display:flex; justify-content:space-between;}
  .macro-bar-item .mb-track{height:4px; border-radius:2px; background:var(--line); overflow:hidden;}
  .macro-bar-item .mb-track > i{display:block; height:100%; background:var(--green); border-radius:2px;}
  .macro-bar-item.over .mb-lab{color:var(--red); font-weight:700;}
  .macro-bar-item.over .mb-track > i{background:var(--red);}
  .totals-row .over-macro{color:var(--red); font-weight:700;}
  .totals-row .over-macro .lab{color:var(--red); font-weight:700;}
  .kcal-line.over-macro .big{color:var(--red);}

  /* ---- content ---- */
  #content{flex:1; overflow-y:auto; padding:14px 16px 110px;}
  .empty{color:var(--muted); text-align:center; padding:40px 20px; font-size:14px; line-height:1.6;}

  .entry{
    display:flex; align-items:center; gap:10px;
    padding:10px 2px; border-bottom:1px dotted var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry.entry-over{background:var(--red-dim); margin:0 -12px; padding-left:12px; padding-right:12px; border-radius:8px; border-bottom-color:transparent;}
  .entry.entry-over .name{color:var(--red); font-weight:600;}
  .entry .name{flex:1; font-size:14.5px;}
  .entry .bjupct{font-size:11px; color:var(--muted); font-family:var(--mono); margin-top:2px; line-height:1.35;}
  .entry.entry-over .bjupct{color:var(--red);}
  .entry .grams{color:var(--muted); font-size:12px; font-family:var(--mono);}
  .entry .kcal{font-family:var(--mono); font-size:14px; min-width:52px; text-align:right;}
  .entry .del{color:var(--muted); background:none; border:none; font-size:18px; padding:0 2px 0 6px; cursor:pointer;}

  .section-title{
    font-family:var(--serif); font-size:14px; color:var(--muted); margin:18px 0 6px; padding-top:4px;
  }
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--surface); border-radius:var(--radius-card); padding:14px 16px; margin-bottom:10px;
  }
  .prod-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--bg);}
  .prod-row:last-child{border-bottom:none;}
  .prod-row .pname{font-size:14.5px;}
  .prod-row .pmacros{font-size:11.5px; color:var(--muted); font-family:var(--mono); margin-top:2px;}
  .prod-actions button{background:none;border:none;color:var(--muted);font-size:16px;padding:2px 6px;cursor:pointer;}

  .weight-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px dotted var(--line); font-family:var(--mono); font-size:14px;}
  .weight-row .wdate{font-family:var(--sans); font-size:12.5px; color:var(--muted);}
  .weight-row .wdel{font-family:var(--sans); color:var(--muted); background:none;border:none;font-size:16px;cursor:pointer;}

  svg.chart{width:100%; height:120px; display:block;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat{background:var(--surface); border-radius:var(--radius-card); padding:12px 14px;}
  .stat .slab{font-size:11px; color:var(--muted);}
  .stat .sval{font-family:var(--mono); font-size:19px; margin-top:2px;}

  /* ---- bottom nav ---- */
  nav.tabs{
    position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs button{
    flex:1; background:none; border:none; padding:8px 2px 4px; color:var(--muted);
    font-family:var(--sans); font-size:10.5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav.tabs button .ic{font-size:19px;}
  nav.tabs button.active{color:var(--green);}

  /* ---- fab ---- */
  .fab{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom: calc(78px + env(safe-area-inset-bottom));
    max-width:448px; width:calc(100% - 32px); z-index:5;
  }
  .fab button{
    width:100%; background:var(--green); color:#fff; border:none; border-radius:var(--radius-pill);
    padding:13px; font-size:14.5px; font-weight:600; cursor:pointer; box-shadow:0 4px 14px rgba(60,110,71,.28);
  }

  /* ---- modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,20,15,.4); display:flex; align-items:flex-end; z-index:20;
  }
  .sheet{
    background:var(--bg); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  }
  .sheet h2{font-family:var(--serif); font-weight:400; font-size:17px; margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .field input, .field select{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; background:var(--surface); color:var(--ink); font-family:var(--sans);
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{flex:1; padding:12px; border-radius:var(--radius-pill); border:none; font-size:14.5px; font-weight:600; cursor:pointer;}
  .btn.primary{background:var(--green); color:#fff;}
  .btn.ghost{background:none; color:var(--muted); border:1px solid var(--line);}
  .btn.danger{background:var(--red-dim); color:var(--red);}

  .search-list{max-height:260px; overflow-y:auto; margin-top:4px; border:1px solid var(--line); border-radius:10px; background:var(--surface);}
  .search-item{padding:11px 12px; border-bottom:1px solid var(--bg); cursor:pointer; font-size:14px; display:flex; justify-content:space-between;}
  .search-item:last-child{border-bottom:none;}
  .search-item .sm{color:var(--muted); font-size:11.5px; font-family:var(--mono);}
  .search-item.selected{background:var(--green-dim);}
  .live-calc{font-family:var(--mono); font-size:13px; color:var(--muted); margin:8px 2px 2px; line-height:1.45;}

  .loading{padding:60px 20px; text-align:center; color:var(--muted); font-size:13px;}
  .toast{
    position:fixed; bottom:150px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:9px 16px; border-radius:var(--radius-pill); font-size:13px; z-index:30; opacity:0; transition:opacity .2s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div class="receipt" id="receipt"></div>
  <div id="content"><div class="loading">Загрузка…</div></div>
  <div class="fab" id="fab"></div>
  <nav class="tabs">
    <button data-tab="diary" class="active"><span class="ic">🧾</span>Дневник</button>
    <button data-tab="plan"><span class="ic">🗓️</span>План</button>
    <button data-tab="products"><span class="ic">🥫</span>Продукты</button>
    <button data-tab="weight"><span class="ic">⚖️</span>Вес</button>
    <button data-tab="report"><span class="ic">📊</span>Отчёт</button>
  </nav>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- storage helpers (robust for iOS) ---------------- */
var _memStore = {};
var _storageOk = true;

(function testStorage(){
  try{
    var t = '__test__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
  }catch(e){
    _storageOk = false;
  }
})();

function sGet(key, fallback){
  try{
    if(_storageOk){
      var raw = localStorage.getItem(key);
      if(raw) return JSON.parse(raw);
    } else if(_memStore[key] !== undefined){
      return _memStore[key];
    }
  }catch(e){}
  return fallback;
}
function sSet(key, value){
  try{
    if(_storageOk){
      localStorage.setItem(key, JSON.stringify(value));
    } else {
      _memStore[key] = value;
    }
  }catch(e){
    _storageOk = false;
    _memStore[key] = value;
    try{ showToast('Сохранение только в этой сессии'); }catch(_){}
  }
}

/* ---------------- state ---------------- */
var products = [];
var goals = {
  // Рекомендация: сохранение мышц при умеренном дефиците
  kcal: 1700, protein: 150, fat: 60, carbs: 140,
  trainKcal: 1700, trainProtein: 150, trainFat: 60, trainCarbs: 140,
  targetWeight: null, maintenanceKcal: 2000,
  fiberTarget: 28,
  vegFruitTarget: 500,
  smartAdjust: false // спокойный режим: одна норма, без автоурезки
};
var dayTemplate = null; // {entries: simplified[]}
var weightLog = [];
var measureLog = []; // {id, date, neck, waist, chest, bicepL, bicepR}
var creatineLog = {}; // date -> true
var workoutCache = {}; // date -> [{id, name, weight, sets}]
var bikeCache = {}; // date -> {km, kcal} | null
var diaryCache = {}; // date -> entries[]
var favorites = []; // product ids
var trainingDays = {}; // legacy, unused for marking
var exercises = []; // {id, name} library like products
var currentDate = todayStr();
var activeTab = 'diary';
var mealPlan = {}; // date -> [{id, productId, grams, meal}]
var shopChecked = {}; // monday -> {productId: true}
var inventory = {}; // productId -> { grams, note }
var planWeekStart = weekMonday(todayStr());
var planOpenDay = null;
// Пользовательская норма: 4 км = 100 ккал
var BIKE_KCAL_PER_KM = 25;

function isTrainingDay(date){
  // Тренировка = есть упражнения в дневнике за день
  return getWorkouts(date || currentDate).length > 0;
}
function baseGoals(date){
  // Одна норма на все дни; тренировка — только отметка, без других КБЖУ
  return {
    kcal: goals.kcal,
    protein: goals.protein,
    fat: goals.fat,
    carbs: goals.carbs
  };
}
// start of week = Monday
function weekMonday(date){
  var p = date.split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  var day = d.getDay(); // 0 Sun
  var diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
var MAX_DAY_KCAL = 2100;
var MIN_DAY_KCAL = 1400; // не опускать план ниже — дни ~900–1000 нежелательны

// Protein target: base + unpaid miss from previous day(s), vs that day's target (not only base)
function proteinGoalFor(date, depth){
  if(depth == null) depth = 0;
  if(depth > 10) return baseGoals(date).protein;
  var baseP = baseGoals(date).protein;
  var yest = shiftDate(date, -1);
  if(!getDiary(yest).length) return baseP;
  var yTarget = proteinGoalFor(yest, depth + 1);
  var yAct = computeTotals(getDiary(yest)).protein;
  var miss = yTarget - yAct;
  if(miss > 0.5){
    return round(baseP + Math.min(baseP * 0.25, miss));
  }
  return baseP;
}

function activeGoals(date){
  date = date || currentDate;
  var base = baseGoals(date);
  var adjusted = {
    kcal: base.kcal,
    protein: proteinGoalFor(date),
    fat: base.fat,
    carbs: base.carbs,
    weightPaceBoost: false
  };

  // Спокойный режим: только база + догон белка (без урезки за переедание)
  if(goals.smartAdjust === false){
    return adjusted;
  }

  var train = isTrainingDay(date);
  var deltaK = 0, deltaC = 0, deltaF = 0;
  for(var i=1;i<=6;i++){
    var d = shiftDate(date, -i);
    if(!getDiary(d).length) continue;
    var bg = baseGoals(d);
    var t = computeTotals(getDiary(d));
    deltaK += Math.max(0, t.kcal - bg.kcal);
    deltaC += Math.max(0, t.carbs - bg.carbs);
    deltaF += Math.max(0, t.fat - bg.fat);
  }

  if(deltaK > 0) adjusted.kcal = round(base.kcal - deltaK / 7);
  if(deltaC > 0) adjusted.carbs = round(base.carbs - deltaC / 7);
  if(deltaF > 0) adjusted.fat = round(base.fat - deltaF / 7);

  var yest = shiftDate(date, -1);
  var protectCarbs = false;
  if(getDiary(yest).length && isTrainingDay(yest)){
    var yBg = baseGoals(yest);
    var yT = computeTotals(getDiary(yest));
    if(yBg.carbs > 0 && yT.carbs / yBg.carbs < 0.8){
      protectCarbs = true;
      adjusted.carbs = base.carbs;
    }
  }

  var carbMin = train ? base.carbs * 0.85 : base.carbs * 0.75;
  if(protectCarbs) carbMin = base.carbs;
  adjusted.carbs = Math.max(carbMin, Math.min(base.carbs, adjusted.carbs));
  adjusted.fat = Math.max(base.fat * 0.7, Math.min(base.fat, adjusted.fat));
  var kcalMin = Math.max(MIN_DAY_KCAL, Math.round(base.kcal * 0.75));
  adjusted.kcal = Math.max(kcalMin, Math.min(MAX_DAY_KCAL, Math.min(base.kcal, adjusted.kcal)));

  var pace = weeklyWeightPace(0);
  if(pace && pace.delta < -pace.safeMax){
    var excessKg = (-pace.delta) - pace.safeMax;
    var carbBoost = Math.min(60, Math.max(15, Math.round(excessKg * 50)));
    adjusted.carbs = Math.min(base.carbs + carbBoost, base.carbs + 60);
    adjusted.kcal = Math.min(MAX_DAY_KCAL, Math.max(adjusted.kcal, base.kcal) + carbBoost * 4);
    if(adjusted.carbs < base.carbs) adjusted.carbs = base.carbs;
    adjusted.weightPaceBoost = true;
    adjusted.weightPaceDelta = pace.delta;
    adjusted.weightPaceSafe = pace.safeMax;
    adjusted.carbBoost = carbBoost;
  }

  return adjusted;
}

function dayAdvice(date){
  date = date || currentDate;
  if(date !== todayStr()) return []; // советы только на сегодня, макс. 2
  var ranked = [];

  // приоритет 1: слишком быстрый сброс веса
  var paceTip = weeklyWeightPace(0);
  if(paceTip && paceTip.delta < -paceTip.safeMax){
    ranked.push({
      pri: 1, type:'warn',
      text: 'Вес падает слишком быстро ('+round(paceTip.delta)+' кг/нед, безопаснее до −'+paceTip.safeMax+'). Ешь ближе к '+goals.kcal+' ккал, не урезай сильнее.'
    });
  }

  // приоритет 2: белок вчера
  var yest = shiftDate(date, -1);
  if(getDiary(yest).length){
    var yTot = computeTotals(getDiary(yest));
    var yProtTarget = proteinGoalFor(yest);
    var protMiss = yProtTarget - yTot.protein;
    if(protMiss > 5){
      ranked.push({ pri: 2, type:'info', text: 'Вчера белка −'+round(protMiss)+' г. Сегодня норма чуть выше — закрой белок в основных приёмах.' });
    }
  }

  // приоритет 3: план на завтра по овощам/клетчатке (недельный пробел)
  planAheadTips().forEach(function(t){ ranked.push({ pri: 3, type: t.type, text: t.text }); });

  // приоритет 4: разнообразие
  diversityTips(dietDiversity(7)).forEach(function(t){ ranked.push({ pri: 4, type: t.type, text: t.text }); });

  ranked.sort(function(a,b){ return a.pri - b.pri; });
  var out = [];
  var seen = {};
  for(var i=0;i<ranked.length && out.length<2;i++){
    var key = ranked[i].text.slice(0,40);
    if(seen[key]) continue;
    seen[key] = true;
    out.push({ type: ranked[i].type, text: ranked[i].text });
  }
  return out;
}

/** План на завтра / ближайшие дни по средним пробелам */
function planAheadTips(){
  var tips = [];
  var div = dietDiversity(7);
  if(!div || div.daysWithFood < 2) return tips;
  var fGoal = goals.fiberTarget || 28;
  var parts = [];
  if(div.avgFiber < fGoal * 0.75){
    parts.push('клетчатка ~'+round(fGoal)+' г (ср. '+round(div.avgFiber)+')');
  }
  if(div.avgVeg < 250){
    parts.push('овощи 300–400 г');
  }
  if(div.avgFruit < 120){
    parts.push('фрукты 150–200 г');
  }
  if(parts.length){
    tips.push({
      type: 'info',
      text: 'На завтра заранее: '+parts.join(', ')+'. Пример: овсянка + овощи + яблоко.'
    });
  }
  return tips;
}

function buildTomorrowPlanLines(){
  var div = dietDiversity(7);
  var lines = [];
  lines.push('Белок ~'+round((goals.protein||150)/4)+' г × 3–4 приёма (цель '+ (goals.protein||150)+' г)');
  lines.push('Калории ~'+(goals.kcal||1700));
  if(!div || div.daysWithFood < 2 || div.avgVeg < 250){
    lines.push('Овощи 300–400 г (огурец, капуста, брокколи)');
  }
  if(!div || div.daysWithFood < 2 || div.avgFruit < 120){
    lines.push('Фрукт 1–2 шт (яблоко / мандарин)');
  }
  if(!div || div.daysWithFood < 2 || div.avgFiber < 18){
    lines.push('Крупа: овсянка или гречка');
  }
  return lines;
}

function buildTomorrowPlanCard(){
  var lines = buildTomorrowPlanLines();
  return '<div class="card" style="margin-bottom:10px;padding:12px 14px;">'+
    '<div style="font-weight:600;font-size:14px;margin-bottom:6px;">План на завтра</div>'+
    lines.map(function(l){ return '<div style="font-size:12.5px;line-height:1.45;margin:4px 0;color:var(--muted);">• '+l+'</div>'; }).join('')+
  '</div>';
}

function buildTemplateCard(){
  var has = dayTemplate && dayTemplate.entries && dayTemplate.entries.length;
  var hasProd = getDiary(currentDate).some(function(e){ return !e.custom && e.productId && e.grams>0; });
  return '<div class="card" style="margin-bottom:10px;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;">'+
    '<button class="btn ghost" id="saveTplBtn" style="flex:1;padding:8px;font-size:12px;">Сохранить день как шаблон</button>'+
    '<button class="btn '+(has?'primary':'ghost')+'" id="loadTplBtn" style="flex:1;padding:8px;font-size:12px;" '+(has?'':'disabled')+'>Вставить шаблон</button>'+
    '<button class="btn '+(hasProd?'primary':'ghost')+'" id="recipeFromDayBtn" style="flex:1 1 100%;padding:8px;font-size:12px;" '+(hasProd?'':'disabled')+'>🍳 Рецепт из продуктов дня</button>'+
  '</div>';
}

function saveDayAsTemplate(){
  var entries = getDiary(currentDate);
  if(!entries.length){ showToast('День пустой'); return; }
  dayTemplate = {
    entries: entries.map(function(e){
      if(e.custom){
        return { custom:true, name:e.name, kcal:e.kcal, protein:e.protein, fat:e.fat, carbs:e.carbs, meal:e.meal };
      }
      return { productId:e.productId, grams:e.grams, meal:e.meal };
    })
  };
  sSet('dayTemplate', dayTemplate);
  showToast('Шаблон сохранён ('+dayTemplate.entries.length+')');
  render();
}

function loadDayTemplate(){
  if(!dayTemplate || !dayTemplate.entries || !dayTemplate.entries.length){
    showToast('Нет шаблона'); return;
  }
  var dest = getDiary(currentDate);
  dayTemplate.entries.forEach(function(e){
    var row = { id: uid() };
    if(e.custom){
      row.custom = true; row.name = e.name; row.kcal = e.kcal; row.protein = e.protein; row.fat = e.fat; row.carbs = e.carbs;
    } else {
      row.productId = e.productId; row.grams = e.grams;
    }
    if(e.meal) row.meal = e.meal;
    dest.push(row);
  });
  saveDiary(currentDate, dest);
  showToast('Шаблон добавлен');
  render();
}

function shoppingListFromGaps(){
  var div = dietDiversity(7);
  var items = [];
  // что уже есть в холодильнике — не дублируем
  var haveNames = {};
  products.forEach(function(p){
    if(invGet(p.id) > 0) haveNames[(p.name||'').toLowerCase()] = true;
  });
  function need(label, test){
    if(test && !Object.keys(haveNames).some(function(n){ return test.test(n); })) items.push(label);
  }
  if(!div || div.avgVeg < 250) need('Огурцы, помидоры, капуста / брокколи', /огур|помид|капуст|броккол/);
  if(!div || div.avgFruit < 120) need('Яблоки, мандарины или ягоды', /яблок|мандар|ягод/);
  if(!div || div.avgFiber < 18) need('Овсянка или гречка', /овсян|гречк/);
  if(!div || (div.groups && div.groups.protein < 5)) need('Курица / индейка / яйца / творог', /куриц|индей|яйц|творог/);
  // пустые запасы часто используемых
  products.forEach(function(p){
    if(p.excludeFromPlan) return;
    var usage = (productUsageCounts()[p.id] || 0);
    if(usage >= 3 && invGet(p.id) <= 0){
      var pack = packageStep(p) || p.portionGrams || 0;
      var price = p.price != null ? (' ~'+p.price+'₽') : '';
      var packTxt = pack ? (' ×'+pack+' г') : '';
      items.push((p.name||'?')+packTxt+price+' (часто ешь, нет в холодильнике)');
    }
  });
  if(!items.length) items.push('Рацион ок, холодильник не пустой — докупи по привычке');
  // unique
  var seen = {};
  return items.filter(function(x){ if(seen[x]) return false; seen[x]=true; return true; }).slice(0, 12);
}

function remainingMacros(date){
  date = date || currentDate;
  var g = activeGoals(date);
  var t = computeTotals(getDiary(date));
  return {
    kcal: Math.max(0, g.kcal - t.kcal),
    protein: Math.max(0, g.protein - t.protein),
    fat: Math.max(0, g.fat - t.fat),
    carbs: Math.max(0, g.carbs - t.carbs),
    goals: g,
    totals: t
  };
}

function maxGramsForProduct(product, rem){
  if(!product) return 0;
  // Limits only by kcal, fat, carbs — protein is soft, not blocking
  var limits = [];
  if(product.kcal > 0) limits.push(rem.kcal / product.kcal * 100);
  if(product.fat > 0) limits.push(rem.fat / product.fat * 100);
  if(product.carbs > 0) limits.push(rem.carbs / product.carbs * 100);
  if(!limits.length) return 500;
  var g = Math.floor(Math.min.apply(null, limits));
  return Math.max(0, g);
}

function suggestAlternatives(selected, wantedGrams, rem){
  if(!selected || !wantedGrams) return [];
  var f = wantedGrams / 100;
  var need = {
    kcal: selected.kcal * f,
    fat: selected.fat * f,
    carbs: selected.carbs * f
  };
  var over = need.kcal > rem.kcal + 5 || need.fat > rem.fat + 2 || need.carbs > rem.carbs + 2;
  if(!over) return [];

  var maxG = maxGramsForProduct(selected, rem);
  var suggestions = [];
  if(maxG >= 20 && maxG < wantedGrams){
    suggestions.push({ kind:'portion', text: 'Максимум по лимитам (ккал/Ж/У): '+maxG+' г «'+selected.name+'» (≈'+round(selected.kcal*maxG/100)+' ккал)' });
  } else if(maxG < 20){
    suggestions.push({ kind:'portion', text: 'Почти нет остатка по ккал/жирам/углеводам для этого продукта.' });
  }

  var scored = products.map(function(p){
    if(p.id === selected.id) return null;
    // skip pure sugar / empty junk (0 protein and very high carbs density)
    if((p.protein||0) < 0.5 && (p.carbs||0) > 80) return null;
    var g = maxGramsForProduct(p, rem);
    if(g < 30) return null;
    g = Math.min(g, 250);
    var pf = g/100;
    var score = 0;
    if(rem.carbs > 10) score += Math.min(p.carbs*pf, rem.carbs) * 0.3;
    score += Math.min(p.kcal*pf, rem.kcal) * 0.05;
    // slight preference for some protein without requiring it
    score += Math.min(p.protein*pf, 30) * 0.3;
    // penalize very high fat if fat remaining is low
    if(rem.fat < 15 && p.fat > 15) score -= 20;
    return { p:p, g:g, score:score, kcal:round(p.kcal*pf), protein:round(p.protein*pf), fat:round(p.fat*pf), carbs:round(p.carbs*pf) };
  }).filter(Boolean).sort(function(a,b){ return b.score - a.score; });

  if(scored[0]) suggestions.push({ kind:'alt', text: 'Лучше: '+scored[0].g+' г «'+scored[0].p.name+'» (Б'+scored[0].protein+' Ж'+scored[0].fat+' У'+scored[0].carbs+', '+scored[0].kcal+' ккал)' });
  if(scored[1]) suggestions.push({ kind:'alt', text: 'Или: '+scored[1].g+' г «'+scored[1].p.name+'» (Б'+scored[1].protein+' Ж'+scored[1].fat+' У'+scored[1].carbs+', '+scored[1].kcal+' ккал)' });

  return suggestions.slice(0, 3);
}

function parseSetArray(setsStr){
  if(!setsStr) return [];
  var s = String(setsStr).trim().toLowerCase().replace(/×/g,'x').replace(/х/g,'x');
  if(/[\d]+([\/\-\s]+[\d]+)+/.test(s) && s.indexOf('x') === -1){
    return s.split(/[\/\-\s]+/).map(function(n){ return parseInt(n,10); }).filter(function(n){ return n>0; });
  }
  var m = s.match(/(\d+)\s*x\s*(\d+)/);
  if(m){
    var a = parseInt(m[1],10), b = parseInt(m[2],10);
    // 12x3 → three sets of 12; 3x12 → three sets of 12 if a < b
    if(a <= 20 && b <= 10) return Array(b).fill(a);
    if(b <= 20 && a <= 10) return Array(a).fill(b);
    return Array(Math.min(a,b)).fill(Math.max(a,b));
  }
  var one = parseInt(s,10);
  return one > 0 ? [one] : [];
}
function parseTotalReps(setsStr){
  return parseSetArray(setsStr).reduce(function(a,b){ return a+b; }, 0);
}

function suggestNextSession(last){
  // Hypertrophy: volume first, double progression in ~8–15 reps
  if(!last || last.weight == null) return null;
  var sets = parseSetArray(last.sets);
  var w = last.weight;
  if(!sets.length){
    return { weight: w, sets: '8/8/8', text: 'Начни с 3×8 на '+w+' кг, доведи до 3×12, потом +вес.' };
  }
  var n = sets.length;
  var maxR = Math.max.apply(null, sets);
  var minR = Math.min.apply(null, sets);
  var allEqual = sets.every(function(r){ return r === maxR; });
  var vol = w * sets.reduce(function(a,b){ return a+b; }, 0);

  // Incomplete last set(s) → first finish the ladder
  if(!allEqual && minR < maxR){
    var nextSets = sets.map(function(){ return maxR; });
    var nextStr = nextSets.join('/');
    return {
      weight: w,
      sets: nextStr,
      text: 'Добей подходы до '+maxR+': '+w+' кг · '+nextStr+' (сейчас было '+last.sets+').'
    };
  }

  // All sets equal
  if(maxR < 12){
    // add 1–2 reps, prioritize first set bump style 12/12/12 → 14/12/12 after hitting 12
    var bumped = sets.slice();
    bumped[0] = maxR + 2;
    var bumpStr = bumped.join('/');
    return {
      weight: w,
      sets: bumpStr,
      text: 'Добавь повторы: '+w+' кг · '+bumpStr+'.'
    };
  }

  // Hit 12+ all sets → either more reps on first set or add weight
  // Compare volume: same weight +2 first set vs +2.5kg at ~10 reps
  var optA_sets = sets.slice();
  optA_sets[0] = maxR + 2;
  var volA = w * optA_sets.reduce(function(a,b){ return a+b; }, 0);
  var newW = Math.round((w + 2.5) * 2) / 2; // +2.5 kg steps
  var optB_reps = Math.max(6, maxR - 2);
  var optB_sets = sets.map(function(){ return optB_reps; });
  var volB = newW * optB_sets.reduce(function(a,b){ return a+b; }, 0);

  if(volB > volA * 1.02){
    return {
      weight: newW,
      sets: optB_sets.join('/'),
      text: 'Лучше поднять вес: '+newW+' кг · '+optB_sets.join('/')+' (объём '+round(volB)+' > '+round(volA)+' на текущем весе).'
    };
  }
  return {
    weight: w,
    sets: optA_sets.join('/'),
    text: 'Объём важнее: оставь '+w+' кг · '+optA_sets.join('/')+' (объём '+round(volA)+'). Когда стабильно 3×15 — тогда +вес.'
  };
}

function collectExerciseHistory(exerciseName){
  var nameLower = (exerciseName||'').toLowerCase();
  var pts = [];
  function scanDate(date, list){
    (list||[]).forEach(function(w){
      if((w.name||'').toLowerCase() === nameLower && w.weight != null && !isNaN(w.weight)){
        var reps = parseTotalReps(w.sets||'');
        var volume = w.weight * (reps > 0 ? reps : 1);
        pts.push({date:date, weight:w.weight, sets:w.sets||'', reps:reps, volume:volume});
      }
    });
  }
  Object.keys(workoutCache).forEach(function(d){ scanDate(d, workoutCache[d]); });
  try{
    if(_storageOk){
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('workout:')===0){
          var d = k.slice(8);
          if(!workoutCache[d]){
            try{
              var list = JSON.parse(localStorage.getItem(k));
              scanDate(d, list);
            }catch(e){}
          }
        }
      }
    }
  }catch(e){}
  pts.sort(function(a,b){ return a.date.localeCompare(b.date); });
  // one point per date — best volume that day (or max weight if volumes equal)
  var byDate = {};
  pts.forEach(function(p){
    if(!byDate[p.date] || p.volume > byDate[p.date].volume ||
       (p.volume === byDate[p.date].volume && p.weight > byDate[p.date].weight)){
      byDate[p.date] = p;
    }
  });
  return Object.keys(byDate).sort().map(function(d){ return byDate[d]; });
}

function exerciseProgressSvg(history){
  if(!history || history.length < 2) return '<div class="empty" style="padding:12px;">Нужно минимум 2 тренировки с весом</div>';
  // Graph volume (weight × reps) so same weight + more reps shows progress
  var vals = history.map(function(h){ return h.volume; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var range = (max - min) || 1;
  min -= range * 0.12; max += range * 0.12; range = max - min;
  var W = 300, H = 120, padL = 10, padR = 10, padT = 12, padB = 22;
  var t0 = dateToMs(history[0].date), t1 = dateToMs(history[history.length-1].date);
  var tSpan = Math.max(t1 - t0, 86400000);
  var segments = '';
  function xy(h){
    var x = padL + ((dateToMs(h.date) - t0) / tSpan) * (W - padL - padR);
    var y = padT + (1 - (h.volume - min) / range) * (H - padT - padB);
    return {x:x, y:y};
  }
  for(var i=1;i<history.length;i++){
    var a = xy(history[i-1]), b = xy(history[i]);
    var up = history[i].volume >= history[i-1].volume;
    segments += '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+(up?'#3c6e47':'#c45c4a')+'" stroke-width="2.2" stroke-linecap="round"/>';
  }
  var circles = history.map(function(h){
    var p = xy(h);
    return '<circle cx="'+p.x+'" cy="'+p.y+'" r="4.5" fill="#fff" stroke="#3c6e47" stroke-width="2"/>';
  }).join('');
  var labels = '<text x="'+padL+'" y="'+(H-4)+'" font-size="9" fill="#8a8a7d">'+history[0].date.slice(5)+'</text>'+
    '<text x="'+(W-padR)+'" y="'+(H-4)+'" font-size="9" fill="#8a8a7d" text-anchor="end">'+history[history.length-1].date.slice(5)+'</text>';
  var first = history[0], last = history[history.length-1];
  var dVol = round(last.volume - first.volume);
  var dWt = round(last.weight - first.weight);
  var dReps = (last.reps||0) - (first.reps||0);
  var summary = first.weight+' кг × '+first.reps+' → '+last.weight+' кг × '+last.reps;
  var deltas = [];
  if(dWt) deltas.push((dWt>0?'+':'')+dWt+' кг');
  if(dReps) deltas.push((dReps>0?'+':'')+dReps+' повт.');
  if(dVol) deltas.push('объём '+(dVol>0?'+':'')+dVol);
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:130px;">'+segments+circles+labels+'</svg>'+
    '<div style="font-size:12px;color:var(--muted);text-align:center;line-height:1.4;">'+summary+
    (deltas.length ? '<br><span style="color:var(--green);font-weight:600;">'+deltas.join(' · ')+'</span>' : '')+
    '</div>';
}

var MEAL_ORDER = ['breakfast','lunch','dinner','snack'];
var MEAL_LABELS = { breakfast:'Завтрак', lunch:'Обед', dinner:'Ужин', snack:'Перекус' };

function defaultMealByTime(){
  var h = new Date().getHours();
  if(h < 11) return 'breakfast';
  if(h < 16) return 'lunch';
  if(h < 21) return 'dinner';
  return 'snack';
}

function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function shiftDate(str, days){
  var d = new Date(str+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDateHuman(str){
  var d = new Date(str+'T00:00:00');
  var days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  var months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return days[d.getDay()]+', '+d.getDate()+' '+months[d.getMonth()];
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function round(n){ return Math.round(n*10)/10; }

function showToast(msg){
  try{
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }catch(e){}
}

function bikeKcalFromKm(km){
  km = parseFloat(km) || 0;
  return Math.round(km * BIKE_KCAL_PER_KM * 10) / 10;
}
function getBike(date){
  date = date || currentDate;
  if(bikeCache[date] !== undefined) return bikeCache[date];
  var b = sGet('bike:'+date, null);
  bikeCache[date] = b && b.km > 0 ? b : null;
  return bikeCache[date];

  km = parseFloat(km);
  if(!km || km <= 0 || isNaN(km)){
    bikeCache[date] = null;
    try{ if(_storageOk) localStorage.removeItem('bike:'+date); }catch(e){}

  }

function dayBikeBurn(date){

function dayNetKcal(date){
  var food = computeTotals(getDiary(date)).kcal;
  return food - dayBikeBurn(date);
}

function inferFoodGroup(name){
  var n = (name || '').toLowerCase();
  if(/огурец|помидор|томат|перец|капуст|брокколи|морков|салат|лук|кабачок|баклажан|шпинат|зелень|овощ|свекл|редьк|редис|спарж|фасоль струч|горошек зел|тыкв/.test(n)) return 'veg';
  if(/яблок|банан|апельсин|мандар|киви|ягод|клубник|черник|малин|груш|персик|фрукт|виноград|арбуз|дыня|слив|абрикос|вишня|черешня|гранат|манго/.test(n)) return 'fruit';
  if(/гречк|рис|овсян|перлов|пш[её]н|киноа|хлеб|макарон|паста|картоф|хлопья|булгур|кускус/.test(n)) return 'grain';
  if(/творог|йогурт|молоко|сыр |кефир|ряженк|сметан|протеин|казеин/.test(n)) return 'dairy';
  if(/куриц|индейк|говяд|свинин|рыб|лосос|тунц|яйц|фарш|шницел|ветчин|грудк|мясо|кревет|треск|скумбр|сельдь/.test(n)) return 'protein';
  return 'other';
}
function inferFiberPer100(name, group, carbs){
  var n = (name || '').toLowerCase();
  if(group === 'veg') return 2.5;
  if(group === 'fruit') return 2.2;
  if(/овсян|гречк|перлов|хлеб|чечевиц|фасоль|горох|киноа/.test(n)) return 3.5;
  if(group === 'grain') return 1.5;
  if(carbs > 10) return Math.min(3, carbs * 0.08);
  return 0;
}
function ensureProductMeta(p){
  if(!p) return p;
  if(!p.foodGroup) p.foodGroup = inferFoodGroup(p.name);
  if(p.fiber == null || isNaN(p.fiber)) p.fiber = inferFiberPer100(p.name, p.foodGroup, p.carbs||0);
  return p;
}

/** Снимок КБЖУ на момент записи — дневник не зависит от будущих правок базы */
function snapshotFromProduct(p, grams){
  ensureProductMeta(p);
  var f = (grams || 0) / 100;
  var grp = p.foodGroup || 'other';
  return {
    name: p.name,
    kcal: (p.kcal||0)*f,
    protein: (p.protein||0)*f,
    fat: (p.fat||0)*f,
    carbs: (p.carbs||0)*f,
    fiber: (p.fiber||0)*f,
    foodGroup: grp
  };
}
function entryMacros(e){
  if(e.custom){
    var cg = e.foodGroup || 'other';
    var gms = e.grams || 0;
    return {
      name: e.name || 'Свой приём',
      grams: e.grams != null ? e.grams : null,
      kcal: e.kcal||0,
      protein: e.protein||0,
      fat: e.fat||0,
      carbs: e.carbs||0,
      fiber: e.fiber||0,
      vegGrams: cg === 'veg' ? gms : 0,
      fruitGrams: cg === 'fruit' ? gms : 0,
      foodGroup: cg
    };
  }
  // есть снимок — всегда используем его (и после удаления продукта из базы)
  if(e.snap && e.snap.name){
    var gms2 = e.grams || 0;
    var grp2 = e.snap.foodGroup || 'other';
    return {
      name: e.snap.name,
      grams: e.grams,
      kcal: e.snap.kcal||0,
      protein: e.snap.protein||0,
      fat: e.snap.fat||0,
      carbs: e.snap.carbs||0,
      fiber: e.snap.fiber||0,
      vegGrams: grp2 === 'veg' ? gms2 : 0,
      fruitGrams: grp2 === 'fruit' ? gms2 : 0,
      foodGroup: grp2
    };
  }
  var p = products.find(function(pr){ return pr.id===e.productId; });
  if(!p) return { name: e.name || '(удалён)', grams: e.grams, kcal: e.kcal||0, protein: e.protein||0, fat: e.fat||0, carbs: e.carbs||0, fiber: e.fiber||0, vegGrams:0, fruitGrams:0, foodGroup:'other' };
  ensureProductMeta(p);
  var f = e.grams/100;
  var grp = p.foodGroup || 'other';
  return {
    name: p.name,
    grams: e.grams,
    kcal: p.kcal*f,
    protein: p.protein*f,
    fat: p.fat*f,
    carbs: p.carbs*f,
    fiber: (p.fiber||0)*f,
    vegGrams: grp === 'veg' ? e.grams : 0,
    fruitGrams: grp === 'fruit' ? e.grams : 0,
    foodGroup: grp
  };
}
function migrateDiarySnapshots(){
  try{
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(!k || k.indexOf('diary:') !== 0) continue;
      var date = k.slice(6);
      getDiary(date);
    }
  }catch(err){}
  Object.keys(diaryCache).forEach(function(d){
    var list = diaryCache[d] || [];
    var ch = false;
    list.forEach(function(e){
      if(e.custom || e.snap) return;
      if(!e.productId || !(e.grams > 0)) return;
      var p = products.find(function(pr){ return pr.id === e.productId; });
      if(p){
        e.snap = snapshotFromProduct(p, e.grams);
        ch = true;
      }
    });
    if(ch) saveDiary(d, list);
  });
}
function packageStep(p){
  if(!p) return 0;
  if(p.packageGrams > 0) return p.packageGrams;
  if(productHasPortion(p) && /штук|ломт|кусок|упак|пачк/i.test(p.portionName||'')) return p.portionGrams;
  var pm = /(\d{2,4})\s*(?:г|гр|мл)\b/i.exec(p.name || '');
  if(pm && +pm[1] >= 50 && +pm[1] <= 2000) return +pm[1];
  return 0;
}
function roundToPackage(grams, p){
  var step = packageStep(p);
  if(!step || step < 10) return grams;
  var n = Math.max(1, Math.round(grams / step));
  return n * step;
}
function invGet(id){
  var x = inventory[id];
  return x && x.grams > 0 ? x.grams : 0;
}
function invSet(id, grams, note){
  if(grams > 0) inventory[id] = { grams: round(grams), note: note || (inventory[id] && inventory[id].note) || '' };
  else delete inventory[id];
  sSet('inventory', inventory);
}
function invDeduct(id, grams){
  if(!(grams > 0) || !id) return;
  var have = invGet(id);
  if(have <= 0) return;
  // списание с запасом: не уходим в минус; «едят и другие» — можно списать не всё
  invSet(id, Math.max(0, have - grams));
}

function computeTotals(entries){
  var t = {kcal:0, protein:0, fat:0, carbs:0, fiber:0, veg:0, fruit:0};
  entries.forEach(function(e){
    var m = entryMacros(e);
    t.kcal += m.kcal; t.protein += m.protein; t.fat += m.fat; t.carbs += m.carbs;
    t.fiber += m.fiber||0; t.veg += m.vegGrams||0; t.fruit += m.fruitGrams||0;
  });
  return t;
}

/** Разнообразие за n дней до date включительно */
function dietDiversity(days){
  days = days || 7;
  var groups = { veg:0, fruit:0, grain:0, protein:0, dairy:0, other:0 };
  var names = {};
  var daysWithFood = 0, fiberSum = 0, vegSum = 0, fruitSum = 0;
  for(var i=0;i<days;i++){
    var d = shiftDate(todayStr(), -i);
    var entries = getDiary(d);
    if(!entries.length) continue;
    daysWithFood++;
    var t = computeTotals(entries);
    fiberSum += t.fiber; vegSum += t.veg; fruitSum += t.fruit;
    entries.forEach(function(e){
      var m = entryMacros(e);
      names[m.name] = true;
      if(groups[m.foodGroup] != null) groups[m.foodGroup]++;
      else groups.other++;
    });
  }
  var unique = Object.keys(names).length;
  var groupCount = 0;
  ['veg','fruit','grain','protein','dairy'].forEach(function(k){ if(groups[k] > 0) groupCount++; });
  // score 0–100
  var score = Math.min(40, unique * 2) + groupCount * 10;
  if(vegSum / Math.max(1,daysWithFood) >= 200) score += 5;
  if(fruitSum / Math.max(1,daysWithFood) >= 100) score += 5;
  if(fiberSum / Math.max(1,daysWithFood) >= 20) score += 5;
  score = Math.min(100, Math.round(score));
  return {
    unique: unique,
    groups: groups,
    groupCount: groupCount,
    daysWithFood: daysWithFood,
    avgFiber: daysWithFood ? fiberSum / daysWithFood : 0,
    avgVeg: daysWithFood ? vegSum / daysWithFood : 0,
    avgFruit: daysWithFood ? fruitSum / daysWithFood : 0,
    score: score,
    productNames: Object.keys(names)
  };
}

function diversityTips(div){
  var tips = [];
  if(!div || div.daysWithFood < 3) return tips;
  if(div.avgVeg < 200) tips.push({ type:'warn', text: 'За неделю овощей мало (~'+round(div.avgVeg)+' г/день). В план на следующие дни: 300–400 г (огурец, томаты, капуста, брокколи).' });
  if(div.avgFruit < 100) tips.push({ type:'info', text: 'Фруктов/ягод ~'+round(div.avgFruit)+' г/день. На ближайшие дни заложите 150–200 г (яблоко, мандарин, ягоды).' });
  if(div.avgFiber < 20) tips.push({ type:'warn', text: 'Клетчатка в среднем ~'+round(div.avgFiber)+' г/день (цель 25–30). Планируйте овсянку, гречку, овощи, бобовые заранее, не в конце дня.' });
  if(div.groupCount < 4) tips.push({ type:'info', text: 'Узкий набор групп ('+div.groupCount+'/5). На неделю заложите чередование: белок, крупы, овощи, фрукты, молочное.' });
  if(div.unique < 12) tips.push({ type:'info', text: 'За неделю всего '+div.unique+' разных продуктов. В списке покупок добавьте 2–3 новых позиции на неделю.' });
  if(div.score >= 70) tips.push({ type:'info', text: 'Разнообразие хорошее (индекс '+div.score+'/100). Держите тот же подход в плане на неделю.' });
  return tips;
}

function toggleFavorite(productId){
  var i = favorites.indexOf(productId);
  if(i >= 0) favorites.splice(i, 1);
  else favorites.push(productId);
  sSet('favorites', favorites);
}

function productUsageCounts(){
  var counts = {};
  function addFrom(entries){
    (entries||[]).forEach(function(e){
      if(e.productId){
        counts[e.productId] = (counts[e.productId]||0) + 1;
      }
    });
  }
  Object.keys(diaryCache).forEach(function(d){ addFrom(diaryCache[d]); });
  try{
    if(_storageOk){
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('diary:')===0){
          try{ addFrom(JSON.parse(localStorage.getItem(k)||'[]')); }catch(e){}
        }
      }
    }
  }catch(e){}
  return counts;
}

function autoFavoriteIds(){
  var counts = productUsageCounts();
  return Object.keys(counts)
    .filter(function(id){ return counts[id] >= 2; })
    .sort(function(a,b){ return counts[b] - counts[a]; })
    .slice(0, 15);
}

function isFavorite(productId){
  if(favorites.indexOf(productId) >= 0) return true;
  return autoFavoriteIds().indexOf(productId) >= 0;
}

function favoriteRank(productId){
  // lower = higher in list. Manual pin first, then by frequency
  if(favorites.indexOf(productId) >= 0) return 0;
  var counts = productUsageCounts();
  var c = counts[productId] || 0;
  if(c >= 2) return 1000 - c; // frequent next
  return 10000;
}

function productHasPortion(p){
  return p && p.portionName && p.portionGrams > 0;
}

function formatPortionLine(p, grams){
  if(!productHasPortion(p) || !grams) return null;
  var n = grams / p.portionGrams;
  // show if close to whole or half portions
  var rounded = Math.round(n * 2) / 2;
  if(Math.abs(n - rounded) < 0.08){
    var label = p.portionName;
    if(rounded === 1) return '1 '+label;
    return (rounded % 1 === 0 ? String(rounded) : String(rounded).replace('.',',')) + ' '+label;
  }
  return null;
}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===activeTab));
  var rcEl = document.getElementById('receipt');
  if(rcEl) rcEl.style.display = activeTab==='plan' ? 'none' : '';
  if(activeTab!=='plan') renderReceipt();
  const content = document.getElementById('content');
  const fab = document.getElementById('fab');
  if(activeTab==='diary'){ renderDiaryTab(content, fab); }
  else if(activeTab==='plan'){ renderPlanTab(content, fab); }
  else if(activeTab==='products'){ renderProductsTab(content, fab); }
  else if(activeTab==='weight'){ renderWeightTab(content, fab); }
  else if(activeTab==='report'){ renderReportTab(content, fab); }
}

function entriesThatCrossedGoal(entries, onlyMacro){
  var crossed = {};
  var crossedMacros = {};
  var run = { protein:0, fat:0, carbs:0, kcal:0 };
  var g = baseGoals(currentDate); // red only vs base plan
  var goalsMap = { protein: g.protein, fat: g.fat, carbs: g.carbs, kcal: g.kcal };
  // Don't "scare" with protein — only fat, carbs, kcal trigger red highlight
  var defaultKeys = ['fat','carbs','kcal'];
  var keys = onlyMacro ? [onlyMacro] : defaultKeys;
  if(onlyMacro === 'protein') keys = ['protein']; // still allow breakdown view
  entries.forEach(function(e){
    var m = entryMacros(e);
    keys.forEach(function(key){
      var before = run[key];
      var after = before + (m[key]||0);
      if(before <= goalsMap[key] && after > goalsMap[key]){
        if(key !== 'protein' || onlyMacro === 'protein'){
          crossed[e.id] = true;
          if(!crossedMacros[e.id]) crossedMacros[e.id] = [];
          crossedMacros[e.id].push(key);
        }
      }
      run[key] = after;
    });
    ['protein','fat','carbs','kcal'].forEach(function(key){
      if(keys.indexOf(key)===-1) run[key] += (m[key]||0);
    });
  });
  return { crossed: crossed, crossedMacros: crossedMacros };
}

function openMacroBreakdown(macro){

  var g = activeGoals(currentDate);

  var baseVal = base[macro];
  var info = entriesThatCrossedGoal(entries, macro);
  var rows = entries.map(function(e){
    var m = entryMacros(e);
    return { id: e.id, name: m.name, grams: m.grams, val: m[macro]||0, crossed: !!info.crossed[e.id] };
  }).filter(function(r){ return r.val > 0.05; })
    .sort(function(a,b){ return b.val - a.val; });

  var total = rows.reduce(function(s,r){ return s + r.val; }, 0);
  var over = total > baseVal; // red only vs base plan
  var root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <h2>${labels[macro] || macro} за день</h2>

          <span style="color:var(--muted)"> · план ${round(goalVal)} · база ${round(baseVal)}</span>
          ${over ? `<div style="color:var(--red);font-weight:600;margin-top:4px;">Выше базового плана на ${round(total - baseVal)} ${units[macro]}</div>` : ''}
        </div>
        <div class="card" style="max-height:55vh;overflow-y:auto;padding:4px 12px;">
          ${rows.length ? rows.map(function(r){
            var pct = total > 0 ? Math.round(r.val / total * 100) : 0;
            return `<div class="entry ${r.crossed?'entry-over':''}">
              <div style="flex:1">
                <div class="name">${r.name}${r.crossed?' · перешёл норму':''}</div>
                <div class="grams">${r.grams != null ? r.grams + ' г · ' : ''}${pct}% от дня</div>
              </div>
              <div class="kcal">${round(r.val)}</div>

}

function renderDiaryTab(content, fab){
  const entries = getDiary(currentDate);
  var dayTot = computeTotals(entries);
  var g = activeGoals(currentDate);
  var crossInfo = entriesThatCrossedGoal(entries);
  var crossed = crossInfo.crossed;
  var crossedMacros = crossInfo.crossedMacros;
  var macroShort = { protein:'Б', fat:'Ж', carbs:'У', kcal:'ккал' };
  var html = '';

  var base = baseGoals(currentDate);
  var adjNote = '';
  if(goals.smartAdjust !== false && (Math.abs(g.kcal - base.kcal) >= 15 || Math.abs(g.carbs - base.carbs) >= 5 || Math.abs(g.protein - base.protein) >= 5)){
    adjNote = `<div style="font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.4;padding:0 2px;">
      План скорректирован: ${round(g.kcal)} ккал · Б${round(g.protein)} Ж${round(g.fat)} У${round(g.carbs)}

  var tips = dayAdvice(currentDate);
  var tipsHtml = tips.length ? `<div class="card" style="margin-bottom:10px;padding:10px 12px;">${tips.map(function(t){

  }).join('')}</div>` : '';
  var planCard = (currentDate === todayStr()) ? buildTomorrowPlanCard() : '';
  var tplCard = buildTemplateCard();
  adjNote = tipsHtml + planCard + tplCard + adjNote;

  function entryRow(e){
    var m = entryMacros(e);
    var pPct = dayTot.protein > 0 ? Math.round(m.protein / dayTot.protein * 100) : 0;
    var fPct = dayTot.fat > 0 ? Math.round(m.fat / dayTot.fat * 100) : 0;
    var cPct = dayTot.carbs > 0 ? Math.round(m.carbs / dayTot.carbs * 100) : 0;
    var prod = (!e.custom && e.productId) ? products.find(function(pr){ return pr.id===e.productId; }) : null;
    var portionTxt = prod && m.grams != null ? formatPortionLine(prod, m.grams) : null;
    var gramsLine = m.grams != null
      ? (portionTxt ? (portionTxt + ' (' + m.grams + ' г)') : (m.grams + ' г'))

function openWorkoutForm(existing){
  var root = document.getElementById('modalRoot');
  var selectedEx = null;
  if(existing && existing.name){
    selectedEx = exercises.find(function(e){ return e.name.toLowerCase() === existing.name.toLowerCase(); }) || {id:null, name:existing.name};
  }
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <h2>${existing ? 'Изменить упражнение' : 'Упражнение'}</h2>
        <div class="field">
          <label>Упражнение</label>
          <input type="text" id="woSearch" placeholder="Поиск или новое название…" value="${selectedEx ? selectedEx.name : ''}">
        </div>
        <div class="search-list" id="woResults" style="max-height:140px;"></div>
        <div class="field" style="margin-top:10px;"><label>Вес, кг</label><input id="woWeight" type="number" inputmode="decimal" step="0.5" placeholder="27" value="${existing && existing.weight != null ? existing.weight : ''}"></div>
        <div class="field"><label>Подходы / повторы</label><input id="woSets" type="text" placeholder="12/12/12 или 8×3" value="${existing ? (existing.sets||'') : ''}"></div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Выбери из базы или введи новое — сохранится в библиотеку.</div>
        <div class="sheet-actions">
          <button class="btn ghost" id="cancelBtn">Отмена</button>
          <button class="btn primary" id="saveBtn">Сохранить</button>
        </div>
      </div>
    </div>`;
  var searchEl = document.getElementById('woSearch');
  var resultsEl = document.getElementById('woResults');
  function renderExResults(q){
    var ql = (q||'').toLowerCase();
    var list = exercises.filter(function(e){ return e.name.toLowerCase().indexOf(ql) !== -1; });
    list.sort(function(a,b){ return a.name.localeCompare(b.name); });
    var html = list.map(function(e){
      return '<div class="search-item '+(selectedEx && selectedEx.id===e.id?'selected':'')+'" data-ex="'+e.id+'"><span>'+e.name+'</span></div>';
    }).join('');
    if(ql && !list.some(function(e){ return e.name.toLowerCase()===ql; })){
      html = '<div class="search-item" data-new="1"><span>+ Добавить «'+(q||'')+'»</span></div>' + html;
    }
    if(!html) html = '<div class="search-item" style="color:var(--muted)">Начни вводить название</div>';
    resultsEl.innerHTML = html;
    resultsEl.querySelectorAll('[data-ex]').forEach(function(el){
      el.onclick = function(){
        selectedEx = exercises.find(function(e){ return e.id===el.dataset.ex; });
        searchEl.value = selectedEx.name;
        renderExResults(searchEl.value);
      };
    });
    var neu = resultsEl.querySelector('[data-new]');
    if(neu) neu.onclick = function(){
      selectedEx = {id:null, name:(searchEl.value||'').trim()};
      renderExResults(searchEl.value);
    };
  }
  searchEl.oninput = function(){ selectedEx = null; renderExResults(searchEl.value); };
  renderExResults(searchEl.value);
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = function(e){ if(e.target.id==='ov') closeModal(); };
  document.getElementById('saveBtn').onclick = function(){
    var name = (selectedEx && selectedEx.name) ? selectedEx.name : (searchEl.value||'').trim();
    var weight = parseFloat(document.getElementById('woWeight').value);
    var sets = (document.getElementById('woSets').value || '').trim();
    if(!name){ showToast('Выбери или введи упражнение'); return; }
    ensureExerciseInLibrary(name);
    var list = getWorkouts(currentDate);
    if(existing){
      existing.name = name;
      existing.weight = isNaN(weight) ? null : weight;
      existing.sets = sets;
    } else {
      list.push({id:uid(), name:name, weight: isNaN(weight) ? null : weight, sets:sets});
    }
    saveWorkouts(currentDate, list);
    closeModal();
    render();
  };
}

function computeRecipeFromIngredients(ings){
  // ings: [{productId, grams}]
  var tot = { kcal:0, protein:0, fat:0, carbs:0, fiber:0, grams:0 };
  var resolved = [];
  ings.forEach(function(ing){
    var p = products.find(function(x){ return x.id === ing.productId; });
    if(!p || !(ing.grams > 0)) return;
    ensureProductMeta(p);
    var f = ing.grams / 100;
    tot.kcal += (p.kcal||0)*f;
    tot.protein += (p.protein||0)*f;
    tot.fat += (p.fat||0)*f;
    tot.carbs += (p.carbs||0)*f;
    tot.fiber += (p.fiber||0)*f;
    tot.grams += ing.grams;
    resolved.push({ productId: p.id, name: p.name, grams: ing.grams });
  });
  if(tot.grams <= 0) return null;
  var per100 = {
    kcal: round(tot.kcal / tot.grams * 100),
    protein: round(tot.protein / tot.grams * 100 * 10) / 10,
    fat: round(tot.fat / tot.grams * 100 * 10) / 10,
    carbs: round(tot.carbs / tot.grams * 100 * 10) / 10,
    fiber: round(tot.fiber / tot.grams * 100 * 10) / 10,
    totalGrams: round(tot.grams),
    totalKcal: round(tot.kcal),
    ingredients: resolved
  };
  return per100;
}

function openRecipeForm(seedEntries){

    seedEntries.forEach(function(e){
      if(e.custom || !e.productId) return;
      rows.push({ productId: e.productId, grams: e.grams || 0 });
    });
  }
  if(!rows.length) rows.push({ productId: '', grams: '' });

  var recipeName = '';
  function renderSheet(){
    var nameEl = document.getElementById('rName');
    if(nameEl) recipeName = nameEl.value || recipeName;
    var lines = rows.map(function(r, idx){
      var opts = products.filter(function(p){ return !p.isRecipe; }).map(function(p){
        return '<option value="'+p.id+'"'+(p.id===r.productId?' selected':'')+'>'+p.name+'</option>';
      }).join('');

        '<div class="field" style="flex:2;"><label>Ингредиент</label>'+
        '<select class="rProd" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:14px;">'+

        '<input class="rGrams" type="number" inputmode="decimal" value="'+(r.grams||'')+'" placeholder="100"></div>'+
        '<button type="button" class="btn ghost rDel" data-ri="'+idx+'" style="padding:10px;margin-bottom:2px;">✕</button></div>';
    }).join('');

    var preview = '';
    var calc = computeRecipeFromIngredients(rows.filter(function(r){ return r.productId && r.grams>0; }));
    if(calc){
      preview = '<div style="font-size:12.5px;line-height:1.45;background:rgba(0,0,0,.04);border-radius:10px;padding:10px;margin:8px 0;">'+
        '<b>Итого на всю порцию:</b> '+calc.totalGrams+' г · '+calc.totalKcal+' ккал<br>'+
        'На 100 г: '+calc.kcal+' ккал · Б'+calc.protein+' Ж'+calc.fat+' У'+calc.carbs+
        (calc.fiber?(' · кл. '+calc.fiber):'')+'</div>';

    root.innerHTML = '<div class="overlay" id="ov"><div class="sheet">'+
      '<h2>Рецепт из продуктов</h2>'+
      '<div style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.4;">Собери блюдо из базы. Сохранится как продукт — можно добавлять одной строкой.</div>'+
      '<div class="field"><label>Название рецепта</label><input id="rName" placeholder="Чечевичные блинчики" value="'+(recipeName||'').replace(/"/g,'&quot;')+'"></div>'+
      '<div class="section-title">Ингредиенты</div>'+lines+
      '<button type="button" class="btn ghost" id="rAddIng" style="width:100%;margin-bottom:8px;">+ Ингредиент</button>'+
      preview+
      '<div class="sheet-actions">'+
        '<button class="btn ghost" id="cancelBtn">Отмена</button>'+
        '<button class="btn primary" id="saveBtn">В базу</button>'+
      '</div></div></div>';

    function syncRowsFromDom(){
      rows = [];
      root.querySelectorAll('[data-ri]').forEach(function(row){
        var sel = row.querySelector('.rProd');
        var g = row.querySelector('.rGrams');

          id: uid(),
          name: name,

var KCAL_PER_KG = 7700;

function avgIntakeLastDays(n){
  // n = null → all diary days with food
  // нетто = еда − вело (учитываем расход к поддержанию)
  var total = 0, daysWithData = 0;
  if(n == null){
    var dates = collectDiaryDates();
    dates.forEach(function(d){
      var t = computeTotals(getDiary(d));
      if(t.kcal > 0){ total += (t.kcal - dayBikeBurn(d)); daysWithData++; }
    });
  } else {
    // последние n дней включая сегодня: 0 … n-1
    for(var i=0;i<n;i++){
      var d = shiftDate(todayStr(), -i);
      var t = computeTotals(getDiary(d));
      if(t.kcal > 0){ total += (t.kcal - dayBikeBurn(d)); daysWithData++; }
    }
  }
  return {
    avg: daysWithData ? total / daysWithData : 0,
    days: daysWithData,
    total: total
  };
}

function fmtFutureDate(days){
  if(days <= 0) return 'уже достигнуто';
  if(!isFinite(days) || days > 3650) return 'более 10 лет';
  var d = new Date();
  d.setDate(d.getDate() + Math.ceil(days));
  var months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function daysUntilDate(iso){
  if(!iso) return null;
  var a = dateToMs(todayStr());
  var b = dateToMs(iso);
  return Math.round((b - a) / 86400000);
}

function projectFromAvg(current, target, maint, avgIntake){
  var kgLeft = current - target;
  if(kgLeft <= 0) return { date: 'цель уже достигнута или выше', days: 0, deficit: 0, avg: avgIntake };
  if(!avgIntake || avgIntake <= 0) return { date: 'нет данных', days: null, deficit: null, avg: 0 };
  var deficit = maint - avgIntake;
  if(deficit <= 50) return { date: 'цель не достигается', days: null, deficit: round(deficit), avg: round(avgIntake), note: 'дефицит слишком мал' };
  var days = kgLeft * KCAL_PER_KG / deficit;
  return { date: fmtFutureDate(days), days: days, deficit: round(deficit), avg: round(avgIntake) };
}

function weightByDate(current, maint, avgIntake, targetIso){
  var days = daysUntilDate(targetIso);
  if(days == null || days < 0) return null;
  if(!avgIntake || avgIntake <= 0 || !maint) return null;
  var dailyDeltaKg = (avgIntake - maint) / KCAL_PER_KG; // positive = gain
  return round(current + dailyDeltaKg * days);
}

function kcalToHitTargetByDate(current, target, maint, targetIso){
  var days = daysUntilDate(targetIso);
  if(days == null || days <= 0) return null;
  var kgLeft = current - target;
  // needed daily deficit to lose kgLeft in `days`
  var neededDeficit = (kgLeft * KCAL_PER_KG) / days;
  return round(maint - neededDeficit); // target daily intake
}

function projectWeightDate(){
  var sorted = [...weightLog].sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(!sorted.length) return null;
  var current = sorted[sorted.length-1].kg;
  var target = goals.targetWeight;
  var maint = goals.maintenanceKcal;
  if(!target || !maint) return null;

  var w7 = avgIntakeLastDays(7);
  var w30 = avgIntakeLastDays(30);
  var wall = avgIntakeLastDays(null);

  var plannedDeficit = maint - goals.kcal;
  var planned = null;
  if(target < current){
    if(plannedDeficit > 50){
      var pd = (current - target) * KCAL_PER_KG / plannedDeficit;
      planned = { date: fmtFutureDate(pd), days: pd, avg: goals.kcal, deficit: round(plannedDeficit) };
    } else {
      planned = { date: 'нужен больший дефицит', days: null, avg: goals.kcal, deficit: round(plannedDeficit) };
    }
  } else if(target > current){
    planned = { date: 'цель выше текущего — это набор', days: null };
  } else {
    planned = { date: 'уже на цели', days: 0 };
  }

  return {
    current: current,
    target: target,
    kgLeft: round(current - target),
    maint: maint,
    planned: planned,
    week: projectFromAvg(current, target, maint, w7.avg),
    month: projectFromAvg(current, target, maint, w30.avg),
    all: projectFromAvg(current, target, maint, wall.avg),
    avg7: w7,
    avg30: w30,
    avgAll: wall
  };
}

function dateToMs(str){
  var p = str.split('-');
  return new Date(+p[0], +p[1]-1, +p[2]).getTime();
}
function daysBetween(a, b){
  return Math.round((dateToMs(b) - dateToMs(a)) / 86400000);
}
function weekAvgWeight(sorted, fromDate, toDate){
  var list = sorted.filter(function(w){ return w.date >= fromDate && w.date <= toDate; });
  if(!list.length) return null;
  return list.reduce(function(s,w){ return s + w.kg; }, 0) / list.length;
}

var weekPairOffset = 0; // 0 = текущая vs прошлая, 1 = ещё на неделю назад и т.д.

function currentWeightKg(){
  if(!weightLog.length) return null;
  var s = weightLog.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  return s[s.length-1].kg;
}

/** Макс. безопасный сброс за неделю: ~1% массы, не больше 1 кг */
function safeMaxWeeklyLossKg(){
  var w = currentWeightKg();
  if(!w || w <= 0) return 0.7;
  return Math.min(1.0, Math.max(0.5, Math.round(w * 0.01 * 10) / 10));
}

function getWeekPair(sorted, offset){
  offset = offset || 0;
  var today = todayStr();
  var newerEnd = offset === 0 ? today : shiftDate(today, -7 * offset);
  var newerStart = shiftDate(newerEnd, -6);
  var olderEnd = shiftDate(newerStart, -1);
  var olderStart = shiftDate(olderEnd, -6);
  return {
    newer: { start: newerStart, end: newerEnd, avg: weekAvgWeight(sorted, newerStart, newerEnd) },
    older: { start: olderStart, end: olderEnd, avg: weekAvgWeight(sorted, olderStart, olderEnd) }
  };
}

/** weekDelta = newerAvg - olderAvg; отрицательное = сброс */
function weeklyWeightPace(offset){
  var sorted = weightLog.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  var pair = getWeekPair(sorted, offset || 0);
  if(pair.newer.avg == null || pair.older.avg == null) return null;
  return {
    delta: pair.newer.avg - pair.older.avg,
    newer: pair.newer,
    older: pair.older,
    safeMax: safeMaxWeeklyLossKg()
  };
}

function renderWeightTab(content, fab){
  const sorted = [...weightLog].sort(function(a,b){ return a.date.localeCompare(b.date); });
  // период для графика: выбранный periodFrom–periodTo или последние ~90 дней
  var chartFrom = periodFrom || null;
  var chartTo = periodTo || null;
  if(!chartFrom || !chartTo){
    if(sorted.length){
      chartTo = sorted[sorted.length-1].date;
      chartFrom = shiftDate(chartTo, -90);
      if(sorted[0].date > chartFrom) chartFrom = sorted[0].date;
    }
  }
  var ptsData = sorted.filter(function(w){
    if(chartFrom && w.date < chartFrom) return false;
    if(chartTo && w.date > chartTo) return false;
    return true;
  });
  if(ptsData.length < 2 && sorted.length >= 2){
    ptsData = sorted.slice(-Math.min(sorted.length, 20));
  }

  let chart = '';
  if(ptsData.length >= 2){
    var t0 = dateToMs(ptsData[0].date);
    var t1 = dateToMs(ptsData[ptsData.length-1].date);
    var tSpan = Math.max(t1 - t0, 86400000);
    var vals = ptsData.map(function(w){ return w.kg; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var range = (max - min) || 1;
    min -= range * 0.12; max += range * 0.12; range = max - min;
    var W = 320, H = 150, padL = 28, padR = 28, padT = 18, padB = 24;

    function xy(w){
      var x = padL + ((dateToMs(w.date) - t0) / tSpan) * (W - padL - padR);
      var y = padT + (1 - (w.kg - min) / range) * (H - padT - padB);
      return { x: x, y: y };
    }

    // continuous polyline (no dots)
    var pathD = '';
    for(var i=0;i<ptsData.length;i++){
      var p = xy(ptsData[i]);
      pathD += (i===0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
    }
    var overallDelta = ptsData[ptsData.length-1].kg - ptsData[0].kg;
    var lineColor = overallDelta > 0.05 ? '#c45c4a' : (overallDelta < -0.05 ? '#3c6e47' : '#8a8a7d');

    var startP = xy(ptsData[0]);
    var endP = xy(ptsData[ptsData.length-1]);
    var startLbl = ptsData[0].kg + '';
    var endLbl = ptsData[ptsData.length-1].kg + '';
    var dateStart = ptsData[0].date.slice(5);
    var dateEnd = ptsData[ptsData.length-1].date.slice(5);

    var deltaStr = (overallDelta > 0 ? '+' : '') + round(overallDelta) + ' кг';
    var deltaColor = overallDelta > 0.05 ? 'var(--red)' : (overallDelta < -0.05 ? 'var(--green)' : 'var(--muted)');
    var daysSpan = Math.max(1, daysBetween(ptsData[0].date, ptsData[ptsData.length-1].date));

    chart = '<div class="card" style="padding:12px 10px 10px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">'+
        '<div style="font-size:12px;color:var(--muted);">'+fmtDateHuman(ptsData[0].date)+' → '+fmtDateHuman(ptsData[ptsData.length-1].date)+'</div>'+
        '<div style="font-size:18px;font-weight:700;color:'+deltaColor.replace('var(--red)','#c45c4a').replace('var(--green)','#3c6e47').replace('var(--muted)','#8a8a7d')+';">'+deltaStr+'</div>'+
      '</div>'+
      '<div style="font-size:11px;color:var(--muted);margin-bottom:6px;">за '+daysSpan+' дн. · '+ptsData[0].kg+' → '+ptsData[ptsData.length-1].kg+' кг</div>'+
      '<svg class="chart" viewBox="0 0 '+W+' '+H+'" style="height:160px;">'+
        '<path d="'+pathD+'" fill="none" stroke="'+lineColor+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
        '<text x="'+startP.x+'" y="'+(startP.y-6)+'" font-size="10" fill="#8a8a7d" text-anchor="middle" font-family="system-ui">'+startLbl+'</text>'+
        '<text x="'+endP.x+'" y="'+(endP.y-6)+'" font-size="10" fill="#8a8a7d" text-anchor="middle" font-family="system-ui">'+endLbl+'</text>'+
        '<text x="'+padL+'" y="'+(H-4)+'" font-size="9" fill="#8a8a7d" font-family="system-ui">'+dateStart+'</text>'+
        '<text x="'+(W-padR)+'" y="'+(H-4)+'" font-size="9" fill="#8a8a7d" font-family="system-ui" text-anchor="end">'+dateEnd+'</text>'+
      '</svg></div>';
  }

  // week-to-week — свайп по парам недель
  var today = todayStr();
  var safeMax = safeMaxWeeklyLossKg();
  var pair = getWeekPair(sorted, weekPairOffset);
  var avgThis = pair.newer.avg;
  var avgPrev = pair.older.avg;
  var weekDelta = (avgThis != null && avgPrev != null) ? round(avgThis - avgPrev) : null;
  var newerLabel = weekPairOffset === 0 ? 'Эта неделя' : fmtDateHuman(pair.newer.start).replace(/,.*/,'')+'–'+fmtDateHuman(pair.newer.end).replace(/,.*/,'');
  var olderLabel = weekPairOffset === 0 ? 'Прошлая неделя' : fmtDateHuman(pair.older.start).replace(/,.*/,'')+'–'+fmtDateHuman(pair.older.end).replace(/,.*/,'');
  if(weekPairOffset > 0){
    newerLabel = pair.newer.start.slice(5)+'…'+pair.newer.end.slice(5);
    olderLabel = pair.older.start.slice(5)+'…'+pair.older.end.slice(5);
  }

  var weekHtml = '<div class="card" id="weekPairCard" style="touch-action:pan-y;">';
  weekHtml += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">';
  weekHtml += '<button type="button" id="weekPairOlder" class="btn ghost" style="padding:6px 12px;font-size:16px;" '+(weekPairOffset>=12?'disabled':'')+'>‹</button>';
  weekHtml += '<div style="font-size:12px;color:var(--muted);text-align:center;">свайп или стрелки · пара '+(weekPairOffset+1)+'</div>';
  weekHtml += '<button type="button" id="weekPairNewer" class="btn ghost" style="padding:6px 12px;font-size:16px;" '+(weekPairOffset<=0?'disabled':'')+'>›</button>';
  weekHtml += '</div>';
  weekHtml += '<div style="font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.4;">Безопасный сброс ≤ <b>−'+safeMax+' кг/нед</b> (~1% веса, макс. 1 кг). Быстрее — риск срыва и потери мышц.</div>';
  if(avgThis != null || avgPrev != null){
    weekHtml += '<div style="display:flex;gap:10px;margin-bottom:4px;">';
    weekHtml += '<div style="flex:1;background:var(--bg);border-radius:12px;padding:12px 10px;text-align:center;">'+
      '<div style="font-size:11px;color:var(--muted);margin-bottom:4px;">'+newerLabel+'</div>'+
      '<div style="font-size:20px;font-weight:700;">'+(avgThis!=null?round(avgThis):'—')+'</div>'+
      '<div style="font-size:11px;color:var(--muted);">кг · ср.</div></div>';
    weekHtml += '<div style="flex:1;background:var(--bg);border-radius:12px;padding:12px 10px;text-align:center;">'+
      '<div style="font-size:11px;color:var(--muted);margin-bottom:4px;">'+olderLabel+'</div>'+
      '<div style="font-size:20px;font-weight:700;">'+(avgPrev!=null?round(avgPrev):'—')+'</div>'+
      '<div style="font-size:11px;color:var(--muted);">кг · ср.</div></div>';
    weekHtml += '</div>';
    if(weekDelta != null){
      var tooFast = weekDelta < -safeMax;
      var dColor = tooFast ? 'var(--red)' : (weekDelta > 0 ? 'var(--red)' : (weekDelta < 0 ? 'var(--green)' : 'var(--muted)'));
      var dSign = weekDelta > 0 ? '+' : '';
      weekHtml += '<div class="entry" style="margin-top:4px;"><div class="name">Неделя к неделе'+(tooFast?' · слишком быстро':'')+'</div><div class="kcal" style="color:'+dColor+';font-weight:700;font-size:18px;">'+dSign+weekDelta+' кг</div></div>';
      if(tooFast && weekPairOffset === 0){
        weekHtml += '<div style="font-size:12.5px;color:var(--red);line-height:1.4;margin-top:6px;">Сброс быстрее −'+safeMax+' кг/нед. План на сегодня повышен углеводами (см. дневник).</div>';
      }
    }
  } else {
    weekHtml += '<div class="empty" style="padding:12px;">Мало данных за эти 2 недели</div>';
  }
  weekHtml += '</div>';

  // jump flags for list
  function jumpFlag(w, prev){
    if(!prev) return '';
    var delta = w.kg - prev.kg;
    // drop 0.5..1.5 kg → green; drop >1.5 → red; any gain → red
    if(delta <= -1.5) return '<span style="color:var(--red);font-size:11px;font-weight:700;"> ↓'+round(delta)+' кг</span>';
    if(delta <= -0.5) return '<span style="color:var(--green);font-size:11px;font-weight:700;"> ↓'+round(delta)+' кг</span>';
    if(delta >= 0.5) return '<span style="color:var(--red);font-size:11px;font-weight:700;"> ↑+'+round(delta)+' кг</span>';
    if(delta > 0.05) return '<span style="color:var(--red);font-size:11px;"> +'+round(delta)+'</span>';
    if(delta < -0.05) return '<span style="color:var(--green);font-size:11px;"> '+round(delta)+'</span>';
    return '';
  }

  const rev = [...weightLog].sort(function(a,b){ return b.date.localeCompare(a.date); });
  const proj = projectWeightDate();

  let projHtml = '';
  if(!goals.targetWeight || !goals.maintenanceKcal){
    projHtml = `<div class="card"><div class="empty" style="padding:16px;">Укажи целевой вес и калории поддержания,<br>чтобы увидеть прогноз</div>
      <button class="btn primary" id="setGoalWeightBtn" style="width:100%;margin-top:8px;">Настроить цель</button></div>`;

    projHtml = `<div class="card">

      <button class="btn ghost" id="setGoalWeightBtn" style="width:100%;margin-top:12px;">Изменить цель</button>

  content.querySelectorAll('[data-wdel]').forEach(function(b){

var periodFrom = null;
var periodTo = null;

function collectDiaryDates(){
  var dates = {};
  Object.keys(diaryCache).forEach(function(d){ dates[d]=1; });
  try{
    if(_storageOk){
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('diary:')===0) dates[k.slice(6)] = 1;
      }
    }
  }catch(e){}
  return Object.keys(dates).sort();
}

function weightOnOrBefore(date, sorted){
  var best = null;
  for(var i=0;i<sorted.length;i++){
    if(sorted[i].date <= date) best = sorted[i];
    else break;
  }
  return best;
}
function weightOnOrAfter(date, sorted){
  for(var i=0;i<sorted.length;i++){
    if(sorted[i].date >= date) return sorted[i];
  }
  return null;
}

function renderPeriodResult(el, from, to){
  if(!el) return;
  if(!from || !to){
    el.innerHTML = '<div class="empty" style="padding:8px;">Укажи даты</div>';
    return;
  }
  if(from > to){
    el.innerHTML = '<div class="empty" style="padding:8px;">«С» должно быть раньше «По»</div>';
    return;
  }

  // Еда: [from, to) — конечная дата не учитывается
  // Вес: [from, to] — обе границы
  var totalKcal = 0, totalBike = 0, daysWithFood = 0, dayCount = 0;
  var d = from;
  while(d < to){
    dayCount++;
    var entries = getDiary(d);
    var t = computeTotals(entries);
    var burn = dayBikeBurn(d);
    if(t.kcal > 0 || entries.length || burn > 0){
      totalKcal += t.kcal;
      totalBike += burn;
      if(t.kcal > 0 || entries.length) daysWithFood++;
    }
    d = shiftDate(d, 1);
    if(dayCount > 4000) break;
  }
  var totalNet = totalKcal - totalBike;
  var avgIntake = daysWithFood ? totalNet / daysWithFood : 0;

  var sorted = [...weightLog].sort(function(a,b){ return a.date.localeCompare(b.date); });
  var wStart = weightOnOrBefore(from, sorted) || weightOnOrAfter(from, sorted);
  var wEnd = weightOnOrBefore(to, sorted) || weightOnOrAfter(to, sorted);
  // prefer start at/near from and end at/near to
  if(sorted.length){
    var nearStart = null, nearEnd = null;
    sorted.forEach(function(w){
      if(w.date >= from && w.date <= to){
        if(!nearStart || w.date < nearStart.date) nearStart = w;
        if(!nearEnd || w.date > nearEnd.date) nearEnd = w;
      }
    });
    if(nearStart) wStart = nearStart;
    if(nearEnd) wEnd = nearEnd;
  }

  var html = '';
  html += '<div class="entry"><div class="name">Дней с едой (без даты «По»)</div><div class="kcal">'+dayCount+'</div></div>';
  html += '<div class="entry"><div class="name">Из них с записями</div><div class="kcal">'+daysWithFood+'</div></div>';
  html += '<div class="entry"><div class="name">Сумма калорий (еда)</div><div class="kcal">'+round(totalKcal)+'</div></div>';
  if(totalBike > 0){
    html += '<div class="entry"><div class="name">Вело (сожжено)</div><div class="kcal" style="color:var(--green);">−'+round(totalBike)+'</div></div>';
    html += '<div class="entry"><div class="name">Нетто калорий</div><div class="kcal">'+round(totalNet)+'</div></div>';
  }
  html += '<div class="entry"><div class="name">Средние нетто ккал/день</div><div class="kcal">'+round(avgIntake)+'</div></div>';

  var maint = goals.maintenanceKcal;
  if(maint){
    var expectedMaintTotal = maint * (daysWithFood || dayCount);
    var vsMaint = totalKcal - expectedMaintTotal;
    var vsMaintDay = (daysWithFood || dayCount) ? vsMaint / (daysWithFood || dayCount) : 0;
    var vsColor = vsMaint > 50 ? 'var(--red)' : (vsMaint < -50 ? 'var(--green)' : 'var(--muted)');
    var vsSign = vsMaint > 0 ? '+' : '';
    html += '<div class="entry"><div class="name">Vs поддержание ('+maint+'/день)</div><div class="kcal" style="color:'+vsColor+';font-weight:700;">'+vsSign+round(vsMaint)+'<div style="font-size:11px;font-weight:400;">'+vsSign+round(vsMaintDay)+' ккал/день</div></div></div>';
  } else {
    html += '<div style="font-size:12px;color:var(--muted);margin:8px 0;">Укажи калории поддержания в цели по весу — будет сравнение с ними.</div>';
  }

  if(wStart && wEnd && wStart.date !== wEnd.date){
    var deltaKg = wEnd.kg - wStart.kg;
    var daysW = Math.max(1, daysBetween(wStart.date, wEnd.date));
    var kcalBalance = deltaKg * 7700; // >0 weight gain ≈ surplus stored
    var dailyFromWeight = kcalBalance / daysW;
    var dColor = deltaKg > 0.05 ? 'var(--red)' : (deltaKg < -0.05 ? 'var(--green)' : 'var(--muted)');
    var dSign = deltaKg > 0 ? '+' : '';
    html += '<div class="entry"><div class="name">Вес '+fmtDateHuman(wStart.date)+'</div><div class="kcal">'+wStart.kg+' кг</div></div>';
    html += '<div class="entry"><div class="name">Вес '+fmtDateHuman(wEnd.date)+'</div><div class="kcal">'+wEnd.kg+' кг</div></div>';
    html += '<div class="entry"><div class="name">Изменение веса</div><div class="kcal" style="color:'+dColor+';font-weight:700;">'+dSign+round(deltaKg)+' кг</div></div>';
    html += '<div class="entry"><div class="name">По весу (≈7700 ккал/кг)</div><div class="kcal" style="color:'+dColor+';">'+((kcalBalance>0)?'+':'')+round(kcalBalance)+'<div style="font-size:11px;font-weight:400;">'+((dailyFromWeight>0)?'+':'')+round(dailyFromWeight)+' ккал/день</div></div></div>';

    // Real deficit/surplus vs stated maintenance
    if(maint){
      // theoretical: eating avg vs maint
      var theoreticalDaily = avgIntake - maint; // negative = deficit
      var actualDaily = dailyFromWeight; // from scale
      var gap = actualDaily - theoreticalDaily;
      html += '<div style="font-size:12.5px;line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);">';
      html += '<div>По дневнику vs поддержание: <b style="color:'+(theoreticalDaily>0?'var(--red)':'var(--green)')+'">'+(theoreticalDaily>0?'+':'')+round(theoreticalDaily)+' ккал/день</b></div>';
      html += '<div>По весам (факт): <b style="color:'+(actualDaily>0?'var(--red)':'var(--green)')+'">'+(actualDaily>0?'+':'')+round(actualDaily)+' ккал/день</b></div>';
      // implied true maintenance: intake - weight_balance_daily
      // if lost weight, actualDaily negative; trueMaint = avgIntake - actualDaily
      if(daysWithFood > 0){
        var impliedMaint = avgIntake - actualDaily;
        html += '<div style="margin-top:6px;">Оценка реального поддержания: <b>'+round(impliedMaint)+' ккал</b><div style="font-size:11px;color:var(--muted);">среднее питание − изменение веса в ккал/день</div></div>';
      }
      html += '</div>';
    }
  } else if(!wStart || !wEnd){
    html += '<div style="font-size:12px;color:var(--muted);margin-top:8px;">Нужны записи веса на границах периода (или внутри).</div>';
  } else {
    html += '<div style="font-size:12px;color:var(--muted);margin-top:8px;">Одна точка веса — изменение не посчитать.</div>';
  }

  el.innerHTML = html;
}
